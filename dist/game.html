<script>
const CHAPTERS=[
{n:1,title:'늦가을, 도착',season:'늦가을',text:`마차가 멈췄을 때, 나는 먼저 창문에 비친 내 얼굴을 보았다. 그 아이는 생각보다 침착해 보였다. 사실은 두 시간 내내 장갑 속에서 손가락을 세고 있었는데.

"도착했습니다, 아가씨."

마부의 목소리가 낯설었다. 아가씨라는 말도 낯설었다. 석 달 전까지 나는 그냥 아델라인이었고, 그 앞에는 에버하트라는 성이 있었다. 이제 서류에는 트로네라고 적혀 있다. 이름 하나를 바꾸는 데 필요한 것은 도장 세 개와 어른들의 한숨 몇 번이었다.

트로네 공작 저택은 생각보다 조용했다. 큰 저택이란 응당 시끄러울 줄 알았다. 그런데 이곳은 모든 것이 제자리에 있어서 소리조차 정돈된 느낌이었다. 현관 계단 아래에는 마중 나온 사람이 한 명뿐이었다. 검은 옷을 입은 젊은 남자였고, 서른 남짓으로 보였다. 단추 하나, 주름 하나 어긋남 없이 서 있어서, 마차보다 먼저 거기에 있었던 사람 같았다.

"마로트라고 합니다. 이 저택의 집사를 맡고 있습니다. 먼 길 오시느라 고생 많으셨습니다, 아델라인 아가씨."

그는 정확한 각도로 고개를 숙였다. 나는 그가 내 눈높이에 맞추어 허리를 굽혔다는 것을 알아챘다. 어른이 아이에게 하는 방식이 아니라, 손님에게 하는 방식으로.

"공작님은……"

말을 꺼내다 멈췄다. 물어도 되는 일인지 알 수 없었다.

"공작 각하께서는 오늘 중요한 서신 업무가 있으셔서 나오지 못하셨습니다. 대신 사과의 말씀을 전하라 하셨습니다."

아주 매끄러운 답이었다. 너무 매끄러웠다. 사과를 전하라는 말씀이 정말 있었다면 집사는 '말씀하셨습니다'라고 했을 것이다. '하셨습니다'라는 말은 대개 아무도 하지 않은 말 뒤에 붙는다.

나는 고개를 끄덕였다. 그리고 계단을 오르다, 아무 이유 없이 고개를 들었다.

이층, 가장 왼쪽 창. 커튼이 아주 조금 흔들렸다. 바람은 없었다.

나는 걸음을 멈추지 않았다. 그저 한 번 더 보았다. 이미 커튼은 조용했다.

"아가씨?"

"……아니에요."

마로트의 눈이 아주 잠깐, 내가 보던 창 쪽으로 움직였다가 돌아왔다. 그는 아무 말도 하지 않았다. 그런데 그 침묵이 이상하게 대답처럼 느껴졌다. 나는 그날 처음으로, 이 집에는 말해지지 않는 것이 말해지는 것보다 훨씬 많다는 것을 알았다.

---

방은 내가 상상한 것보다 따뜻했다. 벽난로에는 이미 불이 피워져 있었고, 창가에는 책상이 놓여 있었다. 서랍을 열어 보니 새 노트와 깃펜, 잉크병이 정확히 한 벌씩 들어 있었다. 누군가 내가 글을 쓰는 아이라는 것을 미리 알고 있었던 것이다.

그때 문이 벌컥 열렸다.

"아, 죄송해요! 노크를 먼저 했어야 했는데, 짐이 너무 무거워서 팔로 열어 버렸어요!"

커다란 가방을 끌어안은 소녀가 얼굴을 반쯤 내밀고 있었다. 모자 밖으로 삐져나온 머리카락이 벽난로 불빛을 받아 잘 익은 귤처럼 반짝였다. 뺨은 추위 때문인지 달리기 때문인지 붉었다. 그녀는 나를 보자마자 환하게 웃었다. 정말로, 방 안이 한 단계 밝아지는 웃음이었다.

"저는 탠지예요! 오늘부터 아가씨 곁에서 시중을 들게 됐어요. 본명은 따로 있는데 다들 이 머리 때문에 탠지라고 불러요. 탠저린 같다고요. 부엌 아주머니는 '꼬마 참새'라고도 부르는데, 이건 말하면 안 되는 거였나?"

"괜찮아요."

내 목소리는 작았다. 탠지는 그것을 신경 쓰지 않는 듯, 더 크게 웃었다.

"아가씨 목소리 예쁘다! 그럼 짐 풀어요!"

그녀는 정말 빠르게 움직였다. 옷을 정리하고, 침대 시트를 만지고, 쉬지 않고 이야기했다. 이 저택에서 제일 맛있는 빵은 새벽 다섯 시 반에 나오고, 마구간의 흑마는 낯선 사람을 싫어하며, 마로트 님은 사실 무서운 분이 아니라 일을 너무 잘해서 무서워 보이는 것이라고.

나는 듣다가 한 가지를 알아챘다. 탠지는 가방을 옮길 때마다 오른쪽 어깨를 아주 조금 더 낮췄다. 아침부터 무언가를 많이 날랐던 사람의 자세였다. 그런데도 그녀는 한 번도 '힘들다'고 하지 않았다.

그날은 말하지 않았다. 알아도 되는 것과 말해도 되는 것이 다르다는 걸, 나는 그때 이미 어렴풋이 알고 있었다.

---

저녁 식사는 혼자였다.

긴 식탁 끝에 놓인 의자 하나가 나를 위한 자리였고, 반대편 끝의 의자는 비어 있었다. 그런데 그 앞에도 접시와 식기가 정확히 놓여 있었다. 누구도 앉지 않을 자리에, 누군가는 매번 식기를 놓는 것이다.

"공작 각하의 자리입니다. 언제든 오실 수 있도록 준비해 둡니다."

마로트의 설명은 완벽했다. 나는 수프를 한 숟갈 떴다. 뜨겁지도 차갑지도 않은, 어린아이가 먹기 가장 좋은 온도였다.

창밖에서 낙엽이 한 번 흔들렸다. 위층 어디선가 의자가 끌리는 소리가 아주 작게 들렸다. 집사는 못 들은 듯 서 있었고, 나는 못 들은 듯 수프를 먹었다.

우리는 둘 다 연기가 서툴지 않았다.`},

{n:2,title:'가정교사의 첫 수업',season:'늦가을',text:`홀트 선생은 시계보다 정확한 사람이었다.

아침 아홉 시 정각, 서재 옆 작은 공부방의 문이 열렸고, 회색 드레스를 입은 여자가 들어왔다. 서른을 조금 넘겼을 것이다. 머리는 한 올도 흐트러지지 않게 묶여 있었고, 손에는 얇은 책 두 권이 들려 있었다. 그녀는 나를 보더니 인사도 하기 전에 먼저 책상 위의 물건들을 훑어보았다. 깃펜의 각도, 노트의 위치, 내 발이 바닥에 닿는지까지.

홀트 선생의 펜이 멈췄다. 그녀는 잠깐 나를 바라보다가 다음 질문으로 넘어갔다. 그 뒤로 한 시간 동안 나는 문장 하나 이상을 말해 본 적이 없었다. 묻는 것에는 맞게 대답했다. 하지만 짧게, 필요한 만큼만. 설명을 덧붙이는 것은 잘난 척처럼 느껴졌고, 틀릴까 봐 겁이 나기도 했다.

"아가씨는 아는 것을 더 말씀하실 수 있는데도 하지 않으시는군요. 겸손과 게으름은 구별해야 합니다. 저는 내일부터 아가씨가 문장으로 대답하기를 요구하겠습니다."

게으름이라는 말이 가슴 어딘가를 아프게 눌렀다. 그렇지만 나는 해명하지 않았다. 해명은 말이 많아지는 일이고, 말이 많아지면 목소리가 떨릴 것 같았다.

---

그날 오후, 홀트 선생이 내 노트를 검사했다.

공부방 책상 위에는 새 노트와 함께 낡은 노트가 하나 더 있었다. 집에서 가져온 내 것이었다. 선생은 수업 필기를 보려다가, 그 낡은 노트를 함께 펼쳤다. 거기에는 수업과 상관없는 것들이 적혀 있었다.

*—마로트 님은 왼손으로 시계를 보지 않는다. 시간은 항상 벽의 시계로 확인한다. 회중시계는 고장 났거나, 누군가의 것이다.*
*—부엌 아주머니는 새벽 다섯 시 반에 빵을 꺼낸다. 탠지는 오른쪽 어깨가 처졌다. 아침에 물을 길어 온다.*
*—식탁의 반대편 의자는 매일 밤 열 시에 누군가 앉았다 간 것처럼 약간 어긋나 있다.*

선생은 한참 동안 아무 말도 하지 않았다. 페이지를 한 장 넘기고, 또 한 장 넘겼다. 그리고 낮은 목소리로 물었다.

"이걸 직접 쓰셨습니까?"

"……네."

"왜 이런 것을 적으십니까?"

"몰라서요."

솔직한 대답이었다. 모르는 것이 많은 집에서 나는 아는 것을 적어 두는 수밖에 없었다.

선생은 노트를 덮고 안경을 고쳐 썼다. 그 손끝이 아주 약간 떨렸다는 것을, 나는 보았다.

"내일은 문장으로 대답하는 대신, 관찰한 것을 하나씩 말씀해 주십시오. 틀려도 좋습니다. 틀리는 것과 말하지 않는 것은 다른 일이니까요."

그것은 사과가 아니었다. 하지만 오늘 아침의 말을 조용히 거두어들이는 방식이었다.

"……네, 선생님."

"그리고 한 가지 더." 선생은 노트를 내 쪽으로 밀며 시선을 피했다. "마로트 씨의 회중시계는 고장 난 것이 아닙니다. 그분의 것이 아니라서 차지 않으실 뿐이지요. 이 정도는 알려 드려도 수업에 지장은 없겠지요."

나는 대답하지 못했다. 선생은 이미 책을 챙기고 있었다. 문가에서 그녀가 아주 작게 덧붙였다.

"내일 아홉 시입니다. 늦지 마십시오."

문이 닫힌 뒤에야 나는 내가 웃고 있다는 걸 알았다. 아주 조금, 입꼬리만. 이 집에 온 뒤로 처음이었다.`},
{n:3,title:'부엌의 소식통',season:'초겨울',text:`부엌은 저택에서 유일하게 소리가 정돈되지 않은 곳이었다.

냄비 뚜껑이 부딪치는 소리, 반죽을 내리치는 소리, 누군가 큰 소리로 웃다가 더 큰 목소리에 혼나는 소리. 복도를 지나는 동안 조용하던 집이 이 문 하나 안에서는 갑자기 살아 있었다.

"아가씨는 여기 앉으세요! 제일 따뜻한 자리예요!"

탠지가 화덕 옆 낮은 의자를 끌어다 놓았다. 나는 그 의자에 앉았고, 탠지는 마치 극장 지배인이라도 되는 것처럼 두 팔을 활짝 펼쳤다.

"자, 소개할게요. 이 저택에서 알아야 할 사람은 열두 명이고, 그중 일곱 명은 저한테 빚이 있어요."

"빚이요?"

"비밀 하나씩이요! 아, 비밀을 팔았다는 게 아니라 들어 줬다는 뜻이에요!"

그날 오전 내내, 나는 탠지의 입을 통해 이 집을 알게 되었다.

화덕 앞에서 반죽을 치는 둥근 얼굴의 여자는 부엌 아주머니였다. 이름은 마르타인데 아무도 이름으로 부르지 않았다. 손은 크고, 목소리는 더 컸고, 나를 보자마자 설탕 입힌 호두 한 알을 손바닥에 올려 주며 말했다.

"말랐네. 이 집 사람들은 다 말랐어. 주인부터가 그래."

마구간을 맡은 말 없는 마부는 나흘에 한 번만 웃는다고 했다. 정원사 할아버지는 장미에게만 존댓말을 쓰고, 세탁실의 쌍둥이 자매는 서로의 말을 끝까지 들어 본 적이 없다고 했다. 탠지는 그 모든 것을 손짓과 표정까지 곁들여 이야기했다. 나는 대부분 듣기만 했다. 그런데 신기하게도 지루하지 않았다. 탠지의 말은 흘러가는 물소리 같아서, 듣고 있으면 마음이 풀렸다.

"그리고 마로트 님!"

탠지가 목소리를 낮췄다. 낮췄다고 하기엔 아직 충분히 컸지만.

"저 분이 이 집에서 제일 무서워 보이는 거 아시죠? 그런데 사실 새벽 네 시에 일어나서 제일 먼저 마구간 말들 상태를 확인하세요. 아무도 안 시켰는데요. 그리고 제가 처음 이 집에 왔을 때, 첫 달 월급을 받자마자 제 구두 밑창이 닳은 걸 보시고는 아무 말도 없이 새 구두를 주문해 주셨어요. 청구서에는 '비품 교체'라고 적혀 있었고요."

"……비품이요."

"네! 저를 비품 취급하시는 거죠! 그런데 구두는 정말 편해요!"

"탠지 양."

문가에서 낮은 목소리가 들렸다. 마로트가 서 있었다. 언제부터 있었는지 알 수 없었다. 그는 부엌의 소란 속에서도 한 걸음의 소리조차 내지 않는 사람이었다.

"오전 수업 전에 아가씨의 방 벽난로 재를 확인했는지 묻고 싶습니다."

"했어요! 마로트 님이 확인하시기 전에 제가 먼저 확인했어요!"

"그것은 확인이 아니라 선수입니다."

"선수도 확인이에요!"

마로트의 입꼬리가 아주 조금 움직였다. 웃음이라고 부르기에는 너무 작았지만, 무표정이라고 하기에는 분명히 달랐다.

"……오렌지 양은 오늘도 변함없으시군요."

"오렌지 양이라니! 오늘은 기분이 좋으신가 봐요!"

마로트는 대답 없이 고개를 한 번 숙이고 사라졌다. 탠지가 내 쪽으로 몸을 기울여 속삭였다.

"저 호칭, 기분 좋으실 때만 쓰세요. 한 달에 두 번쯤이요."

나는 그것을 노트에 적을 생각을 했다. *마로트 님은 기분이 좋으면 호칭이 바뀐다.* 그리고 그가 오렌지 양이라고 부를 때, 아주 잠깐 눈이 부드러워진다는 것도.

---

점심이 지나고 부엌이 조용해졌을 때, 나는 탠지가 앞치마 주머니에 무언가를 몰래 넣는 것을 보았다.

마른 빵 한 덩이였다. 점심에 나온 것보다 크기가 컸고, 아직 반쯤 남은 것을 손수건에 싸서 넣고 있었다. 그녀는 내가 보고 있다는 걸 알아채자 환하게 웃었다.

"아, 이거요? 나중에 출출할 때 먹으려고요! 저 원래 간식 모아 두는 습관이 있어요!"

그 웃음은 완벽했다. 그런데 너무 빨랐다. 질문이 나오기 전에 먼저 도착한 대답이었다.

나는 고개를 끄덕였다. 그리고 다른 것을 보았다.

탠지가 설거지통에서 물동이를 들어 올릴 때, 장갑 끝으로 손바닥이 잠깐 보였다. 붉게 부르튼 자국이 겹겹이 있었다. 새로 생긴 것이 아니라, 아물기 전에 또 쓰고 또 쓴 손이었다. 그녀는 곧 손을 앞치마에 감추고, 아무 일 없다는 듯이 다음 이야기를 이어 갔다.

"아가씨, 저 집 담장 옆 과수원에 가 보셨어요? 거기 사과가 진짜……"

"탠지."

"네!"

"……내일 아침 물은 제가 같이 길어도 돼요?"

탠지의 웃음이 멈췄다. 아주 짧은 순간이었다. 나는 그 순간 그녀의 얼굴에서 처음으로 웃음이 아닌 것을 보았다. 놀람과, 그 뒤에 따라온 무언가. 안도라고 하기엔 너무 조심스러웠고, 두려움이라고 하기엔 너무 따뜻한 것.

"아가씨는 아가씨시잖아요. 그런 건 제 일이에요!"

"그럼 같이 걸어가는 건요?"

탠지는 한참 나를 보다가 소리 내어 웃었다. 이번 웃음은 앞의 것과 달랐다. 조금 늦게 도착한, 진짜 웃음이었다.

"……그건, 안 될 거 없죠."

---

그날 저녁, 나는 잠들기 전에 서랍에서 작은 연고 통을 꺼냈다. 어젯밤 방에 놓여 있던 것이었다. 누가 두었는지는 적혀 있지 않았다. 내 손은 부르튼 곳이 없었으니 나를 위한 것은 아니었을 것이다. 아마도 마로트일 것이다. 그는 말하지 않고 준비해 두는 사람이니까.

나는 그것을 들고 부엌 뒤편 하녀들의 방으로 갔다. 탠지의 방은 가장 끝에 있었다. 문 아래로 가느다란 불빛이 새어 나왔고, 안에서 작은 소리가 들렸다. 웃음소리가 아니라 숨을 고르는 소리였다.

나는 노크하지 않았다. 대신 문 앞 바닥에 연고 통을 내려놓고, 아무것도 적지 않은 채 돌아섰다. 노크를 하면 그녀는 웃으며 문을 열 것이고, 그러면 나는 그 웃음을 마주해야 한다. 오늘은 그녀가 웃지 않아도 되는 밤이어야 했다.

복도 끝에서 돌아보니 문틈의 불빛이 한 번 흔들렸다.

아침에 일어나 보니 문 앞에는 빈 연고 통이 아니라, 작은 귤 하나가 놓여 있었다. 껍질에는 서툰 글씨로 한 줄이 새겨져 있었다.

*물동이는 반만 채워요. 약속!*

나는 그 귤을 한참 보다가 노트에 적었다.

*—탠지는 웃음으로 모든 것을 감춘다. 그러니 웃지 않아도 되는 자리를 만들어 주어야 한다.*

그리고 그 아래 한 줄을 더 적었다.

*—나는 이 집에서 처음으로 누군가를 도울 수 있을 것 같다.*`},

{n:4,title:'불 켜진 서재 앞의 찻잔',season:'한겨울',text:`서재가 이층 가장 왼쪽 방이라는 것을 안 것은, 도착하고 열흘째 되는 밤이었다.

잠이 오지 않아 복도로 나왔다. 발바닥에 닿는 마룻바닥이 얼음처럼 찼다. 벽의 촛대는 하나 건너 하나씩만 불이 켜져 있었고, 그 불빛이 닿지 않는 복도 끝에서, 문 아래로 가느다란 노란 선이 새어 나왔다.

종이 넘기는 소리가 들렸다. 펜이 사각거리다 멈추고, 한참 있다가 다시 이어졌다. 그것이 전부였다. 기침도, 한숨도, 혼잣말도 없었다. 사람이 안에 있다는 것을 아는 사람만이 알아챌 수 있는, 아주 조용한 소리였다.

나는 노크를 하지 못했다. 노크를 한다면 무슨 말을 해야 할지 몰랐다. 안녕하세요도, 감사합니다도, 아버지가 보고 싶어요도, 모두 틀린 말 같았다.

그래서 나는 돌아서서 부엌으로 내려갔다.

탠지가 말해 준 적이 있었다. 화덕 위의 작은 주전자는 밤새 불을 약하게 둔 채로 놓아둔다고. 누가 마시는 것이냐고 물었더니 탠지는 어깨를 으쓱했다. "아무도 안 마셔요. 근데 아무도 치우라고도 안 하세요."

그 말이 떠올랐다. 나는 아무도 마시지 않는 물로 차를 우렸다. 잎은 선반 맨 아래에서 찾았다. 가장 낡은 통이었고, 가장 자주 열린 흔적이 있는 통이었다. 잔은 하나만 꺼냈다.

이층까지 올라가는 동안 찻물이 두 번 흘렀다. 나는 서재 문 앞 바닥에 잔을 내려놓았다. 문과 정확히 평행하게. 그리고 소리 없이 방으로 돌아와 이불 속에 숨었다. 심장이 필요 이상으로 크게 뛰고 있었다.

---

아침에 복도로 나가 보니 잔은 사라져 있었다.

그날 점심 무렵, 마로트가 쟁반에 얹어 내 찻잔을 돌려주었다. 닦여 있었다. 그는 아무 말도 덧붙이지 않았고, 나도 묻지 않았다. 다만 잔 바닥에 마른 얼룩이 한 줄 남아 있었다. 차는 반쯤 마셔진 것이었다.

그날 밤에도 나는 차를 우렸다. 다음 날에도.

사흘째 밤에는 서재 문 앞에서 한참 서 있다가, 잔 옆에 작은 쪽지를 놓을까 생각했다. 하지만 무엇을 써야 할지 몰라서 그만두었다. 쪽지란 대답을 요구하는 물건이고, 나는 대답을 받을 준비가 되어 있지 않았다.

그리고 닷새째 밤, 복도에서 마로트와 마주쳤다.

"아가씨. 이 시간의 복도는 춥습니다."

그는 램프를 들고 있었다. 나는 놀라지 않은 척했다. 놀랐다는 것을 들키지 않을 만큼은 연기를 배운 뒤였다.

"……차를 두고 가는 거예요."

"알고 있습니다."

"공작님께 말씀드릴 건가요?"

마로트는 대답하기 전에 잠깐 나를 보았다. 어른이 아이를 볼 때의 눈이 아니라, 계산이 끝난 사람이 마지막 숫자를 확인하는 눈이었다.

"원하지 않으시면 말씀드리지 않겠습니다."

"……원하지 않아요."

"알겠습니다."

그는 램프를 내리고 한 걸음 비켜섰다. 나는 지나가려다 멈췄다. 이 사람이 알고 있었다면, 처음부터 잔을 치우지 않았다는 뜻이다. 모른 척하면서 매일 아침 닦아서 돌려주었다는 뜻이다.

"한 가지만 말씀드려도 되겠습니까."

"네."

"각하께서는 단 것을 드시지 않습니다. 찻잎 통의 설탕 조각은 오 년째 같은 자리에 있지요. 넣지 않으셔도 됩니다."

나는 그가 하는 말을 천천히 이해했다. 이 말은 충고가 아니었다. 공작이 차를 마신다는 사실을 마로트가 나에게 건네 준 방식이었다. 설탕을 넣지 말라는 것은, 설탕을 넣은 차가 남겨졌다는 뜻이다. 나는 첫날 밤 설탕을 두 조각 넣었다.

"……고맙습니다."

"저는 아무 말도 하지 않았습니다, 아가씨."

그가 돌아서며 말했다. 이상하게 따뜻한 문장이었다. 우리는 둘 다 말하지 않은 것을 주고받는 데에 익숙해지고 있었다.

---

그다음 날 밤, 나는 설탕 없이 차를 우렸다.

잔을 문 앞에 놓고 돌아서는 순간, 서재 안에서 의자 끌리는 소리가 났다. 아주 작게. 나는 걸음을 멈추지 않았다. 멈추면 뒤돌아보게 될 것 같았고, 뒤돌아보면 문이 열릴 것 같았다. 아직은 문이 열려선 안 되는 밤이었다.

아침에 복도로 나갔다.

잔은 문 앞에 있었다. 비어 있었다. 소서 위에는 작은 숟가락이 반듯하게 놓여 있었고, 손잡이는 계단 쪽, 그러니까 내 방이 있는 쪽을 향해 있었다. 누가 일부러 돌려놓은 것이 아니라면 그렇게 놓일 리가 없었다.

나는 잔을 들고 한참 서 있었다. 도자기에는 아직 온기가 남아 있었다. 방금 전까지 누군가가 손에 쥐고 있었던 것처럼.

그것은 대답이 아니었다. 대답이라고 하기에는 너무 조용했다. 하지만 이 집에서 말해지지 않는 것이 말해지는 것보다 훨씬 많다는 것을 아는 아이에게는, 그것으로 충분했다.

나는 잔을 들고 계단을 내려오다가, 계단참에서 마로트를 만났다. 그는 아무것도 보지 못한 사람처럼 서 있었다.

"좋은 아침입니다, 아가씨."

"좋은 아침이에요."

"오늘은 기온이 내려갑니다. 외투를 입고 나가시기 바랍니다."

"……그건 마로트 님이 하시는 말이에요, 공작님이 하시는 말이에요?"

마로트는 눈을 아주 조금 크게 떴다. 그러고는 평소의 얼굴로 돌아와 대답했다.

"저는 집사입니다, 아가씨. 집사는 날씨만 말씀드립니다."

나는 그 말이 거짓이라는 것을, 아니 정확히는 진실의 일부일 뿐이라는 것을 알았다. 그날 노트에 새 줄을 적었다.

*—서재 안의 사람은 단 것을 먹지 않는다. 차는 마신다. 잔은 돌려준다.*
*—마로트 님은 아무 말도 하지 않은 말로 가장 많은 것을 알려 준다.*
*—그 사람은 아직 내게 말을 걸 준비가 되어 있지 않다. 나도 아직 그렇다. 그러니 서두르지 않아도 된다.*`},

{n:5,title:'과수원 담장 너머',season:'한겨울',text:`겨울 오후의 정원은 소리를 삼켜 버린다.

그날 나는 탠지가 건넨 작은 바구니를 들고 있었다. 보온 덮개를 씌운 찻주전자와 잔 두 개, 마른 비스킷이 들어 있었다. 정원사 할아버지께 전해 달라는 심부름이었다. "과수원 쪽 온실에 계세요, 아가씨. 길은 간단해요. 장미 터널 지나서 쭉 가다가 오른쪽!" 탠지의 설명은 늘 이런 식이었다. 간단하다고 말하는 사람의 길은 대체로 간단하지 않다.

장미 터널은 앙상한 가지만 남아 있었고, 쭉 가는 길은 갈림길이 되었고, 오른쪽이라는 곳에는 오른쪽이 세 개 있었다. 나는 서리 앉은 풀을 밟으며 걷다가 어느새 사과나무가 줄지어 선 곳에 와 있었다. 잎이 다 떨어진 가지들이 회색 하늘 아래 손가락처럼 뻗어 있었다.

그리고 과수원이 끝나는 자리에 낮은 돌담이 있었다. 그 담 위에 누가 앉아 있었다.

남자아이였다. 나보다 한두 살 위쯤 되어 보였다. 모래빛 머리카락은 바람에 아무렇게나 눌려 있었고, 무릎에 올려 둔 두꺼운 책을 읽느라 내가 다가오는 소리도 듣지 못한 것 같았다. 장갑은 한쪽만 끼고 있었다. 장갑을 안 낀 오른손 손가락에는 잉크가 얼룩덜룩 묻어 있었다.

나는 돌아가야 하는지 서 있어야 하는지 몰라서, 그냥 서 있었다.

"거기, 서리 위에 오래 서 있으면 발 시려."

그는 책에서 눈도 떼지 않고 말했다.

"……언제부터 알았어요?"

"사과나무 세 번째 줄에서부터. 낙엽 밟는 소리가 정직하게 한 사람 몫이더라고." 그제야 그가 고개를 들었다. 눈이 마주쳤다. 호기심은 있는데 캐묻는 기색은 없는, 이상하게 편안한 눈이었다. "너, 옆집에 새로 왔다는 애지?"

"옆집이요?"

"여기가 우리 집 과수원이고, 저 너머가 공작 저택이니까. 나는 아드리안 웨스트콧. 저 집이랑 담 하나 사이에 살아. 8년째." 그는 책을 덮고 담 위에서 몸을 돌려 앉았다. "너는 이름이 뭐야? 말하기 싫으면 안 해도 돼."

그 말이 이상하게 가슴에 닿았다. 이 집에 온 뒤로 사람들은 내 이름을 정확하게 불러 주었지만, 말하기 싫으면 안 해도 된다고 해 준 사람은 없었다.

"……아델라인이에요."

"성은?"

나는 잠깐 망설였다. 트로네와 에버하트 사이에서.

아드리안은 내 얼굴을 보더니 웃었다. 놀리는 웃음이 아니었다.

"그건 다음에 알려 줘. 급할 거 없잖아."

나는 바구니를 끌어안은 채 서 있다가, 문득 그의 손을 보았다. 잉크 얼룩은 오른손 검지와 중지에 집중되어 있었다. 오늘 쓴 것이 아니라 며칠 동안 쌓인 것이었다. 책 옆면에는 종이 조각이 여러 장 끼워져 있었다. 어려운 책이었다. 열한 살이 읽을 만한 책이 아니었다.

"그 책, 혼자 읽는 거예요?"

"응. 형은 승마랑 장부 공부로 바빠서. 둘째 아들은 책 읽을 시간이 많거든." 그는 가볍게 말했지만, 그 가벼움이 아주 약간 무거웠다. 나는 그것을 알아챘다. 그리고 알아챘다는 말은 하지 않았다.

그러자 아드리안이 나를 빤히 보았다.

"너 지금 뭔가 알아챈 얼굴인데."

"……아니에요."

"거짓말."

"……조금요."

"그래, 그럼 됐다." 그는 아무것도 묻지 않고 고개를 끄덕였다. 정말로 그걸로 충분하다는 얼굴이었다. 그 순간, 나는 이 사람 곁에서는 말을 하지 않아도 틀린 사람이 되지 않는다는 것을 알았다.

우리는 한동안 아무 말 없이 있었다. 겨울 오후의 침묵이 이렇게 덜 어색할 수 있다는 걸 처음 알았다.

나는 바구니에서 잔 하나를 꺼냈다. 정원사 할아버지의 것이었지만, 두 잔이니 한 잔쯤은 괜찮을 것이다. 따뜻한 차를 따라 담 위로 내밀자, 아드리안이 장갑 낀 손과 안 낀 손을 번갈아 보다가 두 손으로 잔을 받았다.

"고마워. 이거 맛있다. 공작 저택 차는 원래 이렇게 맛있어?"

"……제가 우린 게 아니에요."

"그래도 맛있어."

그가 차를 한 모금 마시고 고개를 돌렸다. 시선은 공작 저택 쪽, 이층 가장 왼쪽 창을 향해 있었다. 아직 해가 지지 않았는데도 그 창에는 불이 켜져 있었다.

"저 창 말이야. 내가 기억하는 한, 저기는 밤에 불이 꺼진 적이 별로 없어."

"……8년 동안이요?"

"응. 처음엔 도둑이라도 드나 싶었어. 그런데 도둑이 불을 그렇게 오래 켜 둘 리 없잖아." 그는 어깨를 으쓱했다. "그냥 누가 안 자고 있나 보다 했지. 이유는 몰라. 저 집 사람들은 이유를 잘 말 안 해 주니까."

나는 대답하지 않았다. 대신 그 창을 한참 보았다. 커튼은 이번엔 움직이지 않았다. 하지만 나는 이제 그 뒤에 누군가 있다는 것을 알고 있었다.

노을이 지기 시작했다. 아드리안이 담에서 뛰어내려 책을 겨드랑이에 끼웠다.

"내일도 이 시간에 여기 있을 거야. 오든 말든 네 마음이지만."

"……선생님께 허락을 받아야 해요."

"그럼 받아 와."

그는 그 말만 하고 과수원 저쪽으로 걸어갔다. 한 번도 뒤돌아보지 않았다. 뒤돌아봐서 대답을 재촉하지 않는 사람이라는 걸, 나는 그날 처음 알았다.

바구니는 아직 반쯤 차 있었다. 나는 정원사 할아버지를 찾지 못했다는 사실을 한참 뒤에야 떠올렸다. 돌아오는 길에 탠지가 현관에서 팔짱을 끼고 기다리고 있었다.

"아가씨! 어디 계셨어요! 길을 잃으셨죠? 제가 말했잖아요, 간단하다고!"

"……오른쪽이 세 개였어요."

탠지는 눈을 동그랗게 뜨더니 이내 웃음을 터뜨렸다. 아주 크게, 복도 끝까지 울릴 정도로. 그 웃음 사이로 그녀의 오른쪽 어깨가 또 아주 조금 내려가 있었다.

그날 밤, 나는 노트에 새 줄을 적었다.

*—담 너머의 아이는 거짓말을 못 하는 게 아니라 안 하는 사람이다. 그리고 내가 말하지 않는 것을 기다려 준다.*
*—서재의 불은 8년 동안 꺼지지 않았다.*

두 번째 줄 아래에는 오래 펜을 대고 있었다. 잉크가 번졌다. 그것이 무엇을 뜻하는지, 열 살의 나는 아직 몰랐다.`}

{n:6,title:'유품 상자',season:'한겨울',text:`눈은 사흘 동안 쉬지 않고 내렸다.

눈이 오면 저택은 더 조용해진다. 마구간의 말 울음도, 정원사 할아버지의 가위 소리도 눈 속에 묻혀 버리고, 남는 것은 벽난로 장작이 터지는 소리와 시계 소리뿐이다. 그 조용함 속에서 나는 한 가지 결심을 했다. 오늘 밤에는 잔을 문 앞에 놓지 않고, 직접 노크를 해 보기로.

결심은 서재 앞에서 무너졌다.

문이 열려 있었다. 아주 조금, 손가락 하나가 들어갈 만큼. 이 집에 온 뒤로 그 문이 열려 있는 것은 처음 보았다. 복도 아래층에서는 마로트의 급한 발소리가 들렸다. 북쪽에서 온 전령이 도착했다는 말이 계단을 타고 올라왔고, 서재의 주인은 방금 전 서둘러 내려간 모양이었다.

나는 잔을 든 채 문틈 앞에 서 있었다. 들어가면 안 된다는 것은 알고 있었다. 하지만 문틈 사이로 보이는 방은 열흘이 넘도록 상상해 온 것과 달랐다. 벽 전체가 책으로 덮여 있었고, 창가에는 낡은 지도가 펼쳐져 있었다. 불은 켜져 있었고, 책상 위에는 식은 찻잔이 하나 놓여 있었다. 내가 어제 놓아 둔 잔이었다.

그리고 그 옆에 상자가 있었다.

짙은 호두나무 상자였다. 뚜껑 한가운데에 글자가 새겨져 있었다. 나는 그 글자를 읽기도 전에 알아보았다. 아버지의 필체를 본떠 판 글자, 오랫동안 우리 집 서재의 문패에 걸려 있던 이름.

*에버하트.*

발이 먼저 움직였다. 정확히 말하면, 나는 아무것도 결정하지 않았다. 정신이 들었을 때는 이미 잔을 책상 모서리에 내려놓고 상자 앞에 서 있었다. 손끝이 뚜껑에 닿았다. 차가웠다. 그런데 뚜껑은 먼지 하나 없이 깨끗했다. 누군가 매일 닦고 있는 것처럼.

열쇠는 꽂혀 있었다. 뚜껑을 올리자 오래된 종이 냄새가 코끝을 스쳤다. 아버지의 서재 냄새였다. 잉크와 마른 가죽과 햇볕에 바랜 책등의 냄새. 안에는 안경이 하나 있었다. 한쪽 다리에 실로 감아 수선한 흔적이 있는, 아버지가 늘 쓰던 안경이었다. 그 아래에는 끈으로 묶인 편지 다발이 있었고, 나는 안경을 집어 들었다.

"내려놓아라."

목소리는 크지 않았다. 문 쪽에서 들렸다.

나는 돌아보았다. 그 사람이 서 있었다.

키가 컸다. 어두운 머리카락의 관자놀이 쪽이 일찍 하얗게 세어 있었고, 눈은 젖은 석판 같은 회색이었다. 얼굴은 움직이지 않는 법을 오래 배운 사람의 것이었다. 나는 그 얼굴을 알고 있었다. 장례식장 맨 뒷줄에서 한 번, 입양 서류에 서명할 때 서류 너머로 한 번. 둘 다 오 초도 되지 않는 시간이었다. 에드릭 트로네. 이 집의 주인이자, 서류상 내 아버지가 된 사람.

그는 세 걸음으로 방을 가로질러 내 손에서 안경을 받아 상자에 넣고, 뚜껑을 닫았다. 소리가 났다. 크지 않았는데도 방 전체가 울릴 만큼 단단한 소리였다.

"여기는 네가 올 곳이 아니다."

"그건 아버지 거예요."

"……안다."

"그런데 왜……"

"나가라."

화를 내는 목소리가 아니었다. 오히려 낮고 건조해서 더 차갑게 들렸다. 그는 상자를 두 팔로 안아 올렸다. 책을 안듯이, 혹은 물에 빠진 무언가를 건져 올리듯이. 나는 그가 상자를 안는 손이 아주 미세하게 떨리고 있다는 것을 보았다. 그런데 열 살의 나는 그 떨림을 분노라고 읽었다.

"마로트."

문가에 집사가 서 있었다. 숨이 가쁜 기색을 가까스로 감춘 채였다.

"아이를 방으로 데려다주어라."

아이.

그 한 글자가 가슴 한가운데에 내려앉았다. 이름이 아니었다. 아델라인도, 트로네도, 에버하트도 아닌, 누구에게나 쓸 수 있는 말. 나는 그 호칭 속에서 이 집에서의 내 자리를 보았다고 생각했다. 서류에 적힌 이름만 있는 사람. 그가 지키는 것은 상자이지 내가 아니라고.

복도를 걷는 동안 마로트는 한마디도 하지 않았다. 나도 하지 않았다. 방 앞에서 그는 평소의 각도로 인사를 하고 돌아섰다. 문이 닫혔다. 나는 책상 앞에 앉아 펜을 들었지만, 한 줄도 쓸 수 없었다.

관찰은 정확했고 해석은 틀렸다. 그 차이를 배우는 데는 한 계절이 걸렸다.

---

그날 이후 나는 잔을 놓지 않았다.

마로트는 아무것도 묻지 않았다. 탠지는 평소보다 두 배로 떠들었고, 홀트 선생은 수업 중에 평소보다 한 번 더 내 눈을 보았다. 모두가 알고 있었고, 모두가 모르는 척했다. 이 집이 늘 해 오던 방식으로.

사흘째 오후, 나는 과수원으로 갔다. 아무 이유도 없었다. 발이 거기로 향했다.

담 위에는 아드리안이 앉아 있었다. 그는 나를 보고도 아무것도 묻지 않았다. 책을 펼친 채 옆자리를 손바닥으로 툭 쳤을 뿐이었다. 나는 담 아래 눈 쌓인 돌에 걸터앉았다. 한참 동안 그는 책을 읽었고 나는 눈 쌓인 사과나무를 보았다.

"겨울 사과야."

그가 외투 주머니에서 쭈글쭈글한 사과 하나를 꺼내 내밀었다.

"저장고에서 훔쳤어. 맛없어. 근데 단단해."

"……왜 주는 거예요?"

"손에 뭐라도 쥐고 있으면 덜 춥잖아."

나는 사과를 받았다. 정말 차갑고 단단했다. 그리고 아무 맛도 나지 않을 것 같았다. 나는 그것을 두 손으로 쥐고 한참 동안 가만히 있었다. 그러다 코끝이 시큰해졌고, 시야가 흐려졌고, 눈물이 사과 위로 떨어졌다. 소리는 나지 않았다. 아드리안은 책장을 넘기던 손을 멈추었다가, 다시 천천히 넘겼다. 쳐다보지도, 위로하지도 않았다.

"말 안 해도 돼."

그 말만 했다. 그리고 해가 질 때까지 그 자리에 있어 주었다.

그날 밤, 나는 노트에 한 줄을 적었다. 한참을 쓰지 못하다가, 겨우.

*—나는 이 집에서 내 것을 가질 수 없다.*

잉크가 마르는 동안 그 문장을 오래 보았다. 읽을수록 틀린 문장 같았는데, 어디가 틀렸는지는 알 수 없었다.`},

{n:7,title:'마로트의 침묵',season:'한겨울',text:`집사실은 저택에서 가장 조용한 방이었다.

벽 한 면이 장부로 가득했고, 책상에는 펜과 인장과 잉크병이 자로 잰 듯 놓여 있었다. 창가에는 작은 화분이 하나, 이 방에서 유일하게 쓸모를 묻지 않는 물건이었다. 나는 노크를 세 번 하고 기다렸다.

"들어오십시오."

마로트는 서류에서 눈을 떼지 않았다. 하지만 펜은 이미 멈춰 있었다. 내가 올 줄 알고 있었던 사람의 멈춤이었다.

"질문이 있어요."

"짐작하고 있었습니다."

"대답해 주시지 않아도 돼요. 그냥 물어볼게요."

그는 비로소 고개를 들었다. 눈 밑이 평소보다 약간 어두웠다. 사흘 연속으로 잠을 못 잔 사람의 어두움이었다. 소매 끝에는 마르지 않은 잉크가 번져 있었다. 완벽한 사람에게는 어울리지 않는 얼룩이었다. 나는 그것을 말하지 않았다.

"앉으시겠습니까?"

"서 있을게요. 길지 않아서요."

나는 숨을 한 번 쉬고 시작했다.

"첫날, 마로트 님은 공작님이 사과의 말씀을 전하라고 하셨다고 했어요. 그 말씀은 실제로 있었나요?"

침묵. 그리고 아주 작은 한숨.

"……정확한 문장은 '불편하지 않게 해 드려라'였습니다. 제가 의역했습니다."

"의역은 거짓말인가요?"

"집사의 직무입니다."

나는 하마터면 웃을 뻔했다. 이 사람은 거짓말을 하지 않는다. 다만 진실을 가장 매끄러운 모양으로 다듬어서 건넬 뿐이다. 그것은 거짓말보다 훨씬 어렵고, 훨씬 외로운 기술이었다.

"그럼 지금부터는 의역하지 않으시는 거죠?"

"침묵할 수는 있습니다. 하지만 거짓은 말씀드리지 않습니다."

"좋아요. 그럼 '예'나 '아니오'로만 물을게요."

마로트의 눈썹이 아주 조금 올라갔다. 흥미를 느낀 사람의 반응이었다. 이 방에서 처음 본 표정이었다.

"그 상자는 제가 이 집에 온 날 함께 온 건가요?"

침묵.

나는 기다렸다. 일 초, 이 초, 삼 초. 그는 대답하지 않았다.

"마로트 님은 거짓말을 안 하시죠. 그리고 만약 '예'였다면, 거짓이 아니니까 '예'라고 하셨을 거예요."

"……아가씨는 위험한 방식으로 질문하십니다."

"그렇다면 '아니오'네요."

그는 부정하지 않았다. 부정하지 않는 것이 이 방의 규칙에서는 대답이었다.

"그럼 상자는 제가 오기 전에 이 집에 있었다는 뜻이에요. 제 아버지는 석 달 전에 돌아가셨는데, 상자는 그보다 훨씬 전에 있었다는 뜻이고요."

마로트는 대답하지 않았다. 나는 그 침묵 속에서 천천히, 그러나 확실하게 한 가지 결론에 도달했다. 도달하고 싶지 않은 결론이었다.

"……그럼 공작님은 저를 위해서가 아니라, 그 상자 때문에 저를 데려오신 거네요."

방 안의 공기가 한 번 가라앉았다. 마로트는 손에 쥔 펜을 내려놓았다. 아주 천천히, 소리가 나지 않게.

"아가씨."

"네."

"그 결론은 논리적으로 가능합니다. 하지만 저는 한 가지 사실을 말씀드릴 수 있습니다. 질문이 아니라 사실입니다."

"……네."

"아가씨 방 서랍에 들어 있던 노트와 깃펜은 제가 주문한 것이 아닙니다."

나는 눈을 깜박였다.

"집사가 주문하는 노트의 규격은 언제나 같습니다. 이 저택의 모든 서류는 같은 크기로 쓰이니까요. 그런데 아가씨 서랍의 노트는 그 규격이 아니었습니다. 줄이 촘촘하고, 표지는 회색이었지요."

나는 숨을 멈췄다.

회색 표지. 촘촘한 줄. 아버지가 평생 쓰던 노트와 똑같은 것이었다. 도착한 날 서랍을 열고, 나는 누군가 내가 글을 쓰는 아이라는 것을 미리 알고 있었다고 생각했다. 그런데 그뿐이 아니었다. 그 사람은 내가 어떤 노트를 쓰던 아이인지도 알고 있었다.

"누가 주문했는지는 말씀드리지 않겠습니다. 다만 집사는 주문서의 서명을 볼 수 있다는 것만 말씀드리지요."

나는 아무 말도 하지 못했다. 마로트는 그 침묵을 존중하듯이 다시 펜을 들었다. 일이 아니라 시선을 내려둘 곳이 필요한 사람처럼.

"……마로트 님은 알고 계시죠. 전부."

"일부입니다."

"왜 말씀해 주시지 않는 거예요?"

"말씀드릴 수 있는 사람이 제가 아니기 때문입니다."

그것은 거절이 아니라 설명이었다. 나는 그 차이를 알았다. 그리고 책상 서랍이 반쯤 열려 있다는 것도 알았다. 그 안에는 낡은 은빛 회중시계가 놓여 있었다. 뚜껑에는 '윌로'라는 성이 새겨져 있었는데, 이름 칸은 닳아서 읽을 수 없었다. 홀트 선생이 말한 그 시계였다. 고장 난 것이 아니라, 아직 자기 것이 아니라서 차지 않는 시계.

나는 그것에 대해서는 묻지 않았다. 모든 질문이 묻는 사람에게만 허락되는 것은 아니었다.

"고맙습니다. 시간 내 주셔서요."

"아가씨."

문고리를 잡은 나를 그가 불렀다.

"각하께서는 어제 새벽 네 시까지 서재에 계셨습니다. 상자는 책상 위에 열려 있었고, 안경은 다시 상자 속에 넣어 두지 못하신 채 손에 쥐고 계셨습니다. 저는 그것을 보았다는 것만 말씀드립니다."

나는 대답하지 못했다. 마로트도 더 이상 말하지 않았다. 나는 문을 닫고 복도로 나왔다.

잔은 두 개를 꺼냈다. 하나는 서재 앞이 아니라 집사실 앞에 놓았다. 설탕은 넣지 않았다. 마로트가 단 것을 먹는지 안 먹는지 알 수 없었지만, 이 집의 규칙에서는 몰라도 넣지 않는 것이 맞는 것 같았다.

{n:8,title:'봄, 처음 불린 이름',season:'봄',text:`봄은 정원사 할아버지가 장미에게 존댓말로 인사하는 것으로 시작되었다.

"올해도 잘 부탁드립니다, 장미님들."

눈이 녹고, 장미 터널의 가지 끝에 붉은 싹이 올라왔다. 과수원의 사과나무는 아직 앙상했지만, 가지 끝에는 작은 마디가 부풀어 있었다. 나는 아침마다 탠지와 함께 물을 길었다. 물동이는 반만 채웠다. 약속이었으니까. 탠지의 손바닥은 이제 거의 아물었고, 부르튼 자리에는 연한 분홍빛 새살이 올라와 있었다.

공작과는 여전히 한마디도 나누지 않았다. 잔도 놓지 않았다. 서재의 불은 매일 밤 켜져 있었고, 그 불빛이 내 방 창문에까지 닿는 것을 나는 알면서도 커튼을 닫았다.

"아가씨."

어느 날 아침, 탠지가 머리를 땋아 주다가 조용히 말했다. 조용한 탠지는 드물었다. 그래서 나는 거울 속 그녀의 얼굴을 보았다.

"제가 들은 얘기가 있는데요. 말해도 될까요? 아니, 말하면 안 되는 이야기일 수도 있는데……"

"괜찮아요."

"마르타 아주머니가 그러셨어요. 서재의 그 상자요. 그거, 아가씨가 오시기 훨씬 전부터 있었대요."

나는 거울 속 탠지의 손이 멈추는 것을 보았다.

"팔 년 전 어느 폭풍 치던 밤에, 공작님이 직접 마차에서 안고 내려오셨대요. 그때 그 마차에는 하인도 마부도 내리지 못하게 하셨고요. 그 뒤로 그 상자는 서재에서 한 번도 나간 적이 없대요. 먼지도 아무도 못 닦게 하신대요. 공작님이 직접 닦으신대요. 매일 밤, 불을 켜 두고."

머릿속에서 무언가가 천천히 방향을 바꾸었다. 마치 오랫동안 거꾸로 걸려 있던 그림이 바로 걸리는 것처럼.

먼지 하나 없던 뚜껑. 열쇠가 꽂혀 있던 자물쇠. 안경을 쥐고 새벽 네 시까지 앉아 있었다는 사람. 상자를 안던 손의 떨림.

나는 그것들을 처음부터 보고 있었다. 보고, 적고, 틀리게 읽었다.

"……그건 빼앗은 게 아니었네요."

"네?"

"지키고 있었던 거예요. 팔 년 동안."

탠지는 눈을 크게 뜨더니, 곧 두 손으로 내 어깨를 꼭 잡았다.

"아가씨, 그럼 오늘 밤에는 차를 우리세요. 그런데 문 앞에 두고 오지 마시고요. 문은 두드리라고 있는 거예요! 그리고 안 열리면 그건 문 탓이에요!"

"……그건 너무 억지예요."

"억지가 제일 잘 통할 때가 있어요!"

탠지는 환하게 웃었다. 오랜만에 봄 햇살 같은 웃음이었다. 나는 처음으로 그 웃음 뒤에 숨은 것이 하나도 없다는 것을 알았다.

---

그날 밤, 나는 잔을 두 손으로 들고 이층 복도를 걸었다.

설탕은 넣지 않았다. 찻물은 한 방울도 흘리지 않았다. 서재 문 앞에서 숨을 한 번 쉬고, 주먹을 쥐고, 폈다. 그러고는 문을 두드렸다.

세 번.

안에서 의자 끄는 소리가 났다. 오래 앉아 있던 사람이 일어나는 소리였다. 발걸음은 느렸고, 문 앞에서 한 번 멈추었다. 열릴지 안 열릴지 모르는 시간이 흘렀다. 심장이 내 귓속에서 뛰는 소리가 들렸다.

문이 열렸다.

에드릭 트로네는 셔츠 소매를 걷은 채 서 있었다. 외투도 타이도 없었다. 손에는 잉크가 묻어 있었고, 눈 밑은 평소보다 더 어두웠다. 그는 내가 서 있는 것을 보고도 아무 말도 하지 않았다. 나도 하지 않았다. 긴 침묵이 우리 사이에 놓였다. 마로트가 보았다면 이것을 '정돈된 침묵'이라 불렀을 것이다.

"……차예요."

내 목소리는 작았다.

"설탕은 안 넣었어요."

그의 눈이 아주 약간 흔들렸다.

"……알고 있다."

그는 잔을 받았다. 손가락이 닿지 않게 받으려다, 오히려 그의 손가락이 내 손가락에 닿았다. 따뜻했다. 의외로 따뜻했다. 나는 그 손이 늘 차가울 줄 알았다.

"상자는 열지 않을게요."

나는 준비해 온 말을 한꺼번에 쏟아 냈다. 틀리지 않으려고 속으로 몇 번이나 연습한 문장이었다.

"그냥 알고 싶었어요. 아버지 물건이 어디 있는지. 여기 있다는 걸 알았으니까, 그걸로 괜찮아요."

공작은 잔을 쥔 채 한참 나를 보았다. 시선은 내 얼굴이 아니라, 마치 내 얼굴 뒤에 있는 다른 누군가를 보는 것처럼 아주 멀리 가 있었다. 그러다 천천히 돌아왔다.

"아델라인."

나는 숨을 멈췄다.

그가 내 이름을 부른 것은 처음이었다. 발음이 낯설 만큼 정확했다. 오랫동안 연습해 둔 사람의 발음이었다. 누구에게도 들키지 않는 밤에, 혼자서 몇 번이나 불러 본 사람의 목소리였다.

"……그날은, 미안했다."

그것이 전부였다. 설명도 변명도 이유도 없었다. 그는 말을 덧붙이려다 입을 다물었고, 대신 문을 조금 더 열었다. 아주 조금, 나 한 사람이 들여다볼 수 있을 만큼.

방 안 창가의 선반 위에 상자가 놓여 있었다. 그 앞에는 의자가 하나 있었고, 의자 위에는 내가 놓아 두었던 찻잔들이 한 줄로 늘어서 있었다. 모두 닦여 있었다. 한 번도 버려지지 않은 채.

나는 그 잔들을 세어 보았다. 열한 개였다. 내가 그 문 앞에 두고 간 잔 중, 돌아오지 않은 것들이었다.

"……들어와도 돼요?"

"……오늘은 아니다."

그는 짧게 말하고 곧 덧붙였다.

"하지만 문은, 언제든 두드려라."

나는 고개를 끄덕였다. 그것으로 충분했다. 문이 닫히고 나서야 나는 복도에 서서 한참 숨을 몰아쉬었다. 눈앞이 번졌다. 열 살의 봄밤은 이상하게 따뜻했다.

그날 밤, 나는 노트의 오래된 줄 하나에 가로선을 그었다.

*—~~나는 이 집에서 내 것을 가질 수 없다.~~*
*—나는 오늘 처음으로 틀렸다. 그리고 틀린 것이 기뻤다.*`},

{n:9,title:'여름 끝의 손님',season:'여름',text:`그해 여름은 길었고, 느리게 지나갔다.

사과꽃은 졌고, 사과는 작은 초록 알갱이로 맺혔다. 홀트 선생은 수업 시간마다 내게 관찰한 것을 하나씩 말하라고 했고, 나는 하나가 둘이 되고 셋이 되는 사이 문장으로 말하는 법을 배웠다. 선생은 틀린 것은 틀렸다고, 맞는 것은 맞다고만 했지만, 어느 날은 수업이 끝난 뒤 "오늘은 좋았습니다"라고 짧게 덧붙였다. 나는 그 말을 이틀 동안 곱씹었다.

공작과는 일주일에 두 번 아침 식탁에서 만났다. 처음에는 아무도 말하지 않았다. 그는 식탁 끝에, 나는 반대편 끝에 앉아 서로의 접시 소리만 들었다. 그러다 세 번째 아침에 그가 말했다.

"……빵이 식는다."

"네."

"먹어라."

그것이 첫 대화였다. 나는 그 말이 세상에서 가장 서툰 걱정이라는 것을 알았다. 그래서 빵을 두 번 베어 물었고, 그는 그제야 자신의 수프를 한 숟갈 떴다.

그 여름 동안 나는 많은 것을 적었다. 담 위에서 책을 읽는 아드리안의 잉크 묻은 손가락이 하나씩 줄어드는 것. 탠지가 마로트의 '오렌지 양' 호칭을 한 달에 세 번 받아 냈다는 것. 서재 창의 불이 이따금 아홉 시에 꺼지는 날이 생겼다는 것. 하나하나는 사소했다. 하지만 사소한 것이 모여 계절이 되고, 계절이 모여 집이 된다는 것을, 나는 그해 처음으로 배웠다.

그리고 여름이 끝나 가던 어느 날 오후, 마로트가 평소보다 반 걸음 빠르게 복도를 걸었다.

"손님이 도착하십니다, 아가씨. 북부 대공 각하와 그분의 아드님이십니다. 오늘 저녁 식사는 공작 각하와 함께 하시게 될 것입니다."

"……식탁이 비지 않는 건가요?"

"비지 않습니다."

마로트는 한 번 더 고개를 숙였다. 그의 입가에 아주 미세한 기미가 떠오른 것을 나는 놓치지 않았다. 이 집의 긴 식탁에 손님이 앉는 것은 오 년 만이었다.

---

북부의 마차는 검은색이었고, 문에는 은빛 늑대가 새겨져 있었다.

마차에서 먼저 내린 사람은 중년의 남자였다. 어깨가 넓고 수염이 짧았고, 걸음마다 땅이 울릴 것 같은 사람이었다. 북부 대공 그레고르 에르바인. 그는 현관에서 에드릭과 눈이 마주치자 한참 동안 아무 말도 하지 않다가, 이윽고 짧은 웃음을 터뜨렸다.

"이 집은 변한 게 하나도 없군, 에드릭."

"……자네는 늙었군."

"그건 인정하지."

두 남자가 어깨를 맞부딪치듯 악수하는 것을 나는 계단 위에서 보았다. 이 집에서 에드릭이 그런 식으로 웃음 비슷한 것을 짓는 것은 처음 보았다. 아주 작았지만, 분명히 웃음이었다.

그리고 대공 뒤에서 한 소년이 내렸다.

열세 살쯤 되어 보였다. 키가 크고 어깨가 곧았고, 검은 머리카락은 정확하게 뒤로 넘겨져 있었다. 눈은 서리 낀 강철처럼 맑고 차가웠다. 소년은 마차에서 내리자마자 저택을 위아래로 훑어보았다. 정원의 분수, 대리석 계단, 장미 터널. 눈길이 닿는 곳마다 아주 작게 눈살이 찌푸려졌다.

"카일런, 인사해라."

대공의 말에 소년은 정확한 각도로 고개를 숙였다.

"카일런 에르바인입니다. 트로네 공작 각하께 인사드립니다."

그리고 그의 눈이 나를 향했다.

"……이쪽이 입양된 영애입니까?"

계단 위가 조용해졌다. 마로트의 어깨가 아주 약간 굳었고, 탠지가 숨을 삼키는 소리가 들렸다. 나는 그 질문이 무례하다는 것을 알았다. 하지만 그것이 무례함이라기보다는 직설이라는 것도 알았다. 이 소년은 돌려 말하는 법을 모르는 사람이었다.

"……아델라인 트로네예요."

내 목소리는 평소처럼 작았다. 소년은 그 대답을 기다렸다는 듯 잠깐 나를 보았다가, 이내 시선을 거두었다.

"그렇군요."

그것이 전부였다.

---

저녁 식탁은 이 집이 오 년 만에 입는 새 옷 같았다.

긴 식탁 한쪽 끝에는 에드릭이, 반대편 끝에는 내가 앉았다. 가운데에는 대공 부자가 마주 보고 앉았다. 접시와 은식기가 가지런히 놓였고, 촛불이 모든 사람의 얼굴 위에서 흔들렸다. 비어 있던 의자에 처음으로 사람이 앉아 있었다. 나는 그 사실만으로 이상하게 가슴이 가득 찼다.

"수도 근처의 저택은 정원이 장식적이군요."

카일런이 식사 도중에 불쑥 말했다.

"쓸모를 알 수 없는 분수가 둘이나 있고, 장미는 먹을 수도 없는데 저렇게 많습니다. 북부에서는 그런 데 땅을 쓰지 않습니다."

"카일런."

"사실을 말씀드린 겁니다, 아버지."

"분수는 쓸모를 묻지 않는 것입니다, 도련님."

마로트가 와인 잔을 채우며 조용히 말했다. 카일런이 고개를 들었다. 이 집의 집사가 대답한 것이 의외라는 얼굴이었다. 마로트는 눈도 마주치지 않은 채 다음 잔으로 넘어갔다.

나는 그 모든 것을 조용히 보고 있었다. 카일런은 말이 많았지만 정작 아무 것도 먹지 않다가, 대공이 눈짓을 하자 빠르게 먹기 시작했다. 너무 빨랐다. 그러다 우리가 보고 있다는 것을 알아채고는 갑자기 속도를 늦췄다. 장갑 낀 오른손은 식사 중에도 벗지 않았고, 부츠에는 닦아 낸 흔적이 있었지만 북쪽 길의 붉은 진흙이 아직 밑창 쪽에 남아 있었다. 삼 주쯤 걸려 온 길이었다. 이 소년은 오만한 만큼 긴장하고 있었다.

"너는 말이 없군."

카일런이 나에게 말했다. 질문이 아니라 선언처럼.

"수도의 영애들은 말이 많다고 들었는데. 나와 말하는 것은 시간 낭비라고 생각하는 건가?"

"카일런!"

대공이 낮게 호통을 쳤다. 나는 대답하지 않았다. 그리고 한참 뒤에야 천천히 입을 열었다.

"……장갑, 안 벗으세요?"

카일런의 포크가 멈췄다.

"……무슨 뜻이지?"

"그냥 궁금해서요."

그는 한참 나를 보았다. 눈썹이 아주 조금 찌푸려졌다. 나는 그것이 화가 났다는 뜻인지, 들켰다는 뜻인지 알 수 없었다. 어쩌면 둘 다였을 것이다. 그는 아무 대답도 하지 않고 고개를 돌렸고, 그 뒤로는 말을 하지 않았다. 나는 그가 내 침묵을 무시로 읽었다는 것을 알았다. 틀린 해석은 아니었다. 다만 정확하지도 않았다.

바로 그때였다.

"에버하트의 딸이로군."

그레고르 에르바인이 와인 잔을 내려놓으며 나를 보았다. 아무렇지도 않게, 마치 날씨 이야기를 하듯이.

"눈매가 아버지를 닮았다. 그가 살아 있었다면 오늘 이 자리에 있었을 텐데."

그 순간, 식탁 반대편에서 소리가 났다. 포크가 접시에 부딪치는 맑은 소리. 에드릭이 쥔 포크가 멈춰 있었다. 허공에서, 움직이지 않은 채로. 표정은 변하지 않았지만 손가락 마디가 하얗게 돌아가 있었다.

"……그레고르."

"아, 실례했네."

대공은 어깨를 으쓱하며 시선을 내렸다. 하지만 나는 이미 보아 버렸다. 북부 대공이 우리 아버지를 알고 있었다는 것을. 그리고 그 이름 앞에서 에드릭이 얼마나 오래, 얼마나 깊이 침묵해 왔는지를.

서재의 불과, 상자와, 팔 년과, 북쪽에서 온 손님이 한 줄로 이어졌다. 어떤 그림인지는 아직 알 수 없었다. 하지만 그림이 있다는 것만은 확실했다.

그날 밤, 나는 오랜 시간 책상 앞에 앉아 있었다. 창밖 어디선가 귀뚜라미가 한 번 울었고, 서재의 불은 평소보다 늦게까지 꺼지지 않았다.

*—북부의 소년은 장갑을 벗지 않는다. 오만한 만큼 긴장하고 있다.*
*—북부 대공은 아버지를 알고 있었다.*
*—공작님의 손가락 마디가 하얬다.*

마지막 줄 아래에 나는 한 줄을 더 적었다.

*—알고 싶다. 하지만 이번에는 서두르지 않겠다. 틀리게 읽는 것보다 천천히 읽는 편이 낫다.*

창밖에서는 여름이 끝나 가고 있었다. 내 앞에는 처음 맞는 사교의 계절이 놓여 있었다.`}

{n:10,title:'북쪽에서 온 소년',season:'늦여름',text:`북부 손님들은 이레를 머물렀다.

첫날부터 저택의 규칙이 조금씩 어긋났다. 새벽 네 시에 마구간에서 낯선 소리가 났고, 나는 그것이 북부 소년이 자기 말을 직접 돌보는 소리라는 것을 알았다. 마로트는 그것을 알면서도 말리지 않았다. 두 사람의 새벽 순찰이 마구간 앞에서 마주쳤다는 이야기를 탠지가 눈을 반짝이며 전했을 때, 나는 노트에 한 줄을 적었다.

*—마로트 님과 북부 소년은 비슷한 시간에 일어난다. 둘 다 그 얘기를 하지 않는다.*

오후마다 서재의 문이 닫혔다. 문 너머의 목소리는 낮고 길었고, 이따금 끊겼다. 북부 대공은 소리를 낮추는 법을 모르는 사람처럼 보였는데, 그 방에서만은 낮추고 있었다.

사흘째 오후, 과수원으로 가는 길에 카일런을 만났다.

그는 사과나무 아래에 서서 가지를 올려다보고 있었다. 손은 뒤로 모으고 턱은 조금 들고, 나무가 자기 앞에서 변명해야 한다는 듯한 자세였다.

"북부에는 이런 나무가 없다."

인사도 없이 그가 말했다.

"사과가 안 열리나요?"

"열린다. 하지만 가지가 이렇게 부드럽지 않다. 겨울을 견디려면 단단해야 하니까. 이건 겨울을 한 번도 걱정해 본 적 없는 나무 같군."

칭찬인지 비난인지, 아마 그 자신도 몰랐을 것이다. 나는 대답하지 않았다.

"겨울 걱정 없는 나무한테 겨울 걱정을 시키는 건 좀 가혹하지 않아?"

담 위에서 목소리가 내려왔다. 아드리안이 책을 무릎에 올린 채 앉아 있었다. 카일런이 고개를 돌렸다.

"……누구냐."

"담 너머에 사는 아드리안 웨스트콧. 둘째 아들. 한가한 쪽이야."

"한가한 둘째 아들이라면 이 근방에서 책이나 읽고 있겠군."

그 말투에는 악의가 없었다. 그래서 더 날카로웠다. 아드리안은 웃었지만 그 웃음이 평소보다 반 박자 늦었다. 나는 그것을 보았고, 그리고 처음으로 보고만 있지 않았다.

"한가한 게 아니에요."

두 사람이 동시에 나를 보았다. 내 목소리가 내가 생각한 것보다 또렷하게 나왔다.

"읽고 있는 거예요. 세르반 산맥 측량 보고서요."

"……세르반?"

카일런의 눈빛이 변했다. 아드리안이 두꺼운 책을 들어 보였다.

"형 서재에서 빌렸어. 제국 측량국 판본이야."

카일런은 한참 말이 없다가, 마침내 담 쪽으로 걸어왔다. 그는 책을 받아 한 장을 넘기고, 곧 눈살을 찌푸렸다.

"능선이 틀렸다."

"어디가?"

"여기. 이 고개는 여름에만 열린다. 보고서는 항상 열린 것처럼 그려져 있지만, 겨울에는 눈이 허리까지 쌓여서 길이 아니라 벽이다. 측량관들은 여름에만 왔으니 몰랐겠지."

그는 땅에서 나뭇가지를 주워 흙 위에 선을 그었다. 능선, 고개, 얼어붙는 강. 아드리안은 담에서 내려와 책 여백에 그 선을 그대로 따라 그렸다. 두 소년은 머리를 맞대고 한 시간 가까이 땅바닥의 산맥을 고쳤다. 나는 그 곁에 서서 그들을 보았다. 그날 오후 카일런은 처음으로 나이 든 사람처럼 말하지 않고, 열두 살처럼 말했다.

그러다 알아챘다. 그가 나뭇가지를 쥔 손은 왼손이었다. 세밀한 선을 그을 때도 오른손은 장갑 속에 숨긴 채 허벅지 옆에 붙어 있었다.

"또 장갑이냐."

카일런이 고개를 들지도 않고 말했다.

"……아니에요."

"거짓말이군."

"……조금요."

그는 나뭇가지를 내려놓았다. 일어서서 무릎의 흙을 털고, 나를 보았다. 얼음 조각 같은 눈 속에 짧게 무언가가 스쳤다. 화는 아니었다. 화보다 훨씬 서툰 것이었다.

"나는 정직한 사람은 좋아한다. 하지만 침묵으로 정직한 척하는 사람은 모르겠다."

그는 돌아서서 걸어갔다. 아드리안이 땅의 산맥을 내려다보다가 낮게 말했다.

"저거, 칭찬은 아니었지?"

"아마도요."

"그래도 너, 오늘 처음으로 누구 편을 들었어."

나는 그 말에 대답하지 못했다. 맞는 말이라서.

---

북부 손님들이 떠나는 날 아침, 나는 계단 중간에 서 있었다.

현관 아래에서 두 사람이 마차를 앞에 두고 마지막 이야기를 하고 있었다. 대공의 목소리는 평소보다 낮았다.

"시기가 오면, 에드릭. 자네가 먼저 말해 주게."

"……아직이다."

"언제까지 아직일 건가."

에드릭은 대답하지 않았다. 대공은 그 침묵을 오래 바라보다가 한 번 어깨를 두드리고 마차에 올랐다. 나는 계단 난간을 쥔 손이 차가워지는 것을 느꼈다. 시기. 그 단어는 서재의 불과 상자와 팔 년 위에 얹히는 무게처럼 들렸다.

카일런은 마차에 오르기 전에 한 번 나를 돌아보았다.

"수도 사람은 말이 많다고 들었다. 틀렸군. 말이 없는 쪽이 더 많이 감춘다."

"……안녕히 가세요."

내 대답은 그것뿐이었다. 그는 입술을 아주 조금 굳히고 마차 문을 닫았다. 나는 그가 내 침묵을 또 한 번 무시로 읽었다는 것을 알았다. 그리고 그 오해를 지금 바로잡을 수 없다는 것도.

---

그해 겨울, 열한 살이 된 아침이었다.

눈을 뜨니 방은 평소와 같았고, 탠지가 오기 전이라 조용했다. 이상하게도 문 앞에 무엇이 놓여 있을 것 같다는 생각이 들었다. 문을 열었다.

바닥에 책이 한 권 있었다.

회색 표지에 촘촘한 줄이 그어진 두꺼운 노트였다. 속지에는 이름이 없었다. 쪽지도, 서명도 없었다. 그저 책이 한 권, 아침 문 앞에 놓여 있었다.

"아가씨! 생일이세요?!"

복도 끝에서 달려온 탠지가 내 손의 노트를 보고 눈을 동그랗게 떴다. 나는 고개를 끄덕였다. 목이 메어서 말이 나오지 않았다.

그날 식탁은 비어 있었다. 공작은 아침 일찍 황궁에 불려 갔다고 마로트가 말했다. 나는 반대편 빈 의자를 보며 수프를 먹었다. 의자 앞의 접시는 그날도 정확히 놓여 있었다.

*—생일에 공작님은 없었다. 대신 노트가 있었다.*
*—서명이 없는 것은, 서명할 필요가 없다고 생각했거나, 서명할 용기가 없었다는 뜻이다.*
*—두 번째가 맞을 것 같다.*`},

{n:11,title:'첫 다과회',season:'봄',text:`열한 살의 한 해는 조용히 지나갔다.

홀트 선생과의 수업은 어느새 질문과 대답이 아니라 토론이 되었고, 나는 문장으로 말하는 데 익숙해졌다. 담 너머의 아드리안은 산맥 지도를 끝까지 완성해서 형에게 칭찬을 들었고, 탠지의 손은 아주 깨끗해졌으며, 마로트는 '오렌지 양'을 이제 한 달에 네 번 불렀다. 그해 생일 아침에도 문 앞에는 책이 한 권 놓여 있었다. 나는 그 책들을 책장 가장 높은 칸에 나란히 세워 두었다.

열두 살이 되던 봄, 황실의 인장이 찍힌 초대장이 도착했다.

마로트가 은쟁반에 받쳐 서재로 가져갔고, 나는 그날 저녁 식탁에서 그 이야기를 들었다.

"황후 폐하께서 주최하는 봄 다과회다. 귀족가 자제들만 모이는 작은 자리라고 한다."

에드릭은 수프를 뜨며 말했다. 시선은 접시에 둔 채였다.

"가지 않아도 된다."

"가겠어요."

숟가락이 멈췄다.

"……이유가 있나."

"안 가면 이유가 생기니까요."

공작은 한참 나를 보았다. 그의 눈 속에서 아주 짧게 무엇인가가 오갔다. 걱정이라고 해도 좋고, 감탄이라고 해도 좋았다.

"……마로트. 마차를 준비해라."

"이미 준비해 두었습니다, 각하."

"……언제부터."

"초대장이 도착한 순간부터입니다."

우리는 둘 다 웃지 않았다. 하지만 그 식탁의 공기는 조금 가벼워졌다.

---

황궁의 정원은 사과꽃과 장미 사이에서 시간이 멈춘 것 같았다.

하얀 천막 아래 긴 탁자가 놓였고, 열두 명쯤 되는 아이들이 정해진 자리에 앉아 있었다. 홀트 선생이 마지막 수업에서 한 말이 떠올랐다. *방에 들어가면 가장 먼저 누구에게 인사할지가 아니라, 누가 누구에게 먼저 인사하는지를 보십시오.* 나는 걸음을 늦추고 방 안의 힘의 방향을 읽었다.

중심에는 한 소녀가 있었다. 금빛 머리를 높게 올리고 등을 곧게 편, 인형처럼 완벽한 아이. 다른 아이들의 시선이 자꾸 그쪽으로 기울었다. 발트하임 백작가의 영애 세레나, 황후 후보 일순위라고 모두가 속삭이는 사람. 그녀는 웃고 있었지만 그 웃음은 근육으로 만든 것이었다.

"트로네 영애시죠!"

갑자기 팔을 붙들렸다. 주근깨 있는 소녀가 숨을 헐떡이며 서 있었다. 리본이 두 개나 다른 색이었다.

"저는 로잘리 클레어몬트예요! 소문 들었어요! 아, 좋은 소문이요! 아니, 별로 소문은 아니고! 잠깐, 제가 말이 많죠? 저 원래 이래요!"

"……괜찮아요."

"그럼 소개해 드릴게요! 저기 은수저를 세고 있는 애는 리오넬이에요, 베르몬트 상단 집안이고 계산이 엄청 빨라요. 저쪽 식탁 밑에서 책 읽는 애는 세바스티안, 동쪽 마탑 영지에서 왔는데 부르면 세 번째에 대답해요. 그리고 저기 칼 차고 서 있는 애는 하델이에요, 서부 기사단장님 아들이고, 아무도 앉으라고 안 했는데 안 앉고 서 있어요!"

나는 그들을 하나씩 보았다. 로잘리가 말한 대로였다. 한 소년은 접시 가장자리의 은 무게를 눈짐작으로 재고 있었고, 한 소년은 탁자보 아래에서 책장을 넘기고 있었고, 한 소년은 파수꾼처럼 천막 기둥 옆에 곧게 서 있었다. 나는 그 모든 것을 기억해 두었다. 아직 누구에게 어떤 의미가 될지 모르면서.

그때 정원 입구에서 웅성임이 일었다.

"황자 전하께서 오십니다."

문이 열리고 소년 하나가 걸어 들어왔다. 열세 살쯤. 밝은 갈색 머리가 햇빛에 풀어졌고, 입가에는 모든 방이 기다리던 웃음이 있었다. 그는 문턱에서 한 번 방을 둘러보고, 그것만으로 방 전체를 장악했다.

"늦어서 죄송합니다. 오는 길에 장미가 너무 예뻐서 한참 보고 있었어요. 그러다 보니 장미들한테 늦은 사과를 해야 했고요."

웃음이 터졌다. 그는 한 사람씩 다른 말을 건넸다. 이 영애에게는 새 머리 장식을, 저 소년에게는 지난 승마 대회를. 모든 인사가 정확하게 상대가 듣고 싶은 말이었다. 둘째 황자 율리안 렌하르트. 아주 훌륭한 연기였다.

나는 한 가지를 알아챘다. 그가 웃는 동안 왼손이 등 뒤에서 오른손 엄지손톱을 계속 누르고 있었다. 아주 규칙적으로, 아주 오래.

---

다과회가 한 시간쯤 지났을 때, 황후가 내게 물었다.

"새로 오신 트로네 영애. 공작가의 식탁은 어떠한가?"

모든 소리가 멈췄다. 나는 찻잔을 내려놓고 일어섰다. 목소리가 떨릴 것 같았지만, 홀트 선생에게 배운 대로 숨을 한 번 쉬었다.

"조용합니다, 폐하. 하지만 비어 있지는 않아요."

황후의 눈이 아주 조금 가늘어졌다. 웃음이라고 하기에는 짧았고, 인정이라고 하기에는 길었다.

"그렇군. 좋은 대답이야."

자리에 앉자 어디선가 낮은 소리가 들렸다. "입양된 아이가 대답은 잘하네." 누군가의 부채 뒤였다. 나는 돌아보지 않았다.

"좋은 대답이었어요."

옆에서 목소리가 났다. 어느새 율리안이 내 옆자리로 와 있었다. 그는 찻잔을 들고 정원 쪽을 향해 앉아, 마치 우연인 듯 말했다.

"그런데 이상하군요. 대답한 쪽이 더 외로워 보이는 건 왜일까요."

"……전하께서는 웃을 때 왼손을 쓰세요."

말해 놓고 나서야 후회했다. 율리안의 찻잔이 입술 앞에서 멈췄다. 웃음은 그대로였다. 하지만 눈이 변했다. 처음으로 가면이 아닌 눈이 나를 보았다.

"……제 왼손이요?"

"엄지손톱을 누르세요. 웃을 때마다, 규칙적으로요. 죄송해요, 말하지 말았어야 했는데."

한참 정적이 흘렀다. 그리고 그가 낮게, 아주 낮게 웃었다. 이번 웃음은 방 안의 어떤 웃음과도 달랐다. 조금 서툴고, 조금 놀란, 처음 보는 웃음이었다.

"트로네 양. 이건 비밀로 해 주실 수 있나요?"

"……네."

"고맙습니다."

그는 곧 평소의 얼굴로 돌아가 일어섰다. 방 안은 다시 그를 향해 열렸다. 하지만 나는 알고 있었다. 이 방에서 그의 연기를 알아본 사람이 한 명 생겼다는 것을. 그리고 그가 그것을 알게 되었다는 것을.

집으로 돌아오는 마차에서 나는 오래 창밖을 보았다. 노트를 펼 힘도 없이.

*—세레나 발트하임은 웃는 법을 배운 사람이다. 율리안 전하는 웃는 법밖에 못 배운 사람이다.*
*—로잘리는 모두의 이름을 안다. 그러나 누구도 로잘리의 이름을 오래 부르지 않는다.*
*—"입양된 아이." 오늘 누군가 그렇게 불렀다.*`},

{n:12,title:'소문의 계절',season:'여름',text:`소문은 여름 열기와 닮았다. 처음에는 보이지 않다가, 어느새 모두의 이마에 땀이 맺혀 있다.

첫 번째 소문은 가볍게 시작되었다. 공작가가 학자의 딸을 거둔 이유는 사실 빚 때문이라는 것. 두 번째는 조금 무거웠다. 에드릭 트로네가 황후 후보 자리를 노리고 영애를 하나 키우고 있다는 것. 세 번째는 이름까지 붙었다. *재산을 노리고 공작가에 들어온 아이.*

나는 그 소문들이 어떻게 변하는지를 들었다. 같은 문장이 세 번 입을 거치면 앞뒤가 바뀌고, 다섯 번 거치면 주어가 바뀐다. 처음에는 "공작이 어떤 학자에게 신세를 졌다더라"였던 말이 몇 걸음 만에 "공작이 빚 때문에 양녀를 들였다"가 되어 돌아왔다. 신기한 일이었다. 말은 이동하는 동안 자라서, 처음 출발한 자리에서는 알아보기 어려운 모양이 되었다.

그해 여름 사교계는 나를 조용히 지워 갔다.

초대장은 줄어들었다. 오던 편지가 오지 않았고, 인사하던 눈이 다른 곳을 보았다. 어느 백작 부인의 정원 모임에서는, 내가 다가가자 영애들이 동시에 부채를 펼쳐 입을 가렸다. 한 부인이 들리게 말했다.

"입양된 아이가 공작가 이름을 달고 다니면 참 편리하겠어요. 갈 곳이 생기니."

찻잔을 든 손이 아주 조금 떨렸다. 나는 잔을 내려놓고 일어섰다. 반박하지 않았다. 변명도, 얼굴 붉히는 것도 하지 않았다. 그저 인사하고, 정원을 가로질러 걸어 나왔다. 뒤에서 누군가 숨죽여 웃는 소리가 들렸다.

---

"누가 그런 말을 했어요!"

그날 오후 탠지는 내 방 안을 사자처럼 돌아다녔다.

"제가 그 집 하녀들한테 부엌에서 한마디 해 줄게요! 아니, 열 마디요! 그 집 주방장이 우리 마르타 아주머니 사촌이라서……"

"탠지 양."

문가에 마로트가 서 있었다. 평소와 같은 얼굴이었다. 하지만 목소리의 온도가 두 단계쯤 낮았다.

"그것은 좋은 생각이 아닙니다."

"하지만……"

"다만 올해 해당 가문에 보내는 가을 사과 상자에는, 가장 작은 것이 들어갈 것입니다. 집사가 장부를 정리하다 보면 그런 일이 생기지요."

탠지는 입을 벌린 채 마로트를 보았다. 마로트는 눈도 깜박이지 않았다. 나는 웃음을 참느라 입술을 깨물었다.

그날 저녁, 홀트 선생은 수업을 마친 뒤 말했다.

"소문에 반박하는 것은 소문에 물을 주는 일입니다. 아가씨가 하실 수 있는 최선의 방법을 말씀드리지요."

"……뭔가요?"

"소문보다 재미없는 사실이 되는 것입니다."

나는 그 말을 오래 생각했다. 소문은 사람들이 듣고 싶은 이야기다. 그러니 이야기가 되지 않으면 된다. 매번 같은 시간에 도착하고, 같은 말투로 인사하고, 같은 자리에 앉아, 아무 사건도 만들지 않는 것. 지루할 만큼 정확하게.

나는 그렇게 했다. 어느 방에 들어가도, 누가 무슨 말을 해도, 조용히 인사하고 조용히 자리에 앉았다. 소문은 한동안 더 자랐다. 하지만 어느 시점부터 자라는 속도가 느려졌다. 이야기에는 변화가 필요한데, 나는 변하지 않았으니까.

---

"각하께서 이번 시즌의 모든 초청에 응하시기로 하셨습니다."

어느 아침, 마로트가 장부를 넘기며 말했다. 나는 빵을 든 채 그를 쳐다보았다.

"……공작님이요?"

"네."

"사교 모임에요?"

"장부에는 열한 건이 적혀 있습니다."

에드릭 트로네는 십 년 가까이 사교계에 모습을 보이지 않은 사람이었다. 열한 건. 나는 그 숫자를 머릿속에서 한참 굴렸다. 그가 그것을 얼마나 싫어하는지를 알았기에, 더 가볍게 받아들일 수 없었다.

첫 번째 무도회에서 그는 벽에 서 있었다.

까만 예복 차림으로, 홀 한가운데의 소란을 감시하듯 바라보며. 사람들은 그가 거기 있다는 것을 알아채는 순간 소리를 낮췄다. 속삭임은 문 쪽에서부터 꺼졌다. 나는 그의 곁에 서서 가만히 있었다. 그는 한마디도 하지 않았다.

그러다 아까 그 백작 부인이 지나갔다. 부인은 우리를 보고 걸음을 늦췄고, 웃음을 얼굴에 붙였다.

"공작 각하, 오랜만이에요. 이쪽이 그……"

"트로네 가의 아델라인입니다."

에드릭의 목소리는 조용했다. 하지만 홀의 반대편까지 닿을 만큼 정확했다.

"인사하십시오."

부인의 웃음이 멈췄다. 그리고 천천히, 아주 천천히, 고개를 숙였다.

"……만나서 반갑습니다, 트로네 영애."

공작은 고개를 끄덕이고 다시 벽을 보았다. 그것이 전부였다. 그는 변명도 설명도 하지 않았다. 그저 이름을 말했고, 인사를 요구했고, 상대가 따르는 것을 보았다. 사교계에서 가장 오래된 방식의 반박이었다.

나는 그의 소매를 한 번 쥐었다. 아주 짧게. 그는 내 쪽을 보지 않았다. 하지만 어깨의 선이 아주 조금 풀렸다.

*—소문은 반박할수록 자란다. 하지만 이름을 불러 주는 사람이 있으면 자라지 못한다.*
*—공작님은 열한 건의 초청에 응하셨다. 내가 그를 위해 한 일은 아무것도 없는데.*
*—사람은 가끔, 아무것도 안 한 사람에게 가장 큰 것을 준다.*`},

{n:13,title:'수다쟁이 영애의 의리',season:'가을',text:`로잘리 클레어몬트가 소문의 시작이라는 것을 나는 오래전부터 알고 있었다.

처음에는 단서가 하나뿐이었다. 같은 문장이 세 입을 거치며 변하는 사이, 맨 앞의 입이 쓰던 말버릇이 아직 문장 속에 남아 있었다. *"글쎄, 대단한 건 아니고요."* 로잘리의 말버릇이었다. 모든 이야기를 대단한 것이 아니라고 시작하는 사람이 가장 대단하게 전한다는 것을, 나는 다과회 첫날에 알아챘다.

하지만 그녀는 악의가 없었다. 그것도 알았다. 로잘리는 소문을 나쁘게 전하는 사람이 아니라, 소문을 가만히 두지 못하는 사람이었다. 들은 것이 목구멍에 걸려 있으면 그녀는 어떻게든 풀어내야 했다. 그래서 나는 아무 말도 하지 않았다. 말을 하면, 그녀가 그것을 이야기로 만들 테니까.

가을 사냥철, 클레어몬트 백작 저택의 살롱에서 일이 터졌다.

벽난로 앞에서 어느 부인이 큰 소리로 말하고 있었다.

"저 아이는 에버하트인가 하는 학자 집안의 빚 때문에 들어온 거라던데. 공작가가 그런 걸 거둘 필요가 있었을까요."

살롱이 조용해졌다. 나는 찻잔을 든 채 가만히 있었다. 반박하지 않을 작정이었다. 소문보다 재미없는 사실이 되겠다고 정한 사람이니까.

그때 의자가 뒤로 밀렸다.

"그건 틀렸어요!"

로잘리였다. 리본은 이번에도 두 개가 달랐고, 얼굴은 목까지 붉었다. 손에 든 부채가 부러질 것처럼 떨리고 있었다.

"그 소문은 제가 처음 한 말이에요!"

모든 시선이 그녀에게 쏠렸다. 로잘리는 눈을 질끈 감았다가 떴다.

"봄에 제가 어머니한테 들은 얘기를 다른 영애한테 전했는데요, 그때 제가 한 말은 '공작님이 에버하트 박사님께 신세를 졌대요'였어요! 신세요! 빚이 아니라! 그런데 그게 어떻게 빚 때문에 입양했다가 돼요? 말은 전하는 사람이 키우는 거라고요! 제가 그렇게 말한 적 없는데 제가 한 말이 되어 있었어요!"

살롱 안은 이제 완전히 침묵이었다. 누군가의 부채가 바닥에 떨어졌다. 로잘리는 숨을 몰아쉬며 서 있었다. 그리고 아주 작게 말했다.

"그리고 아델라인은……우리 집 사촌들보다 훨씬 말이 없어서, 뭘 퍼뜨릴 수도 없어요."

잠깐의 정적. 이윽고 누군가 푸흡 소리를 내며 웃었다. 곧 웃음이 번졌다. 로잘리의 얼굴이 더 붉어졌다. 그녀는 부채를 쥔 채 문 쪽으로 달려 나갔다.

---

로잘리는 테라스 난간 아래에 쪼그려 앉아 있었다.

나는 그 옆에 조용히 앉았다. 달빛이 정원 위로 흐르고 있었고, 멀리서 살롱의 웃음소리가 가늘게 들려왔다. 한참 동안 로잘리는 얼굴을 무릎에 묻고 있었다.

"저 이제 소문 못 내요."

목소리가 젖어 있었다.

"아무도 안 믿을 거예요. 저는 말이 제일 재미있는 사람인데. 말밖에 없는 사람인데."

"로잘리."

"네……"

"저는 알고 있었어요."

로잘리가 고개를 들었다. 눈이 퉁퉁 부어 있었다.

"뭘요?"

"소문이 로잘리에게서 시작됐다는 거요. 처음부터요."

"……그런데 왜 아무 말도 안 하셨어요?"

"로잘리가 나쁜 사람이 아니라서요."

로잘리의 입술이 떨렸다. 그리고 갑자기 얼굴을 찡그리더니 엉엉 울기 시작했다. 나는 당황해서 손수건을 건넸다. 로잘리는 그것을 받아 코를 풀고, 다시 울었다. 한참 울고 나서 훌쩍거리며 말했다.

"아델라인은 너무 이상해요. 사람이 어떻게 그렇게 다 알면서 가만히 있어요."

"……죄송해요."

"사과하지 마세요! 고마운 건데!"

"……그럼 천만에요."

"그것도 이상해요!"

로잘리는 울다가 웃었다. 웃다가 다시 코를 풀었다. 그녀의 웃음은 소문을 전할 때보다 훨씬 맑았다.

"앞으로는 어떻게 하실 거예요?"

내가 물었다.

"소문 말고요. 로잘리가 아는 것들요."

"몰라요. 저는 아는 걸 말하는 걸로만 사는 사람인데."

"사실을 말하는 사람이 되면 돼요."

로잘리가 나를 보았다.

"사실만 말하는 사람의 이야기는 느려요. 재미도 덜해요. 하지만 오래가요. 그리고 한번 믿음이 생기면, 사람들은 그 사람의 말을 기다려요."

한참 침묵이 흘렀다. 로잘리는 눈을 깜박이다가 갑자기 내 팔을 붙들었다.

"아델라인, 저 비밀 지키는 거 정말 못 해요."

"알아요."

"그런데 아델라인의 비밀은 지키고 싶어요."

"저는 비밀이 별로 없어서 괜찮아요."

"그럼 제가 몇 개 만들어 드릴까요?"

"……아니요."

"한 개만요!"

"아니요."

로잘리는 다시 웃었다. 달빛 아래에서 그 웃음은 아주 오래 남았다. 그날 나는 이 집 바깥에서 처음으로 이름을 불러 주는 친구를 얻었다.

*—소문의 출발점은 대개 진실이다. 로잘리는 '신세를 졌다'고 했다.*
*—공작님이 아버지에게 신세를 졌다. 그것은 어떤 신세일까.*
*—로잘리는 말이 많은 사람이 아니라, 말이 마음에 오래 머물지 못하는 사람이다. 그런 사람이 가장 솔직하다.*`},
{n:14,title:'라이벌 영애',season:'봄',text:`세레나 발트하임은 나를 처음부터 싫어하지 않았다. 싫어하는 것조차 허락받지 못한 사람이라서, 대신 나를 시험했다.

열세 살의 봄, 사교 시즌 개막 무도회를 앞두고 황실 무용 교사의 연습 시간이 시작되었다. 십여 명의 영애가 홀에 둘씩 짝을 지어 서 있었고, 나는 제비뽑기로 세레나와 한 조가 되었다. 교사의 지휘봉이 바닥을 두드리자 모두가 첫 걸음을 내디뎠다.

세레나의 춤은 완벽했다. 손끝의 각도, 등의 선, 시선이 닿는 높이까지 어느 하나 흠이 없었다. 마치 한 번도 실수한 적 없이 태어난 사람처럼. 나는 그녀의 호흡을 따라가는 데 온 신경을 썼다.

"공작가의 침묵이라는 방식은 편리하군요."

두 번째 회전 사이에 그녀가 낮게 말했다. 입술은 거의 움직이지 않았다.

"모두가 알아서 해석해 주니까요."

"해석은 제가 하는 것이 아니라, 보는 분이 하는 거예요."

"그럼 제가 해 드리죠. 당신은 아무것도 원하지 않는 척하는 거예요."

"……척이 아니에요. 아직 모르는 거예요."

세레나의 보폭이 아주 조금 흔들렸다. 눈이 나를 향했다. 호박색 눈동자 속에서 무엇인가 날카롭게 번쩍였다.

"모를 수 있는 건 가진 사람의 특권이에요."

그녀는 그 말을 마치고 정확하게 회전했다. 나는 그 문장을 가슴 어딘가에 새겨 두었다. 그것은 비난이 아니라, 오래 눌러 온 것이 새어 나온 소리였다.

---

나는 그날 관찰한 것들을 노트에 적었다.

세레나의 눈 밑에는 파운데이션으로 덮은 그늘이 있었다. 오른손 손가락 마디마디가 약간 굽어 있었다. 아침마다 몇 시간씩 건반을 두드린 손이었다. 발걸음은 완벽했지만, 회전할 때마다 오른발 뒤꿈치가 아주 조금 바깥으로 쏠렸다. 새 구두가 맞지 않는 사람의 걸음이었다.

그리고 홀 구석에서 세레나의 어머니, 발트하임 백작 부인이 부채 뒤로 입술만 움직이는 것을 보았다. "세레나, 자세." 한 번도 큰 소리로 말하지 않았다. 그럴 필요가 없었다.

그 모든 것이 한 장의 그림이 되었다. 세레나는 누구에게도 필요한 것을 말할 수 없는 사람이었다. 말해 본 적이 없으니까.

개막 무도회 날, 홀은 촛불과 거울로 빛났다. 세레나는 하얀 드레스를 입고 중앙에 섰고, 모든 시선이 그녀에게 향했다. 그녀의 첫 춤 상대는 황태자였다. 완벽한 시작이었다. 곡이 중반을 넘어 큰 회전이 이어질 때까지는.

나는 그 순간을 미리 알고 있었다.

오른발 뒤꿈치. 회전 직전, 구두가 바닥에 닿는 소리가 평소보다 반 박자 늦었다. 세레나의 발이 아주 조금 미끄러졌다. 아무도 보지 못했을 것이다. 하지만 중심이 흔들린 몸은 한 번 더 흔들릴 것이고, 그건 앞의 모든 완벽을 지우기에 충분했다.

나는 한 걸음 앞으로 나갔다.

내 상대의 손을 놓고, 일부러 드레스 자락을 밟았다. 내 몸이 크게 기울었고, 그 충격에 근처의 몇 쌍이 물결처럼 흔들렸다. 모든 시선이 내 쪽으로 쏠렸다. 곧바로 나는 무릎을 굽혀 인사하며 작게 사과했다. 홀에는 가볍게 웃는 소리가 일었다. "트로네 양이 실수를 했네." 그것으로 충분했다.

세레나는 그 사이에 중심을 되찾았다. 그리고 곡의 마지막 소절까지 흠 없이 춤을 마쳤다. 박수가 쏟아졌다. 나는 가장자리의 벽으로 물러나, 심장이 가라앉기를 기다렸다.

---

탈의실의 문이 열린 것은 무도회가 끝난 뒤였다.

"왜 그랬죠?"

세레나는 문가에 서 있었다. 드레스는 흐트러지지 않았지만 어깨가 아주 조금 내려가 있었다. 홀의 모든 빛이 사라진 뒤의 얼굴은 훨씬 어렸다.

"……발이 아파 보였어서요."

"언제부터요?"

"어제 연습 때부터요. 오른발 뒤꿈치가 바깥으로 쏠렸어요."

세레나는 한동안 아무 말도 하지 않았다. 문틀에 한 손을 짚고, 천천히 숨을 내쉬었다.

"……눈이 너무 많군요, 당신은."

"죄송해요."

"사과하지 마세요. 사과받는 건 싫어요."

"네."

"감사하다고도 안 할 거예요."

"괜찮아요."

세레나는 입술을 깨물었다. 그리고 낮게, 아주 낮게, 거의 자기에게 하는 듯이 말했다.

"저는 누군가가 제 실수를 덮어 준 적이 한 번도 없어요. 덮어 주면 그 사람이 저를 이긴 게 되니까. 그게 규칙이에요."

"그럼 이긴 걸로 하세요."

"뭐라고요?"

"제가 이겼다고 하세요. 그럼 규칙을 어기지 않았잖아요."

세레나는 나를 멍하니 바라보았다. 그러다 눈을 감고, 한쪽 입꼬리를 아주 조금 올렸다. 웃음이라고 부르기에는 너무 작고, 비웃음이라기에는 너무 지쳐 있었다.

"……바보 같은 사람이군요."

"자주 들어요."

"당신 같은 사람을 이길 수는 없겠어요."

"이긴 걸로 하신다면서요."

"그건 취소예요."

그녀는 돌아섰다. 문턱을 넘다가 발을 멈추고, 어깨너머로 짧게 말했다.

"뒤꿈치 얘기는……고마워요."

"……천만에요."

"감사하다고 안 한다고 했잖아요!"

그녀는 곧 사라졌다. 나는 한참 그 문을 보다가 노트를 폈다.

*—세레나 발트하임은 무엇을 원하는지 모르는 사람이다. 원해야 할 것만 알고 있다.*
*—내가 아직 모른다고 했을 때, 그녀가 화낸 것은 부러워서였다.*
*—그녀는 적이 아니다. 하지만 아직 친구도 아니다. 그 사이의 이름은 아직 없다.*`},

{n:15,title:'카일런과의 화해',season:'가을',text:`그해 가을, 북부 대공 부자가 다시 수도를 찾았다.

백작가의 아들은 얼굴이 하얗게 질린 채 물러났다. 카일런은 그의 뒷모습을 잠깐 보다가 고개를 돌렸고, 나와 눈이 마주쳤다. 그는 눈을 피하지 않았다. 대신 아주 약간 턱을 들어 올렸다. 그것은 사과도, 인사도 아니었다. 다만 한 번의 선언 같았다.

발코니는 서늘했다.

늦은 밤 홀의 소음을 등에 지고 서 있으면 달이 낮게 걸려 있었다. 나는 난간에 팔을 얹고 심호흡을 하다가, 뒤에서 발소리를 들었다.

"실례한다."

카일런이었다. 그는 두 걸음쯤 떨어진 곳에 멈춰 섰다. 한참 아무 말도 하지 않았다. 두 번이나 입을 열려다 다물었다. 나는 기다렸다. 아드리안이 내게 가르쳐 준 가장 좋은 대답은 기다리는 것이었다.

손등은 평범했다. 하지만 손가락 끝이 이상했다. 중지와 약지의 끝마디가 짧았고, 피부가 하얗게 얼어붙은 흔적처럼 반질거렸다.

"열 살 때 눈보라 속에서 개를 찾으러 나갔다가 얻은 것이다."

그의 목소리는 평탄했다. 일부러 평탄하게 만든 소리였다.

"개는 못 찾았다. 손가락은 반이 얼어 버렸다. 북부에서는 이런 것을 부끄러워한다. 약해서 얻은 상처라고 하니까. 나는 그날 이후로 이 손을 한 번도 사람 앞에 내놓지 않았다."

"……."

바람이 한 번 불었다. 나는 그의 손을 한참 보았다.

"그때 카일런 님의 얼굴은 화난 얼굴이 아니었어요."

{n:16,title:'홀트 선생의 비밀',season:'늦가을',text:`홀트 선생의 소매 끝이 기워져 있다는 것을 안 것은 오래전이었다.

"홀트 선생님의 급여를 올려 드리고 싶어요."

"이미 두 번 제안했습니다."

"선생께서는 두 번 모두 거절하셨습니다. 직무에 합당한 만큼만 받겠다고 하셨습니다. 한 번은 아주 정중하게, 한 번은 아주 단호하게."

그 주 금요일, 나는 일부러 공부방에 일찍 갔다.

선생은 아직 오지 않았다. 책상 위에는 평소처럼 지도와 교본이 정리되어 있었다. 그런데 큰 지도책 사이에서 하얀 모서리가 삐져나와 있었다. 낡은 편지지였다. 접힌 선이 닳아 거의 찢어지기 직전이었다. 나는 그것을 건드리지 않았다. 다만 글씨를 보았다.

그리고 숨이 멎었다.

가늘고 단정한 필체. 획의 끝을 길게 빼는 버릇. 나는 그 글씨를 알았다. 호두나무 상자의 뚜껑에 새겨진 글자와 같았다. 서재 문패에 걸려 있던 글씨, 매일 아침 내 이름을 노트 위에 적어 주던 글씨.

"읽으셔도 됩니다."

문가에서 목소리가 났다. 선생이 서 있었다. 평소보다 얼굴이 창백했고, 손에는 책이 한 권 들려 있었다.

"어차피 아가씨에게 쓰인 편지이기도 하니까요."

선생은 천천히 걸어와 책상 앞에 앉았다. 지도책 사이에서 편지를 꺼내 내게 건넸다. 나는 두 손으로 받았다. 종이가 얇아서 손끝이 떨렸다.

*마르가레타 선생.*
*부탁이 하나 있소. 내가 만일 먼저 가게 된다면, 내 딸은 말이 없는 아이요. 그러나 말이 없다고 비어 있는 것이 아니오. 그것을 알아봐 줄 사람이 필요하오. 선생이라면 알아볼 것이오.*

날짜를 보았다. 아버지가 돌아가시기 두 달 전이었다.

나는 한동안 아무 말도 하지 못했다. 그 편지의 한 줄 한 줄이 가슴 속으로 천천히 가라앉았다. 두 달 전. 그때 아버지는 건강했다. 평소와 다름없이 서재에서 일하고 계셨다. 그런데 이미 알고 있었다. 자신에게 무슨 일이 생길 수 있다는 것을.

"……아버지는 알고 계셨군요."

"무엇을 알고 계셨는지는 저도 모릅니다."

선생의 목소리는 평소처럼 단정했지만 약간 낮았다.

"저는 그분을 한 번도 직접 뵌 적이 없습니다. 십 년 동안 학문 서신만 주고받았습니다. 그분은 제가 가장 신뢰하던 동료였지요. 이 편지를 받았을 때는, 단순한 걱정이라고 생각했습니다. 아버지의 마음은 원래 그런 것이니까요. 하지만 그분이 돌아가시고 나서야, 그것이 걱정이 아니었다는 것을 알았습니다."

"……그래서 이 집에 오셨어요?"

"공작 각하께서 저를 직접 면접하셨습니다. 이상한 일이었지요. 가정교사 면접을 공작이 직접 하는 일은 드뭅니다. 각하께서는 제게 이 편지에 대해 묻지 않으셨습니다. 보여 달라고도 하지 않으셨습니다. 다만 한 가지를 말씀하셨습니다."

선생은 안경을 벗었다. 맨눈이 지치고, 의외로 젊어 보였다.

"'그분의 부탁이라면 받겠다.' 마치 그 부탁의 존재를 이미 알고 계신 사람처럼요."

나는 숨을 삼켰다. 공작은 그 편지를 알고 있었다. 이 모든 것이 한 줄로 이어졌다. 아버지와 선생, 선생과 공작, 공작과 상자. 어떤 그림이 서서히 윤곽을 드러내고 있었다. 하지만 아직 얼굴은 보이지 않았다.

"제가 급여를 거절한 이유를, 아가씨는 궁금하셨겠지요."

"……네."

"저는 이 일을 연민으로 맡은 것이 아닙니다. 약속으로 맡았습니다. 그분이 저를 믿고 부탁하셨는데, 그 신뢰를 돈이 필요해서 받아들인 것처럼 만들고 싶지 않았습니다."

선생은 손수건으로 입을 가리고 다시 기침을 했다. 이번에는 오래 이어졌다. 나는 일어나 서랍을 열고, 그날 아침 탠지가 올려 둔 따뜻한 차를 잔에 따라 건넸다.

"……설탕은."

"한 조각만 넣었어요."

선생이 처음으로 소리 내어 웃었다. 짧고 낮은 웃음이었다.

"그렇군요. 아가씨는 정말 놀라운 분입니다."

"선생님."

"네."

"도움이 필요하신 건, 부끄러운 일이 아니에요."

선생은 찻잔을 두 손으로 감싸 쥐었다. 오래 말이 없었다. 창밖에서 마른 잎이 한 장 떨어졌다.

"……아가씨가 아니라, 제가 도움이 필요했다는 것을 인정하기가 어려웠습니다."

그것은 내가 이 집에서 들은 가장 솔직한 말 중 하나였다.

"오늘부터 점심은 부엌 아주머니와 함께 드시는 걸로 해요."

"……그것은 직무에 포함되지 않습니다."

"제 수업에 포함시킬게요. 관찰 과목이요. 선생님이 점심시간에 누구와 앉는지를 관찰해야 해서요."

선생은 한참 나를 보다가 안경을 고쳐 썼다. 그 손끝이 이번에는 떨리지 않았다.

"……부엌 아주머니의 호두 과자는 훌륭하다고 들었습니다."

"네. 정말요."

"알겠습니다. 수업의 일환으로 받아들이겠습니다."

그 뒤로 선생은 점심마다 부엌에 앉았다. 마르타 아주머니는 처음 이틀은 선생이 먹을 때마다 말없이 눈으로만 좇더니, 사흘째에는 호두 과자를 두 개씩 접시에 올렸다. 선생은 아무 말도 하지 않고 두 개 모두 먹었다.

*—아버지는 두 달 전에 알고 있었다. 자신이 먼저 갈지도 모른다는 것을.*
*—공작님은 그 편지의 존재를 알았다. 그렇다면 공작님과 아버지는 내가 모르는 곳에서 약속을 했다.*
*—그 약속이 무엇인지 알게 되는 날, 나는 이 집을 어떻게 볼까.*`},

{n:17,title:'14세의 겨울',season:'겨울',text:`열네 살 생일 아침, 문 앞에는 아무것도 놓여 있지 않았다.

나는 문손잡이를 쥔 채 한참 서 있었다. 복도에는 아침 햇살이 길게 들어와 있었고, 바닥은 깨끗했다. 해마다 놓여 있던 그 자리에는 먼지 한 톨 없었다. 가슴 어딘가가 아주 조금 내려앉았다. 아무 일도 아니라고, 이미 몇 번이나 책을 받았으니 충분하다고 스스로를 달랬다. 그런데도 손끝이 시렸다.

"아가씨!"

탠지가 복도 끝에서 달려오다 나를 보고 멈췄다. 손에는 앞치마가 구겨진 채 쥐여 있었다.

"어, 아니, 그, 먼저 내려가세요! 식당으로요! 제가 머리는 나중에 해 드릴게요! 지금은 아니에요! 지금은 먼저 내려가야 해요!"

탠지의 웃음이 어딘가 과하게 환했다. 나는 그것이 거짓 웃음이 아니라 숨기고 있는 웃음이라는 것을 알았다. 노트에 쓸 새도 없이 등을 떠밀렸다.

계단을 내려가는 동안 어디선가 호두 과자 냄새가 났다. 식당 문 앞에서 나는 걸음을 멈췄다.

문 너머에서 소리가 났다. 숨죽인 웃음, 그릇 부딪치는 소리, 누군가의 헛기침. 나는 손잡이를 잡고 한 번 숨을 쉬었다. 그리고 문을 열었다.

---

식당은 사람으로 가득했다.

긴 식탁의 한쪽 끝에는 마르타 아주머니가 서서 커다란 케이크를 받치고 있었다. 세 단으로 쌓은 호두 케이크였고, 꼭대기에는 설탕으로 만든 작은 사과가 얹혀 있었다. 그 옆에는 홀트 선생이 곧은 자세로 앉아 있었는데, 오늘은 소매 끝이 새것이었다. 마구간의 말 없는 마부는 모자를 가슴에 얹고 서 있었고, 정원사 할아버지는 장미 한 송이를 들고 있었다. 세탁실의 쌍둥이 자매가 처음으로 서로의 말을 끝까지 듣고 있었다.

식탁 한쪽에는 반쯤 열린 창문으로 아드리안이 어깨를 걸치고 있었다. 잉크 묻은 손으로 작은 병 하나를 들고 있었다. 그 옆에는 로잘리가 쓴 편지가 열 장쯤 쌓여 있었다. 반쯤은 오려진 채였다. 카일런의 편지는 한 장, 단정한 한 줄이 있었다. 세레나의 카드에는 아무 말 없이 하얀 리본만 매어져 있었다. 그것이 그녀의 방식이라는 것을 나는 알았다.

마로트가 문 옆에서 정확한 각도로 고개를 숙였다.

"생일 축하드립니다, 아가씨."

"오렌지 양은 오늘 아침 일곱 번 울 뻔했습니다."

"마로트 님!"

탠지가 얼굴이 붉어진 채 외쳤다. 마로트는 고개를 들지 않았다. 입가에 아주 작은, 이번에는 분명한 웃음이 걸려 있었다.

나는 말이 나오지 않았다. 그때 식탁의 가장 먼 끝에서 의자가 뒤로 밀리는 소리가 났다.

에드릭 트로네가 서 있었다.

해마다 비어 있던 그 의자의 앞에서, 그는 평소와 같은 검은 옷을 입고 손에 책 한 권을 들고 있었다. 그가 천천히 식탁을 따라 걸어왔다. 긴 식탁이 이렇게 짧았던 적이 있었나 싶을 만큼, 걸음마다 한 사람의 시선이 그를 따라갔다. 그는 내 앞에서 멈췄다.

"……매년 문 앞에 두었다."

목소리는 조용했다. 하지만 이 방 안의 모든 사람이 숨을 죽이고 있었다.

"올해는, 직접 주고 싶었다."

그가 책을 내밀었다. 회색 표지의 두꺼운 노트가 아니었다. 파란 가죽 표지의 지도책이었다. 표지에는 아무것도 새겨져 있지 않았다.

"이것은 가고 싶은 곳을 적는 책이다. 지도 위에. 다 채우지 않아도 된다."

나는 책을 받았다. 두 손으로. 가죽이 따뜻했다. 방금 전까지 누군가가 오래 쥐고 있었던 것처럼.

"네 이름은 둘이다."

그가 말했다. 이 말을 준비하는 데 얼마나 오래 걸렸는지, 목소리의 단단함이 알려 주었다.

"에버하트의 딸이고, 트로네의 딸이다. 어느 쪽도 버리지 않아도 된다."

나는 고개를 끄덕였다. 눈앞이 흐려졌다. 그 말이 내가 이 집에서 가장 오래 기다려 온 문장이었다는 것을, 말하기도 전에 알았다. 이름 하나를 바꾸는 데 필요한 것은 도장 세 개와 어른들의 한숨 몇 번이었지만, 이름을 둘 다 가지는 데 필요한 것은 단 한 사람의 한 줄이었다.

"……감사합니다."

"……그래."

입술이 다른 말을 만들려다 멈췄다. 한 글자였다. 나는 그것을 삼켰다. 아직은 입 밖에 내기에 너무 무겁고, 너무 소중한 말이었다.

그는 알아챈 것 같았다. 책을 쥔 내 손 위로 그의 손이 천천히 내려왔다. 아주 짧게, 어깨를 한 번 두드리듯 쥐었다가 떨어졌다.

"……서두르지 않아도 된다."

낮은 목소리였다.

"나는 기다리는 데는 익숙하다."

식당 안이 얼어붙었다가, 천천히 녹았다. 탠지가 손으로 입을 막았고, 마로트의 시선이 아주 짧게 천장으로 올라갔다.

"……식사한다."

"네."

"식는다."

"네."

탠지가 코를 훌쩍이다가 눈물이 터졌고, 로잘리의 편지 뭉치가 식탁에서 떨어졌고, 마르타 아주머니가 케이크를 놓칠 뻔했다. 홀트 선생은 안경을 벗고 오래 눈을 닦았다. 아드리안이 창틀에서 낮게 웃으며 말했다.

"야, 이건 담 위에서 보기엔 너무 좋은 장면인데."

"들어오십시오, 웨스트콧 도련님."

마로트가 말했다. 그가 아드리안에게 먼저 말을 건 것은 그날이 처음이었다.

---

그날 저녁, 나는 공작의 서재 앞에 섰다.

아직 노크하지 않았다. 손에는 파란 지도책을 들고 있었고, 마음속에는 아침의 모든 장면이 겹겹이 쌓여 있었다. 문은 이번에도 아주 조금 열려 있었다. 안쪽에서 의자 끄는 소리가 났다. 이어서 낮은 목소리가 문틈으로 나왔다.

"들어와라."

나는 숨을 한 번 쉬고, 문을 열었다.

서재는 변한 것이 없었다. 책으로 덮인 벽, 창가의 지도, 상자가 놓인 선반. 다만 한 가지가 달라져 있었다. 책상 옆, 창가 쪽에 작은 책상이 하나 더 놓여 있었다. 새것은 아니었다. 오래 닦은 듯 윤이 나는 호두나무였고, 높이가 내 키에 꼭 맞았다.

"일요일 저녁."

에드릭이 책을 보며 말했다. 이쪽을 보지 않은 채.

"서재에서 같이 공부해도 된다. 네가 원하면."

나는 그 작은 책상 위에 손을 얹었다. 가장자리에 아주 작은 흠집이 있었다. 어린아이가 연필 끝으로 눌러 본 것 같은 흠이었다. 이 책상은 새로 만든 것이 아니라, 오래 보관해 두었던 것이었다. 누구를 위해서? 나는 묻지 않았다. 묻지 않아도 되는 질문도 있었다.

의자에 앉았다. 책상 위에는 이미 새 노트와 깃펜이 한 벌 놓여 있었다. 회색 표지, 촘촘한 줄. 그리고 그 옆에는 서랍이 하나 있었다.

나는 서랍 손잡이를 잡았다. 열리지 않았다. 열쇠 구멍이 있었다. 작고, 가장자리가 둥글고, 위쪽이 약간 휘어진 특이한 모양이었다.

나는 그 모양을 알고 있었다.

호두나무 상자의 열쇠 구멍과 같았다. 정확히 같은 모양이었다.

손이 서랍 손잡이 위에서 멈추었다. 공작의 펜 소리는 계속 이어지고 있었다. 일정한 속도로, 일정한 간격으로. 그는 내가 무엇을 보았는지 알지 못하는 것 같았다. 아니, 어쩌면 알면서 모른 척하고 있는 것인지도 몰랐다. 이 집에서는 둘 다 가능했다.

나는 손을 떼고 지도책을 펼쳤다. 첫 장을 넘기고, 펜을 들었다. 가고 싶은 곳. 나는 오래 생각하다가, 지도 위 아주 작은 점 하나에 동그라미를 쳤다. 우리가 있는 이 저택이었다.

*—나는 이제 이름이 둘이다. 어느 쪽도 버리지 않아도 된다.*
*—일요일 저녁의 서재에는 내 책상이 있다.*
*—그 책상의 서랍은 상자와 같은 열쇠로 열린다. 서두르지 않겠다. 하지만 잊지도 않겠다.*

창밖에서 눈이 내리고 있었다. 이 집에서 맞는 네 번째 겨울이었다.`}

{n:18,title:'서재의 서랍',season:'겨울',text:`다섯 번째 겨울이 올 때까지, 일요일 저녁의 서재 책상 서랍은 한 번도 열리지 않았다.

나는 열어 달라고 하지 않았고, 에드릭도 열어 주겠다고 하지 않았다. 우리 사이의 규칙은 그런 식으로 서서히 만들어졌다. 일요일 저녁 여섯 시에 서재 문을 두드리고, 세 번째 노크가 끝나기 전에 "들어와라"라는 말이 오고, 나는 창가의 작은 책상에 앉고, 그는 큰 책상에 앉는다. 이후 두 시간은 한마디도 하지 않는다. 펜 소리와 종이 넘기는 소리, 벽난로 장작이 가라앉는 소리뿐이다.

그 두 시간이 내가 이 집에서 가장 좋아하는 시간이 되었다는 것을 알아챈 것은 꽤 오래 뒤였다.

그는 말이 없는 대신 습관이 많았다. 내가 책장을 넘기면 그도 한 박자 뒤에 책장을 넘겼다. 내가 질문이 있어 숨을 들이쉬면 그의 펜이 멈췄다. 그러면 나는 질문을 하지 않았고, 펜은 다시 움직였다. 우리는 그렇게 말하지 않고도 서로의 호흡을 읽는 법을 배웠다. 그것은 부녀라는 말보다 먼저 생긴 어떤 것이었다.

그날 저녁, 눈이 오기 시작한 직후였다.

"별자리 도감을 가져다 다오. 세 번째 칸이다."

에드릭은 지도에서 눈을 떼지 않고 말했다. 나는 의자를 끌고 가 책장 앞에 섰다. 세 번째 칸에는 낡은 책들이 빽빽했다. 손을 뻗어 두꺼운 도감을 빼내려는 순간, 책 사이에서 무엇이 미끄러져 나와 발치로 떨어졌다.

접힌 종이였다.

한 번 접히고, 한 번 더 접힌 작은 조각. 한쪽 모서리가 찢겨 있었다. 가위가 아니라 손으로 뜯은 가장자리였다. 나는 에드릭을 흘끗 보았다. 그는 여전히 지도를 보고 있었다. 나는 허리를 굽혀 종이를 주웠다. 읽지 말아야 한다는 것을 알았다. 하지만 이미 글씨가 보였다.

가늘고 단정한 필체. 획의 끝을 길게 빼는 버릇. 아버지의 글씨였다.

*…에드릭, 아이에게는 말하지 마시오. 말하지 않는 것이 지키는 것이오. 그러나 아이가 스스로 알아차린다면*

거기서 끊겨 있었다. 찢긴 가장자리 너머의 문장이 무엇이었는지 알 수 없었다. 나는 숨을 한 번 쉬었다. 손이 떨리지 않도록 종이를 쥐고, 눈으로 한 글자 한 글자를 외웠다. 그리고 접힌 선을 그대로 따라 접어서, 원래 있던 자리에, 책 사이에, 같은 각도로 되돌려 놓았다.

"찾았나."

"……네."

나는 도감을 들고 돌아와 책상에 앉았다. 에드릭은 내가 가져온 책에 시선도 주지 않았다. 그는 아무것도 보지 못한 사람처럼 앉아 있었다. 나는 노트를 펴고 수업 필기를 하는 척하며, 그 문장을 아주 작은 글씨로 옮겨 적었다.

아이에게는 말하지 마시오. 그러나 아이가 스스로 알아차린다면.

그 아이는 나였다. 아버지는 이 집의 주인에게 나에게 말하지 말라고 썼다. 그것이 지키는 일이라고. 그리고 그 뒤에 이어질 문장이 무엇인지, 나는 알고 싶어서 가슴이 아플 지경이었다.

그날 밤 노트에 이렇게 적었다.

*—아버지는 공작님에게 편지를 썼다. 공작님은 그 편지를 책갈피로 쓴다.*
*—다른 책들에도 있을까.*
*—나는 오늘 처음으로, 공작님에게 말하지 않는 것을 가졌다.*

세 번째 줄은 한참 보다가 지우지 않았다. 말하지 않는 것은 이 집에서 가장 오래된 예의였다. 하지만 나는 그것이 이번에는 예의가 아니라 비밀이라는 것을 알았다. 그리고 비밀은 가지는 사람에게 값을 치르게 한다는 것도.

그 겨울 내내 일요일 저녁은 이전과 같았다. 달라진 것은 내가 책장을 볼 때마다 어느 책 사이에 어느 종이가 숨어 있을지 상상하게 되었다는 것뿐이었다.`},

{n:19,title:'장부의 숫자',season:'봄',text:`홀트 선생은 열다섯 살의 내게 회계를 가르치기 시작했다.

"영애는 장부를 읽을 줄 알아야 합니다. 숫자는 사람보다 거짓말을 못 하니까요. 다만 숫자를 쓰는 사람은 거짓말을 할 수 있습니다."

처음에는 마르타 아주머니의 식료품 장부를 보았다. 밀가루, 설탕, 버터, 호두. 항목은 소박했고 숫자는 정직했다. 그다음에는 정원 장부, 마구간 장부, 세탁실 장부. 모든 장부는 하나의 이야기를 하고 있었다. 이 저택이 어떻게 숨 쉬는지에 대한.

그리고 그해 봄, 집사실의 큰 장부를 처음 보았다.

마로트는 나를 책상 앞에 앉히고 열두 권의 장부 중 가장 얇은 한 권을 건넸다. 가장 쉬운 것을 주려는 배려였다. 나는 한 시간 동안 조용히 읽었고, 읽다가 이상한 것을 발견했다.

가장 얇은 장부에 가장 큰 숫자가 있었다.

*특별 보관비.* 해마다 같은 날, 같은 금액이 어디론가 빠져나가고 있었다. 십삼 년 동안. 첫해에는 작은 액수였던 것이 해가 갈수록 커졌고, 올해는 저택 한 해 경비의 절반에 가까웠다. 수취인 칸은 비어 있었다. 사유 칸에는 두 글자만 적혀 있었다. *문서.*

"마로트 님."

"네, 아가씨."

"이 항목은……"

"질문하지 않으시는 것이 좋습니다."

그의 목소리는 평소와 같았다. 하지만 펜을 쥔 손가락이 하얗게 되어 있었다. 나는 장부를 닫았다.

그날 이후 나는 마로트를 더 자세히 보았다. 소매 끝의 잉크 얼룩이 늘었고, 눈 밑은 한 겹 더 어두웠다. 아침 식사 때 그는 에드릭의 찻잔을 정확하게 채웠지만, 한 번은 잔을 든 손이 아주 조금 떨렸다. 아무도 보지 못한 척했다. 나는 보았다.

---

그 주 목요일 밤이었다.

잠이 오지 않아 복도로 나왔다가, 집사실 문 아래로 불빛이 새는 것을 보았다. 새벽 두 시였다. 노크를 하려다 멈췄다. 이 시간에 노크는 대답을 요구하는 일이다. 그래서 손잡이를 아주 조금 돌려 문을 밀었다.

마로트는 책상에 엎드려 있었다.

한 손은 장부 위에, 다른 손은 서랍 속에 들어가 있었다. 서랍 안에서 은빛 회중시계가 반짝였다. 그는 그것을 쥔 채 잠들어 있었다. 처음 보는 얼굴이었다. 눈을 감은 얼굴은 서른이 훨씬 안 되어 보였고, 완벽하게 다듬어진 낮의 얼굴보다 훨씬 지쳐 있었다. 책상 위에는 식은 찻잔 두 개와 펼쳐진 장부 다섯 권이 있었다.

나는 문을 닫지 않았다. 대신 벽에 걸린 외투를 가져다 그의 어깨에 덮었다. 그가 깰까 봐 숨을 참았다.

"……아가씨."

눈이 떠졌다. 마로트는 일어나려다 외투에 걸려 멈췄고, 곧 자기가 어떤 상태인지 깨달았다. 그의 얼굴이 순식간에 평소의 얼굴로 돌아왔다. 아주 빠르게, 그러나 완전히는 아니었다.

"죄송합니다. 이런 모습을……"

"저는 아무것도 못 봤어요."

그가 숨을 멈췄다. 우리가 처음 서로의 연기를 알아본 날 이후, 이 문장은 이 집에서 가장 오래된 약속이었다.

"……아가씨는 위험한 분입니다."

"이미 알고 계셨잖아요."

"네."

마로트는 외투를 어깨에서 내리고 천천히 일어섰다. 서랍을 닫으려다 손을 멈췄다. 한참을 그렇게 서 있다가, 아주 낮게 말했다.

"올해 말에 현금이 바닥납니다."

나는 숨을 삼켰다.

"북쪽 모피 거래가 막혔고, 황실이 올해부터 영지세를 올렸습니다. 거기에 특별 보관비가 매년 늘고 있습니다. 각하께서는 모르십니다. 아니, 아십니다. 하지만 숫자를 직접 보신 적은 없습니다."

"왜 말씀하지 않으셨어요?"

"말씀드리면 걱정하실 것이고, 걱정하시면 서재에 더 늦게까지 계실 것이기 때문입니다."

그의 목소리가 아주 조금 갈라졌다.

"각하께서는 이미 충분히 오래 서재에 계셨습니다."

나는 그 말이 이 집에서 마로트가 한 가장 긴 고백이라는 것을 알았다. 오랜 세월 이 사람이 혼자 지고 온 것이 장부 몇 권이 아니라, 한 사람이 쓰러지지 않도록 지키는 일이었다는 것을.

"혼자 감당하지 마세요."

"그것이 집사의 일입니다."

"그럼 저도 이 집에서 일을 할게요. 홀트 선생님께 회계를 배우고 있으니까, 숫자는 읽을 수 있어요."

"아가씨."

"공작님께 말하는 건 약속할 수 없어요. 하지만 같이 있을 수는 있어요."

마로트는 한동안 대답하지 않았다. 책상 위의 촛불이 한 번 흔들렸다. 그의 시선이 서랍 속 회중시계로 내려갔다가 천천히 올라왔다.

"……이 시계는 제 아버지의 것입니다."

처음 듣는 말이었다.

"이 저택의 전임 집사장이셨지요. 십삼 년 전에 돌아가셨습니다. 저는 아직 이것을 찰 자격이 없다고 생각합니다. 이 집을 지키기에 충분하다고 생각하는 날, 차려고 합니다."

"그날이 언제인데요?"

"……아직 모르겠습니다."

"그럼 그날까지 제가 같이 기다릴게요."

마로트는 처음으로 눈을 내렸다. 속눈썹이 한 번 떨렸다. 평소의 완벽한 각도가 아닌, 아주 서투른 각도로 그가 고개를 숙였다.

"……감사합니다, 아가씨."

그날 밤 우리는 새벽 네 시까지 장부를 같이 읽었다. 그것은 이 집에서 내가 처음으로 맡은 일이었다.

---

며칠 뒤, 공작이 서재에서 나를 불렀다.

"장부 하나를 가져다 다오. 동쪽 영지 것이다."

나는 책장을 훑다가 지리지 한 권을 꺼내려 했다. 그때 책 사이에서 다시 종이 한 장이 미끄러졌다. 이번에는 알고 있었다. 나는 허리를 굽혀 주웠다.

*…문서는 그날 밤 사본으로 옮겨 두었소. 동쪽의 책들 사이에. 나머지는*

또 거기서 끊겼다. 나는 에드릭의 등을 보았다. 그는 지도 위로 몸을 숙인 채 아무것도 보지 못한 사람처럼 앉아 있었다. 나는 종이를 책 사이에 되돌리고, 그가 시킨 장부를 들고 갔다.

*—문서. 동쪽. 사본.*
*—특별 보관비의 사유도 '문서'였다. 이 두 단어가 같은 것을 가리킨다면.*
*—마로트 님은 오랜 세월 혼자 이 숫자를 지켜 왔다. 나는 이제 그 곁에 앉는다.*`},

{n:20,title:'황자의 가면',season:'여름',text:`율리안 전하의 초대장은 하늘색 봉투에 담겨 도착했다.

공식 황실 인장이 아니라, 아주 작게 접힌 쪽지였다. *온실에서 기다리겠습니다. 장미가 늦은 사과를 받을 시간이에요.* 마로트는 그 쪽지를 보더니 정확히 일 초 동안 눈썹을 올렸다가 내렸다. 그리고 마차를 준비했다.

황궁 서쪽 끝에는 오래된 유리 온실이 있었다. 사람들은 잘 오지 않았다. 유리가 군데군데 금이 가 있었고, 안쪽에는 덩굴 장미가 천장까지 뒤엉켜 있었다. 문을 열자 따뜻한 흙냄새와 장미 향이 한꺼번에 밀려왔다.

율리안은 온실 한가운데의 낡은 철제 의자에 앉아 있었다.

열여섯 살의 황자였다. 소년의 선이 사라지기 시작했고, 목소리는 낮아졌고, 웃음은 더 정교해졌다. 하지만 지금 그의 얼굴에는 웃음이 없었다. 처음으로 방에 아무도 없는 사람의 얼굴이었다.

"왔군요."

"초대받았으니까요."

"앉으세요. 여기는 의자가 두 개밖에 없지만, 그중 하나는 아무도 앉지 않아서 곰팡이가 폈어요."

나는 웃지 않고 곰팡이가 핀 의자 쪽 가장자리에 앉았다. 율리안은 그것을 보더니 입가가 아주 조금 올라갔다.

"제가 불렀을 때 와 주는 사람은 많아요. 하지만 이유를 묻지 않고 와 주는 사람은 처음이에요."

"이유를 말씀하실 것 같아서요."

"맞아요."

그는 한참 말이 없다가, 손을 내려다보았다. 왼손이 오른손 엄지손톱을 누르고 있었다. 이번에는 그것을 감추려 하지 않았다.

"삼 년 전에 당신이 이걸 말한 뒤로, 저는 거울 앞에서 몇 번이나 연습했어요. 손을 못 쓰게 하려고요. 한 번도 성공하지 못했어요."

"……."

"연기하다 보면 방의 불이 꺼진 뒤에도 얼굴이 안 풀려요. 웃는 근육이 굳어서, 혼자 있어도 입꼬리가 올라가 있어요. 어느 날 아침에 거울을 보다가 이 얼굴이 누구 얼굴인지 모르겠더라고요."

그의 목소리는 평소보다 낮고 느렸다. 장미 가지에서 벌 한 마리가 윙윙거렸다.

"황태자 형은 완벽해요. 선천적으로요. 저는 둘째예요. 둘째에게 필요한 건 형의 그늘 속에서도 방을 밝게 하는 재주예요. 모두가 저를 좋아하지만, 아무도 저를 필요로 하지 않아요. 좋아하는 것과 필요한 것은 달라요."

"전하."

"율리안이라고 불러 주세요. 오늘만이라도."

나는 잠깐 입을 다물었다가, 조용히 말했다.

"……율리안 님."

"그것도 어색하군요. 친구들은 저를 율이라고 줄여 불러요. 저한테 친구가 없어서 그 호칭이 한 번도 쓰인 적이 없지만."

그 말이 너무 담담해서 오히려 가슴에 박혔다. 나는 그를 바라보았다. 열여섯 살의 황자가 장미 가지 아래에서 자기 이름을 줄여 줄 사람을 기다리고 있었다.

"……율."

그의 어깨가 아주 조금 내려앉았다. 웃음이 아닌 것이, 얼굴 위로 천천히 번졌다. 안도와, 그 뒤에 따라온 무언가. 이름 붙이기에는 너무 오래 쌓인 것이었다.

"……고마워요."

"저도 한 가지만 물어도 돼요?"

"뭐든지요."

"처음 만났을 때 제가 손 이야기를 했는데, 왜 화내지 않으셨어요?"

"당신이 말한 방식이 달랐으니까요. 사람들은 제 가면을 칭찬하거나 의심해요. 당신은 그냥 보았다고 했어요. 가면을 벗으라는 것도, 쓰고 있어도 된다는 것도 아니었어요. 그냥 보았다고."

나는 대답하지 않았다. 그것이 사실이었으니까.

---

해가 기울어 갈 무렵, 율리안이 일어섰다. 온실 문 쪽으로 걷다가 한 걸음 멈췄다.

"오늘 부른 이유가 하나 더 있어요."

그의 목소리가 평소보다 반 음 낮아졌다.

"이건 제가 말하면 안 되는 이야기예요. 아버님의 서재 앞을 지나가다 들은 것이에요. 우연히요. 그리고 우연이 아니라고 해도 상관없어요."

나는 가슴이 가라앉는 것을 느꼈다.

"에버하트라는 이름이 오갔어요. 아버님과 발트하임 백작이 있었어요. 백작이 이렇게 말했어요. '에버하트의 딸이 공작가에 있습니다.' 아버님은 한참 말씀이 없으시다가 이렇게 답하셨어요. '아직 아이다.'"

"……."

"백작은 이렇게 말했어요. '아이는 자랍니다.'"

온실 안의 공기가 서늘해졌다. 유리 천장 너머에서 새 한 마리가 날아갔다. 나는 숨을 한 번 쉬고, 손을 무릎 위에서 천천히 쥐었다.

"왜 말해 주시는 거예요?"

"저는 아버님의 아들이에요. 하지만 당신의 친구이기도 해요. 그 두 가지가 부딪치는 날이 올지도 모른다는 걸 알아요."

그의 눈이 진지했다. 가면의 흔적이 하나도 없었다.

"그날이 오면 저는 어느 쪽에 설지 아직 몰라요. 하지만 오늘은 알려 주는 쪽을 골랐어요. 이것도 제가 처음으로 선택한 일이에요."

"……고마워요, 율."

"이름을 불러 줘서 좋았어요. 한 번 더 해 주세요."

"율."

"……좋아요. 이 정도면 한 해는 버틸 수 있겠어요."

그는 웃었다. 이번 웃음은 근육으로 만든 것이 아니었다. 문을 열고 나가는 뒷모습은 방으로 들어올 때보다 훨씬 가벼워 보였다. 나는 그가 간 뒤에도 한참 온실에 앉아 있었다. 장미 향이 점점 짙어지고, 먼 곳에서 저녁 종이 울렸다.

*—율리안은 방 안에 아무도 없는 얼굴을 가지고 있다. 그리고 그것을 처음으로 내게 보여 주었다.*
*—발트하임 백작이 아버지의 이름을 황제 앞에서 꺼냈다. "아이는 자랍니다."*
*—시간이 많지 않다. 하지만 아직 얼마나 남았는지는 모른다.*`},

{n:21,title:'세레나의 선택',season:'가을',text:`그날 밤은 비가 내렸다.

가을비는 굵고 차가웠고, 저택 지붕을 두드리는 소리가 모든 소리를 덮었다. 나는 늦게까지 마로트와 장부를 읽다가 방으로 돌아와 막 불을 끄려던 참이었다. 그때 현관 쪽에서 문고리가 두 번, 세 번 거칠게 흔들렸다.

"아가씨!"

탠지가 복도를 달려왔다. 슬리퍼 한 짝을 잃어버린 채였다.

"문 앞에 누가 계세요! 비 맞고 계세요! 마차도 없이요!"

나는 외투를 걸치고 계단을 내려갔다. 마로트가 이미 현관에 서 있었다. 정장 차림이었고, 한 손에는 램프를 들고 있었다. 그가 열린 문 사이를 가리켰다.

비 속에 세레나 발트하임이 서 있었다.

흠뻑 젖은 금발이 얼굴에 달라붙어 있었고, 하얀 드레스 자락은 진흙으로 얼룩져 있었다. 한 손에는 젖지 않도록 외투 안에 품은 작은 서류 봉투가 있었다. 그녀의 입술은 파랗게 질려 있었다. 하지만 눈만은 이상할 정도로 또렷했다.

"……이 시간에 죄송해요."

"들어오세요."

"사과하지 말라고 하실 거죠."

"하지 않으려고요. 들어오세요."

세레나는 한 걸음 안으로 들어왔다. 그리고 거기서 다리가 풀렸다. 마로트가 한 걸음에 다가와 그녀의 팔을 붙들었고, 탠지가 담요를 가져왔다. 벽난로 앞으로 걸어가는 동안 세레나는 한마디도 하지 않았다. 따뜻한 차를 두 손으로 받고 나서야, 입술에 핏기가 돌아왔다.

"이걸 보세요."

그녀가 품에서 서류 봉투를 꺼냈다. 안에는 편지 한 장이 들어 있었다. 손이 떨려서 종이가 부스럭거렸다.

"내일 오전, 제가 황후 폐하께 이 편지를 전하기로 되어 있어요. 어머니의 지시예요."

나는 편지를 받아 펼쳤다.

글씨는 가늘고 단정했다. 획의 끝을 길게 빼는 버릇. 아버지의 필체와 같았다. 내용은 짧았다. *황실 문서고 관리 중 일부 기록을 개인적 이익을 위해 변조하였음을 고백한다. 이 일은 트로네 공작의 도움으로 은폐되었다.* 서명은 *에버하트.*

숨이 멎었다.

"……이건 아버지가 쓴 게 아니에요."

"알고 있어요."

세레나의 목소리가 낮았다.

"어머니가 가문의 서기관에게 쓰게 했어요. 폐하께서 이것을 읽으시면 공작가는 죄인을 숨겨 준 가문이 되고, 에버하트의 이름은 문서를 훔친 자가 돼요. 아무도 에버하트가 남긴 것을 신뢰하지 않게 되는 거죠."

나는 편지를 천천히 다시 읽었다. 한 줄, 한 줄. 그리고 알아챘다. 처음부터 눈에 걸리던 것이 무엇인지.

"세레나."

"네."

"서명을 보세요. 이 '하'의 획이요. 아버지는 'ㅎ'의 위쪽 점을 찍을 때 항상 오른쪽으로 쓸어 올렸어요. 여기는 곧게 내려요. 그리고 '트'의 가로획은 길게 빼는 사람이었는데, 이 서기관은 짧게 끊었어요. 글씨는 닮았지만 손이 달라요."

세레나가 나를 보았다. 눈이 커졌다.

"위조가 아주 정교한데도 틀리는 곳이 있어요. 아버지의 노트를 칠 년 넘게 읽은 사람만 알아볼 수 있는 부분이에요."

"……그럼 이걸 쓸 수 있다는 말이에요?"

"쓸 수 있어요. 폐하께 가기 전에 누군가 손을 한 번 더 보면 위조는 드러나요. 그리고 위조가 드러나면, 이 편지를 건넨 가문이 곤란해지지요."

방 안이 조용해졌다. 벽난로에서 장작 하나가 갈라지는 소리가 났다. 세레나의 얼굴이 천천히 창백해졌다. 자기 어머니의 계획이 무엇을 의미하는지 비로소 완전히 이해한 얼굴이었다.

"……제가 가문을 배신한 건가요."

"아니요."

"저는 지금 어머니의 편지를 다른 가문의 영애에게 보여 준 거예요."

"세레나는 가문을 구하러 온 거예요."

세레나가 고개를 들었다.

"위조가 폐하 앞에서 들통나면 발트하임 백작가는 돌이킬 수 없게 돼요. 그걸 막으려고, 이 비를 맞고 온 거잖아요."

세레나는 한참 동안 대답하지 않았다. 찻잔을 두 손으로 감싸 쥐고, 그 위로 올라오는 김을 바라보았다. 그리고 아주 작게 말했다.

"저는 평생 어머니가 시키는 대로 했어요. 걸음걸이, 웃음, 말투, 드레스 색. 한 번도 싫다고 한 적이 없어요. 싫다고 해 본 적이 없으니까 싫은지도 몰랐어요."

"……."

"오늘 이 편지를 받았을 때 처음으로 알았어요. 나는 이걸 하고 싶지 않다는 걸요. 그게 어떤 느낌인지도 처음 알았어요. 가슴이 쓰리고, 손이 떨리고, 그런데 이상하게 숨이 쉬어졌어요."

세레나는 눈을 감았다.

"저는 황후가 되고 싶지 않아요."

그 한마디가 방 안에 가볍게 내려앉았다. 마치 오래 기다린 것처럼.

"……그게 시작이에요."

"뭐가요?"

"원하지 않는 걸 아는 것이요. 원하는 걸 아는 건 그다음이에요."

세레나가 눈을 떴다. 눈가가 젖어 있었지만 울지는 않았다. 입꼬리가 아주 조금 올라갔다. 처음으로 웃는 법을 배운 사람의 웃음이 아닌, 그냥 웃는 사람의 웃음이었다.

"당신은 여전히 이상한 사람이군요."

"자주 들어요."

"이건 취소 안 할 거예요."

새벽이 오기 전에 에드릭이 내려왔다.

잠옷 위에 외투만 걸친 모습이었다. 그는 말없이 편지를 받아 읽었고, 한 번 더 읽었고, 그리고 아무 표정도 짓지 않은 채 세레나를 바라보았다.

"발트하임 영애."

세레나가 일어섰다. 젖은 드레스를 담요로 가린 채 정확하게 고개를 숙였다.

"……각하."

"오늘 밤 이곳에 왔다는 것은 기록되지 않는다. 마로트가 마차로 모셔다 드릴 것이다. 돌아가면 어머니께는 편지를 전달하지 못했다고 말하라. 서기관의 글씨가 서명 부분에서 어색해서, 확인하느라 하루 늦었다고."

"……그것으로 되나요?"

"충분하다."

에드릭은 편지를 접어 품에 넣었다.

"이 편지는 내일 아침 내가 직접 발트하임 백작에게 돌려줄 것이다. 한 줄만 덧붙여서."

"……뭐라고요?"

"'서명이 틀렸다. 고쳐서 다시 가져오게.'"

세레나의 눈이 커졌다. 마로트가 문 옆에서 입가를 아주 조금 굳혔다. 웃음을 참는 사람의 얼굴이었다. 나는 처음으로 에드릭의 얼굴에서 칼날 같은 것을 보았다. 분노가 아니라 오래 갈아 온 차가운 집념이었다.

"이 집의 문은, 이 시간에도 열린다."

그가 세레나에게 말했다.

"기억해 두어라."

세레나는 아무 대답도 하지 못하고 고개를 한 번 숙였다. 마차에 오르기 전, 현관에서 그녀가 내 쪽을 돌아보았다. 비는 그쳐 가고 있었고, 동쪽 하늘이 희끄무레하게 밝아 오고 있었다.

"아델라인."

"네."

"……고마워요."

"감사하다고는 안 하신다고 했잖아요."

"그건 취소예요."

세레나가 돌아섰다. 마차 문이 닫혔다. 바퀴 소리가 멀어졌다. 나는 한참 현관에 서 있었다. 이 비 오는 밤에 적이 하나 줄고, 이름 붙이기 어려운 친구가 하나 늘었다.

*—세레나는 오늘 처음으로 "하고 싶지 않다"고 말했다.*
*—위조의 서명은 틀렸다. 아버지의 글씨를 아는 사람이 이 집에 있었기 때문에.*
*—발트하임 백작은 아버지의 이름을 깎아내리려 한다. 그만큼 아버지가 남긴 것이 무서운 것이다.*`},
{n:22,title:'탠지의 거짓말',season:'겨울',text:`탠지가 쓰러진 것은 열여섯 번째 생일 직후, 눈이 많이 오던 아침이었다.

복도 끝에서 물동이가 굴러가는 소리가 났다. 나는 책을 놓고 뛰어나갔다. 탠지는 계단 아래 모퉁이에 쓰러져 있었고, 쏟아진 물이 대리석 위로 천천히 번지고 있었다. 얼굴이 종잇장처럼 하얬다. 앞치마 주머니가 뒤집혀 있었고, 그 속에서 작은 종이 두 장이 삐져나와 있었다.

마로트가 가장 먼저 도착했다. 그는 아무 말 없이 탠지를 안아 올렸고, 의사를 부르라고 짧게 지시했다. 그 목소리가 아주 조금 떨렸다는 것을 나는 들었다.

의사는 한 시간 뒤에 말했다. 과로와 영양 부족이라고. 며칠 쉬면 괜찮아질 것이라고. 나는 탠지의 침대 곁에 앉아 있다가, 바닥에 떨어진 앞치마를 주웠다. 주머니의 종이 두 장을 보았다.

한 장은 전당표였다. 반지 하나가 석 달 전에 맡겨졌고, 이자가 쌓이고 있었다. 다른 한 장은 마을 여관 세탁장의 일삯 영수증이었다. 야간 근무. 매주 수요일과 일요일 밤.

수요일. 탠지가 어머니를 뵈러 간다고 말하던 날이었다.

나는 오랫동안 그 종이들을 들여다보았다. 숫자와 날짜가 하나하나 이야기가 되었다. 탠지는 거짓말을 한 것이다. 한 번이 아니라 몇 달 동안, 웃으면서.

"……아가씨?"

탠지가 눈을 떴다. 나를 보더니 환하게 웃었다. 늘 그랬듯이, 너무 빨리.

"어, 제가 쓰러졌어요? 아유, 별것 아니에요! 어제 잠을 좀 못 자서요! 금방 일어날 수 있어요! 물동이가……"

"탠지."

"네!"

"……이거 뭐예요?"

나는 종이를 들었다. 탠지의 웃음이 멈췄다. 얼굴의 모든 색이 서서히 사라졌다. 침대 시트를 쥔 손이 하얗게 되었다.

"……그건."

"전당표예요. 어머니의 반지죠."

"아가씨, 제발……"

"세탁장 일도요. 수요일 밤마다 거기 계셨던 거죠."

탠지가 일어나 앉으려다 어지러워 다시 눕혀졌다. 그녀가 천장을 보며 숨을 몰아쉬었다. 그리고 갑자기 이상한 소리로 웃었다. 웃음이라고 하기에는 너무 갈라진 소리였다.

"아가씨는 정말 다 보시네요."

"탠지."

"전 아가씨가 보고도 모른 척해 주시는 줄 알았어요. 처음 만난 날부터 그러셨잖아요. 제 어깨도, 제 손도, 다 보셨는데 아무 말도 안 하셨잖아요. 그게 얼마나 고마웠는지 아세요?"

탠지의 눈이 젖어 있었다. 눈물이 아니라 분노에 가까운 것으로.

"그런데 이번엔 이렇게 문서까지 찾아내서 들이미시니까, 제가 갑자기 불쌍한 사람이 되는 것 같아요. 아가씨 앞에서만큼은 불쌍하고 싶지 않았는데."

"불쌍하다고 생각한 적 없어요."

"그럼 도와주실 거잖아요! 돈 주실 거잖아요! 그러면 저는 아가씨 덕에 사는 사람이 되는 거잖아요!"

"그게 왜 나쁜 거예요?"

"나쁜 거예요! 저는 이 집에서, 아가씨와 있을 때만큼은, 제 힘으로 서 있는 사람이었단 말이에요!"

탠지가 이불을 움켜쥐었다. 처음이었다. 이 사람이 소리를 지르는 것을 본 것은. 나는 그 자리에서 아무 대답도 하지 못했다. 맞는 말이었다. 그리고 내가 틀렸다는 것도 알았다. 내가 본 것은 사실이었지만, 내가 한 일은 그 사실을 탠지의 허락 없이 꺼내 놓은 것이었다.

"……미안해요."

"사과하지 마세요."

탠지가 얼굴을 돌렸다.

"오늘은 그냥 혼자 있고 싶어요."

나는 일어났다. 문을 닫을 때, 침대 위에서 어깨가 아주 조금 떨리는 것이 보였다. 오른쪽 어깨였다.

---

그날 밤, 나는 과수원으로 갔다.

겨울밤의 사과나무는 검은 손가락 같았다. 눈이 쌓인 돌담 위에 작은 등불이 하나 걸려 있었고, 그 옆에 누가 앉아 있었다. 아드리안은 열일곱 살이 되었다. 어깨가 넓어졌고, 목소리가 낮아졌고, 손가락에 묻은 잉크 얼룩은 이제 지도용 먹물로 바뀌어 있었다. 그가 내 발소리를 듣고 돌아보았다.

"무슨 일 있었어?"

"……친구와 싸웠어요."

"탠지?"

"어떻게 아세요?"

"너한테 싸울 친구는 몇 안 되니까."

나는 돌담 아래 눈 위에 걸터앉았다. 아드리안은 담에서 내려와 내 옆에 앉았다. 오래전 겨울 사과를 건네주던 때처럼. 나는 전당표와 영수증 이야기를 반쯤 했다. 모든 것은 말할 수 없었으므로.

"……그래서 제가 틀렸어요. 보는 건 맞았는데, 꺼내는 방법이 틀렸어요."

"음."

아드리안은 한동안 하늘을 보았다. 눈이 그쳐 가고 있었고, 구름 사이로 별이 몇 개 보였다.

"그냥 평소의 너로 있으면 되잖아."

그가 말했다. 다정한 목소리로.

"예전처럼 아무 말 안 하고. 탠지도 그게 편했을 거야. 네가 이렇게 뭔가 많이 하려고 하면 사람들이 불편해지는 거 아냐?"

나는 대답하지 않았다. 아드리안이 그 말을 악의 없이 했다는 것을 알았다. 그는 나를 위로하고 싶었고, 위로의 방법으로 내가 처음 이 담장에 나타났던 때의 나를 불러 준 것이다. 열 살의 아델라인. 말하지 않아도 틀린 사람이 되지 않던 아이.

하지만 나는 이제 그 아이가 아니었다.

"……그럴 수 있다면 좋겠어요."

나는 조용히 말했다.

"하지만 평소의 내가, 어느새 달라졌어요."

아드리안의 눈이 약간 흔들렸다. 그는 입을 열었다가 닫았다. 우리 사이로 한 줄기 찬바람이 지나갔다. 그가 무엇을 느꼈는지 나는 알 수 있었다. 오랫동안 편하던 자리가 어느새 조금 낯설어졌다는 것. 그리고 그것이 누구의 잘못도 아니라는 것.

"……그래."

그는 겨우 말했다.

"요즘 많이 바빠 보이더라."

"아드리안."

"응."

"……고마워요."

그는 웃었다. 평소의 웃음이었다. 하지만 반 박자 늦었다. 나는 그것을 말하지 않았다. 이 집에서 배운 가장 오래된 예의였다.

---

아침 일찍 나는 탠지의 방 문 앞에 섰다.

두 손에 물동이 두 개를 들고 있었다. 부엌에서 직접 길어 온 것이었다. 각각 반만 채워져 있었다. 노크를 세 번 했다.

"……들어오세요."

탠지는 침대에 앉아 있었다. 눈이 부어 있었다. 나는 물동이를 문 앞에 내려놓고, 아무 말 없이 서 있었다.

"……그거."

"반만 채웠어요."

탠지가 입술을 깨물었다.

"약속이었으니까요."

탠지가 고개를 숙였다. 어깨가 한 번, 두 번 떨렸다. 그리고 아주 작게, 웃음인지 울음인지 알 수 없는 소리가 났다.

"……아가씨는 정말 못됐어요."

"네."

"그런 걸 기억하고 계시다니."

"기억하는 건 잘해요."

한참 뒤에야 탠지가 눈가를 닦으며 말했다.

"저, 사실은 아가씨한테 말하고 싶었어요. 하지만 말하는 순간, 이 집에서 제 자리가 달라질 것 같았어요. '도움이 필요한 사람'이 되는 거잖아요."

"그럼 도움이 아니라 일이면 어때요?"

"……네?"

"저한테는 비서가 필요해요. 편지를 전하고, 사람들 소식을 모으고, 어떤 가문의 하녀가 어떤 말을 했는지 듣고, 누구에게 어떤 인사를 해야 하는지 알려 주는 사람이요. 이 집에서 그걸 가장 잘하는 사람은 한 명뿐이에요."

탠지의 눈이 크게 떠졌다.

"그건 시녀의 일이 아니에요. 정식 직책이고, 정식 급여가 있어요. 한 번도 제가 베푸는 게 아니에요. 탠지가 해 온 일에 이름을 붙이는 것뿐이에요."

"……."

"그리고 빚은 따로 정리해요. 마로트 님께 부탁하면 급여 선지급으로 처리돼요. 매달 월급에서 갚는 방식으로. 정당한 계약이에요."

"저, 글자를 많이 몰라요."

"홀트 선생님이 학생 한 명 더 받겠다고 하셨어요. 이미 말씀드렸어요."

"아가씨!"

"미안해요. 이번에는 먼저 말했어요. 말해도 되는지 허락은 못 받았지만."

탠지가 얼굴을 두 손으로 가렸다. 어깨가 심하게 떨렸다. 한참 지나서 손 사이로 젖은 목소리가 새어 나왔다.

"……그건 억지예요."

"억지가 제일 잘 통할 때가 있다고 탠지가 말했잖아요."

탠지가 웃었다. 울면서 웃었다. 이번 웃음에는 숨겨진 것이 하나도 없었다.

그날 오후, 마로트가 새 계약서를 가져왔다. 탠지가 서명한 서류를 확인하고 정확한 각도로 고개를 숙였다.

"탠지 양. 이번에는 비품 교체가 아닙니다."

"마로트 님!"

"정당한 급여 인상입니다."

탠지는 소리 내어 웃다가, 곧 마로트의 소매를 붙잡고 엉엉 울었다. 마로트는 한 걸음도 물러서지 않고 그대로 서 있었다. 나는 그 어깨가 얼마나 천천히 풀리는지를 보았다.

*—보는 것과 꺼내는 것은 다르다. 허락 없이 꺼낸 것은 사실이어도 폭력이 된다.*
*—탠지는 웃음으로 모든 것을 감추던 사람이 이제는 감추지 않아도 되는 자리를 얻었다.*
*—아드리안은 내가 변했다는 것을 아직 받아들이지 못한다. 그것은 내 잘못도 그의 잘못도 아니다.*`},

{n:23,title:'남쪽의 상단, 동쪽의 탑',season:'여름',text:`그해 여름, 나는 처음으로 저택을 떠나 먼 길을 갔다.

열여섯 살의 여름이었다. 마로트가 장부를 정리해 준 숫자는 냉정했다. 가을이 오기 전에 새로운 수입원이 필요했다. 에드릭은 수도를 떠날 수 없었고, 발트하임 백작의 눈이 우리 집을 지켜보고 있었다. 그래서 그는 나에게 한 가지를 허락했다. 직접 가서 보고, 듣고, 말하는 일.

마차에는 마로트와 탠지, 그리고 짐이 탔다. 마차 문 앞에는 한 소년이 서 있었다.

"서부 기사단에서 파견된 하델 오르포스입니다."

열일곱 살, 어깨가 넓고 갈색 머리를 짧게 자른 소년이었다. 허리에는 장검이 있었고, 눈은 맑았고, 서 있는 자세가 곧아서 마차보다 먼저 그곳에 박힌 말뚝 같았다. 오래전 황궁 다과회의 천막 기둥 옆에서, 아무도 앉으라고 하지 않아서 앉지 않던 소년이었다. 에드릭이 세레나의 편지 사건 이후 서부 기사단장에게 호위를 부탁했고, 그 아들이 직접 나선 것이었다.

"앞으로 보름 동안 아가씨의 호위를 맡습니다. 한 가지 먼저 말씀드리겠습니다."

"……네."

"저는 거짓말을 못 합니다. 그러니 질문은 신중하게 해 주십시오."

그가 진지하게 말해서 나는 웃음을 눌렀다.

"……그럼 몇 살이세요?"

"열일곱 살입니다. 그 질문은 안전합니다."

탠지가 마차 안에서 컥 소리를 냈다. 하델의 귀가 아주 약간 붉어졌다. 나는 그것이 무슨 뜻인지 알았다. 칭찬받지 않았는데도 붉어지는 사람이었다. 정직한 사람은 자기 감정도 감추지 못한다.

"수고하셨습니다."

"……아직 아무것도 안 했습니다."

"그래도요."

그의 귀가 완전히 붉어졌다. 마로트가 마부석에서 헛기침을 했다.

---

남쪽 항구는 짠 바람과 오렌지 냄새로 가득했다.

베르몬트 상단의 본관은 항구가 내려다보이는 언덕에 서 있었다. 흰 석회벽에 푸른 창틀, 마당에는 낙타 한 마리가 졸고 있었다. 접견실에서 우리를 맞은 소년은 책상 위의 주판을 튕기고 있었다. 손가락이 보이지 않을 만큼 빨랐다. 다과회에서 은수저의 무게를 가늠하던 바로 그 소년이었다.

"어서 오십시오, 트로네 영애. 리오넬 베르몬트입니다. 오시는 길에 비용이 얼마나 드셨는지 계산해 봤습니다. 마차 대여가 십이 금화, 숙박이 이 금화 칠 은화. 이 정도면 대화의 값어치를 충분히 쳐 드릴 수 있겠군요."

"인사가 매우 구체적이네요."

"저는 구체적이지 않은 건 신뢰하지 않습니다."

열일곱 살의 리오넬은 입가에 능글맞은 웃음이 붙어 있었고, 눈은 쉬지 않고 움직였다. 내 옷, 내 손, 내 뒤의 마로트와 하델, 탁자 위의 찻잔까지. 모든 것에 가격표를 붙이는 것 같았다.

나는 가져온 가죽 두루마리를 책상 위에 펼쳤다.

"이게 뭡니까?"

"세르반 산맥의 고개 지도예요."

리오넬의 주판이 멈췄다.

"황실 측량국의 지도가 틀렸어요. 여름에만 열리는 고개를 항상 열린 길로 그려서, 상단들이 겨울에 길을 잃었죠. 이 지도는 북부 대공가의 아들이 직접 현장을 걸어 본 증언을 바탕으로 그렸어요. 올해 안에 열리는 기간은 석 달 반이에요."

"북부의 모피가 이 고개를 넘으면……"

"황실 도로의 통행세를 거치지 않고 남쪽 항구까지 닿아요. 북부는 판로가 생기고, 베르몬트 상단은 모피를 가장 먼저 쥐고, 저희 집은 지나가는 길목의 영지로서 통과 수수료를 받는 거예요."

리오넬은 말이 없었다. 주판의 구슬이 하나씩 움직였다. 이마에 땀이 한 방울 맺혔다. 이 방의 숫자를 모두 잊은 사람의 얼굴이었다.

"이 지도는 누가 그렸습니까?"

"친구가요."

"그 친구는 지금 고용 중입니까?"

나는 무심코 웃을 뻔했다.

"……본인에게 물어보셔야 해요."

"반드시 그러겠습니다."

그는 일어나 한참 방 안을 걸었다. 그러다 갑자기 멈췄다.

"조건을 말씀드리지요. 삼 년 계약, 통행 수수료는 육 대 사. 트로네 가가 육입니다."

"오 대 오예요."

"그건 불가능합니다."

"북부 대공가의 서명이 이미 있어요. 그 서명이 없는 계약서는 지도 없이 가는 겨울 길과 같아요."

"……."

리오넬은 입을 벌렸다 닫았다. 그의 시선이 마로트를 향했고, 마로트는 눈을 내렸다. 그는 천천히 의자에 앉았다.

"오 대 오로 하죠."

"감사합니다."

"……이런 협상은 처음입니다. 보통은 제가 이깁니다."

"이번엔 계산이 아니라 길이 달랐으니까요."

리오넬이 처음으로 진심으로 웃었다. 웃음이 얼굴 전체에 닿는 것을 나는 보았다.

계약서에 서명하고 돌아가려는데, 나는 가방에서 작은 유리병을 하나 꺼냈다. 마르타 아주머니가 만든 설탕 호두였다.

"이건 선물이에요. 여기까지 오는 동안 맛있어서."

리오넬이 병을 받아 든 채 굳었다.

"……선물."

"네."

"이걸 갚아야 합니다."

"갚지 않아도 돼요."

"그럼 저는 빚진 사람이군요."

"선물이라고 했는데요."

그의 얼굴에 당황이 번졌다. 곧 서랍을 열고 은으로 만든 만년필을 꺼냈다. 한눈에 비싼 물건이었다.

"이것으로 정산하겠습니다."

"그건 너무 비싸요."

"그럼 호두병에 대한 이자까지 포함된 겁니다."

"리오넬 님."

"네."

"그 단어가 거래 장부에 없다고 해서 존재하지 않는 건 아니에요."

"어떤 단어입니까."

"친구요."

리오넬은 입을 반쯤 벌린 채 한참 움직이지 않았다. 마치 처음 듣는 외국어를 해독하는 사람처럼. 그의 귀 끝이 아주 약간 붉어졌다. 이 소년도 숨기는 데 서툴렀다. 다만 숨기는 방법이 다를 뿐이었다.

"……그건 검토해 보겠습니다."

"천천히요."

---

동쪽 마탑은 구름 아래에서 시작해서 구름 위에서 끝났다.

계단이 칠백 개였다. 탠지는 사백 번째 계단에서 포기했고, 하델은 탠지를 업는 대신 가방을 들었다. 마로트는 한 번도 숨을 가쁘게 쉬지 않았다. 꼭대기 서고에서 우리를 맞은 소년은 책 더미 사이에서 고개를 내밀었다. 다과회 식탁 밑에서 책장을 넘기던 그 소년이었다.

"어, 벌써 오셨어요? 오늘이 그날이었나요? 제가 시간을 몇 번 착각해서……"

"세바스티안 루이 님이시죠."

"네, 맞아요. 아, 앉으세요, 아니, 그 의자에는 책이 있으니까 저쪽 의자에. 아니, 그것도 책이 있네요. 일단 서 있으시는 게 편하실 수도……"

열여섯 살의 세바스티안은 안경이 코끝에 걸린 채, 말을 하면서 동시에 세 가지를 하고 있었다. 책을 치우고, 안경을 올리고, 차 주전자에 물을 올렸다. 한 가지도 끝내지 못했다. 그가 마침내 우리를 앉히기까지 이십 분이 걸렸다.

"저희 아버지 이야기를 찾고 있어요."

내가 말했다.

"에버하트 기록관이요. 팔 년 전에요."

세바스티안의 손이 멈췄다. 그는 한참 나를 보더니 조용히 일어나 서가 안쪽으로 걸어갔다. 한참 뒤에 두꺼운 목록 한 권을 가져왔다.

"이건 열람 금지 목록이에요."

"네."

"제가 허락 없이 보여 드리면 큰일이 나요."

"알아요."

"하지만 아가씨 이름이 나오는 줄이 있어요. 아니, 아가씨 이름은 아니에요. 정확히는 아가씨가 성인이 되시면 열람 권한이 생긴다는 줄이에요."

그가 목록의 한 장을 펼쳐 내게 보여 주었다. 손가락이 가리키는 곳에 이렇게 적혀 있었다.

*임시 보관. 에버하트 기록관 위탁. 보관 만기 십팔 년. 열람 권한자: 성인이 된 직계 후손.*

나는 그 줄을 오래 읽었다. 열여덟 살. 아버지의 편지 조각이 말한 "동쪽의 책들 사이"가 여기였다. 선황의 후계 문서의 사본이 이 탑에, 아버지가 위탁한 채로, 나를 기다리고 있었다.

"……지금은 볼 수 없는 거죠."

"네. 아직은요. 제 권한으로는 목록 번호까지만 알려 드릴 수 있어요. 그건 정보가 아니라 번호니까요."

그가 말하면서 눈을 피했다. 나는 그것이 규칙을 지키기 위한 선인지, 규칙 뒤에 숨기 위한 선인지 알 수 없었다. 아마 그 자신도 몰랐을 것이다.

"세바스티안 님은 열람 금지 목록을 어길 수 있는 분이에요?"

"……어길 수는 있지만요. 그러면 제가 이 탑에서 쫓겨나요. 그리고 어떤 위험한 문서는, 아직 읽을 때가 아닌 사람에게는 위험해요. 그러니까 이 년만 기다리시면……"

"알겠어요."

"아가씨는 화나지 않으세요?"

"세바스티안 님은 책을 사랑하는 사람이라서요. 책을 지키는 사람의 규칙을 존중해요."

그가 잠시 입을 벌렸다가, 안경을 고쳐 썼다. 한 번 더 고쳐 썼다.

"……저는 가끔 지식이 곧 안전이라고 믿어요. 읽지 않으면 위험하지 않다고. 그런데 아가씨를 보면, 그것이 아닐 수도 있다는 생각이 들어요."

"천천히 생각하셔도 돼요."

"네. 천천히 생각하는 건 잘해요."

그날 밤 우리는 탑의 천문대에서 별을 보았다. 세바스티안은 별자리 이름을 쉬지 않고 말했고, 탠지는 세 번째 별에서 졸기 시작했고, 하델은 계단 어귀에서 뒷모습을 보인 채 말없이 서 있었다. 나는 별 하나에 아버지의 이름을 붙여 보았다. 이름은 곧 구름에 가려졌다.

돌아오는 길, 마차 바퀴 소리 사이로 하델이 낮게 말했다.

"아가씨. 뒤따르는 마차가 있습니다."

나는 몸을 일으켰다. 마로트가 창밖을 확인했고, 하델이 설명을 이었다.

"사흘 전부터 일정한 간격으로 따라붙었습니다. 문장은 가렸지만 말이 발트하임 영지의 종자입니다."

"……어떻게 아세요?"

"서부 기사는 말 걸음걸이를 보고 마구간을 압니다."

"위험한가요?"

"지금은 아닙니다. 하지만 아가씨가 위험해진다면, 제가 앞에 서겠습니다."

그는 잠깐 말을 멈췄다. 목소리가 평소보다 조금 낮아졌다.

"이건 명령이 아니라, 제가 정한 일입니다."

나는 대답하지 못했다. 마차 안은 조용했고, 바퀴 소리만 일정하게 이어졌다. 탠지가 자는 척하며 눈을 가늘게 뜨고 나를 훔쳐보고 있다는 것을 알았지만, 모른 척했다.

*—남쪽은 계산으로 사람을 읽고, 동쪽은 지식으로 세상을 읽고, 서쪽은 마음으로 사람을 읽는다.*
*—아버지의 사본은 동쪽 탑에 있다. 열여덟 살에 열람할 수 있다.*
*—발트하임의 눈이 뒤따른다. 그러나 이제 나는 혼자가 아니다.*`},

{n:24,title:'공작의 고백 아닌 고백',season:'겨울',text:`열일곱 번째 생일 저녁, 나는 서재 문을 두드렸다.

세 번. 평소와 같았다. "들어와라"라는 소리가 문이 열리기도 전에 왔고, 나는 문을 열었다. 에드릭은 책상 앞에 앉아 있었다. 평소와 같은 검은 옷, 같은 자세. 하지만 책상 위에는 펼쳐진 책이 없었다. 지도도 없었다. 그의 손은 책상 위에 가만히 놓여 있었다.

"앉아라."

"……네."

"아니, 거기가 아니다. 이쪽이다."

그가 큰 책상 앞 의자를 가리켰다. 내 작은 책상이 아닌, 그의 맞은편. 나는 처음으로 그 자리에 앉았다. 책상 위의 촛불이 서로의 얼굴 사이에서 흔들렸다.

한참 아무도 말하지 않았다. 나는 한 가지를 결심하고 입을 열었다.

"공작님께 말씀드릴 것이 있어요."

"……말해라."

"지난 이 년 동안 저는 두 번, 말하지 않은 것을 가졌어요."

그의 눈썹이 아주 약간 올라갔다.

"서재의 책 사이에서 편지 조각을 발견했어요. 별자리 도감에서 하나, 지리지에서 하나. 읽었어요. 허락 없이요. 그리고 말씀드리지 않았어요."

나는 가슴 주머니에서 작은 종이를 꺼내 책상 위에 올려놓았다. 내가 옮겨 적은 두 문장이었다. 필체가 떨려서 오래된 종이처럼 보였다.

*아이에게는 말하지 마시오. 말하지 않는 것이 지키는 것이오. 그러나 아이가 스스로 알아차린다면*

*문서는 그날 밤 사본으로 옮겨 두었소. 동쪽의 책들 사이에. 나머지는*

에드릭은 종이를 보았다. 그리고 천천히, 아주 오래, 눈을 감았다. 그가 눈을 떴을 때 얼굴에는 내가 처음 보는 표정이 있었다. 화도, 놀람도 아닌, 오래 기다리던 사람의 얼굴이었다.

"알고 있었다."

"……네?"

"책갈피로 꽂아 둔 것은 나다."

나는 잠깐 말을 잃었다.

"네가 첫 번째 조각을 읽은 날, 책을 같은 각도로 되돌려 놓는 것도 보았다. 나는 지도를 보는 척하고 있었다. 그것이 내가 한 첫 거짓말이다. 보지 않은 척한."

"……왜요?"

"말하는 것이 내게는 너무 어려웠다."

그는 한 번 숨을 삼켰다. 책상 위의 손가락이 아주 조금 움직였다.

"네 아버지는 '말하지 말라'고 썼다. 하지만 이어지는 문장이 있다. 나는 그것을 오랫동안 읽었다."

그가 서랍을 열었다. 큰 책상의 서랍이었다. 안에서 접힌 종이 한 장을 꺼내 내 앞에 놓았다. 찢겨 나간 가장자리가 내가 가진 첫 번째 조각의 가장자리와 정확히 맞았다. 나는 두 조각을 맞대어 보았다. 이어지는 문장이 천천히 눈에 들어왔다.

*…그러나 아이가 스스로 알아차린다면, 그때는 숨기지 마시오. 그 아이는 이미 알 자격이 있는 것이오.*

나는 한동안 글자를 읽을 수 없었다. 시야가 흐려졌다.

"이 문장을 오랫동안 읽었다. 네가 알아차릴 때를 기다렸다. 네가 알아차리지 못하면 말하지 않으려고. 네가 알아차리면, 그때는 말하려고."

"……."

"그러니 지금 말하겠다. 전부는 아니다. 전부를 말하기에는 아직 때가 아니다. 하지만 일부는."

그의 목소리는 낮고 평탄했다. 이 이야기를 몇 번이나 머릿속에서 연습한 사람의 목소리였다.

"네가 이 집에 오기 팔 년 전, 네 아버지는 황실 문서고에서 선황의 후계 문서를 정리하다가 이상한 것을 발견했다. 문서가 훗날 고쳐졌다는 증거였다. 그는 나를 찾아왔다. 나는 그때 근위 지휘관이었다."

숨이 멎었다.

"나는 그에게 말했다. '시기가 아니다.' 지금 터지면 나라가 갈라진다. 선황의 후계는 이미 정리되었고, 황실은 이제 겨우 안정을 찾았으니, 이 증거가 풀리면 수많은 사람이 죽을 것이다. 나는 그에게 침묵을 청했다."

"……."

"그는 약속을 지켰다. 사본만 안전한 곳에 옮겨 두고, 오랜 세월 입을 다물었다. 그리고 죽었다."

나는 눈을 크게 떴다.

"사고였다고 한다."

그 마지막 말은 이상했다. 사고였다고 하는 것이 아니라, 그렇게 한다고 하는 것처럼 들렸다. 나는 그것을 되묻지 않았다. 에드릭의 어깨가 아주 약간 내려앉았다. 이 이야기를 말한 사람이 아니라, 오랫동안 이야기를 지고 온 사람의 어깨였다.

"나는 그날 이후로 불을 끄지 못했다."

그가 말했다.

"내가 청한 침묵이 그를 죽였다고 생각했으니까. 그리고 네가 오기까지 팔 년 동안, 이 집은 그것을 갚는 방식으로만 존재했다. 문서를 지키고, 침묵을 지키고, 불을 켜 두고."

"공작님."

"……내가 너를 데려온 이유가, 약속 때문만이 아니라는 것은 말해 두겠다."

나는 숨을 삼켰다. 오래전 집사실에서 내가 쓴 문장이 머릿속을 스쳤다. 상자 때문에 선택된 것일지도 모른다.

"네 아버지의 부탁이 먼저였다. 그러나 너를 이 집에 데려오기로 한 것은 내 결정이었다. 서류에 서명한 것은 네 아버지의 부탁이 아니라 내 손이었다. 나는 그것을 책임이라 부르지 않는다."

그는 내 눈을 똑바로 보았다.

"……네가 이 집에 와서 첫 번째로 한 일은, 이 방 앞에 찻잔을 두고 간 것이었다. 설탕 없이."

나는 입술을 깨물었다.

"그 잔들은 아직 있다. 열한 개가 아니라, 이제 이백 개가 넘는다. 한 번도 버리지 못했다."

눈물이 책상 위로 떨어졌다. 나는 닦지 않았다. 에드릭은 한참 가만히 있다가, 서랍 속에서 작은 열쇠를 꺼냈다. 호두나무 상자의 열쇠였다. 가장자리가 둥글고 위쪽이 휘어진, 특이한 모양.

"이 열쇠는 네 열여덟 번째 생일에 주겠다. 내가 정한 날이 아니다. 네 아버지가 정한 날이다."

"……그날 상자와 서랍이 열려요."

"그렇다."

"그리고 동쪽 탑의 사본도요."

"그렇다."

에드릭은 열쇠를 도로 서랍에 넣고 닫았다. 닫는 소리가 크지 않았지만, 방 전체가 한 번 울렸다.

"한 가지 더, 네 아버지의 세 번째 조각은 이것이다."

그가 마지막으로 접힌 종이를 건넸다. 아주 작은 조각이었다. 한 줄이었다.

*열여덟이 되면, 그때는 선택하게 하시오.*

나는 그 문장을 손끝으로 쓸었다. 그것은 아버지가 나에게 남긴 첫 번째 질문이었다. 내가 열여덟이 되었을 때 무엇을 열 것인지, 열지 않을 것인지, 누구와 열 것인지. 아버지는 그 선택을 나에게 맡겼다.

"……고맙습니다, 공작님."

"……."

"말씀해 주셔서요."

에드릭은 대답하지 않았다. 그저 오랫동안 나를 보았다. 그의 눈 속에는 내가 알아볼 수 있는 모든 것이 한꺼번에 있었다. 죄책감과 안도와, 이 방에서 오랫동안 한 번도 켜지 않은 무언가가.

"……춥다."

그가 말했다.

"창가에 앉아라. 불이 더 가깝다."

그것은 외투를 입으라는 말이 아니었다. 하지만 곧 그런 말이 될 것이라는 것을 나는 알았다.

*—아버지는 사고로 돌아가셨다고 한다. 공작님은 "한다"고 말했다.*
*—열여덟에 열쇠를 받는다. 그날 나는 선택해야 한다.*
*—공작님은 서재에서 이백 개가 넘는 찻잔을 한 번도 버리지 못했다.*`},

{n:25,title:'17세의 봄, 선택의 편지',season:'봄',text:`봄이 되자 편지가 쏟아졌다.

처음에는 한 통이었다. 다음에는 세 통, 이어서 열 통. 마로트는 아침마다 은쟁반에 편지를 쌓아 서재 책상으로 가져왔고, 나는 오래 기다리지 않아도 알 수 있었다. 사람들이 열여덟 번째 생일이 다가오는 것을 센 것이다.

저녁에 나는 서재 바닥에 편지를 한 장씩 펼쳐 놓았다. 홀트 선생이 곁에서 안경을 고쳐 쓰며 내려다보았다.

"선택의 문제는, 무엇을 말하고 무엇을 덮을지의 문제입니다."

"네."

"그리고 누구에게 말하고 누구에게는 말하지 않을지의 문제이기도 하지요."

"네."

첫 번째 편지는 북부 대공의 것이었다. 필체가 크고 거칠었다. *아델라인 양. 올겨울 북부 의회에 참관인으로 와 주기 바라네. 에드릭의 딸이자 에버하트의 딸로서. 북부는 자네 편이네.* 그것은 초대이면서 동시에 선언이었다. 북부의 편에 선 영애가 된다는 것.

두 번째 편지는 황궁의 인장이 찍혀 있었다. 율리안의 필체였다. *폐하께서 열여덟 번째 생일 전에 사적인 알현을 원하십니다. 저는 어느 쪽이 맞는 선택인지 말해 줄 수 없어요. 다만, 오시게 되면 제가 문 앞에 서 있겠습니다.*

세 번째 편지는 흰 봉투였다. 인장은 발트하임 백작가. 발신인은 백작이었고, 문장은 정중하고 부드러웠다. *성인식을 앞두고 양가의 화합을 위해 한 번 조용히 대화를 나누고 싶습니다.* 정중한 말투 뒤에 날카로운 가시가 있다는 것을 알았다. 대화의 조건은 적혀 있지 않았다. 적을 필요가 없다는 듯이.

네 번째는 하얀 리본만 매어진 카드였다. *제 어머니가 저를 황실 무도회에 보내려 합니다. 저는 가지 않을 방법을 찾고 있습니다. 도와주실 수 있습니까? 세레나.* 마지막 줄 아래에 작게 적혀 있었다. *이건 부탁이지, 빚이 아닙니다.*

리오넬의 편지는 계산서 같았다. 아니, 계산서였다. 항목은 하나. *유리병 속 호두 한 병, 가치 미정, 정산 불가.* 그 아래에 작게. *친구 항목을 새로 만들었습니다.*

세바스티안의 편지는 번호 하나였다. 목록 번호. 그리고 그 아래에 열두 줄의 사과문이었다. 마지막 줄은 이랬다. *생각해 보았는데, 읽지 않는 것이 항상 안전한 것은 아닌 것 같습니다.*

하델의 편지는 네 줄이었다. *필요하면 부르십시오. 달려가겠습니다. 거짓말은 못 하니까 사실입니다. 날씨가 좋습니다.* 마지막 줄이 나를 웃게 했다.

카일런의 편지는 날씨 보고로 시작했다. *북부는 아직 눈이 쌓여 있다. 고개가 열리려면 두 달 반이 남았다. 그 길은 네 지도 덕분에 올해 비로소 쓸모가 있게 되었다.* 그리고 마지막에. *어떤 선택을 하든 나는 틀렸다고 말하지 않을 것이다. 맞다고도 말하지 않겠다. 다만 네 편지를 기다리겠다.*

로잘리의 편지는 열두 장이었다. 읽는 데 반 시간이 걸렸고, 그중 실제 정보는 세 줄이었다. *누가 무슨 소문을 퍼뜨리는지 알아냈어요. 이번엔 사실이에요. 발트하임 백작이 사람들을 모으고 있어요.*

그리고 마지막 편지가 있었다.

아드리안의 글씨였다. 평소보다 한 줄이 짧았다.

---

나는 그 편지를 들고 과수원으로 갔다.

봄밤이었다. 사과나무에 하얀 꽃이 피어 있었고, 달빛이 꽃잎 위로 내려앉았다. 돌담에는 등불이 걸려 있었고, 아드리안이 거기 앉아 있었다. 열여덟 살의 그는 이제 소년이 아니었다. 모래빛 머리카락이 가라앉았고, 눈이 훨씬 차분해졌다.

"읽었어?"

"네."

"그럼 말 안 해도 되겠네."

"아카데미 합격이요."

"응. 수도 제국 측량 아카데미. 가을에 가."

나는 편지를 가슴에 쥐었다. 그가 마침내 자기가 하고 싶은 것을 찾았다. 책을 읽으며, 땅바닥에 산맥을 그리며, 오래 헤매던 사람이 마침내 방향을 알게 된 것이다. 나는 기뻐야 했다. 정말로 기뻤다. 그런데 가슴 한쪽이 이상하게 비었다.

"……축하해요."

"고마워."

"정말요. 저는 알고 있었어요. 아드리안이 뭔가 될 사람이라는 거."

"그건 네가 처음부터 해 준 말이었지. 담 위에서."

그가 웃었다. 이번에는 반 박자 늦지 않았다.

"나는 항상 네가 변하는 게 무서웠어. 네가 달라지면 내가 놓고 가는 사람이 될까 봐. 그런데 어느 날 알았어. 네가 변하는 게 아니라, 내가 안 변하고 있었다는 걸."

"……."

"그래서 가기로 했어. 이번에는 내가 먼저."

나는 말없이 앉아 있었다. 눈앞의 사과꽃이 천천히 흔들렸다. 오래전 이 담 위에서 한 소년이 낯선 아이에게 차를 건네받던 때가 떠올랐다.

"한 가지만 물어봐도 돼?"

"네."

"내가 갔다가 돌아오면, 그때도 이 담 위에 앉아 있어도 돼?"

"……담은 항상 거기 있어요."

"그게 대답이야?"

"이 집에서는 가장 정확한 대답이에요."

아드리안이 소리 내어 웃었다. 오래 걸린 웃음이었다. 그는 담에서 내려와 내 옆에 앉았다. 오래전 겨울 사과를 건네던 그때처럼. 하지만 이번에는 사과가 아닌 것을 내밀었다. 잉크병이었다. 작은 유리병에 담긴 푸른 먹물.

"내가 만든 거야. 다음 편지는 이걸로 써."

"……받을게요."

"선물이야. 갚지 마. 리오넬한테 들었어. 선물을 갚으면 안 되는 거라며."

"거기까지 소문이 났어요?"

"로잘리가 말했어."

우리는 둘 다 웃었다. 사과꽃이 밤바람에 흩날렸다.

---

그날 밤, 나는 서재로 올라갔다.

문은 열려 있었다. 에드릭은 책상 앞에 앉아 있었고, 나는 처음으로 노크 없이 들어갔다. 그가 눈을 들었다. 책상 위에는 내가 쌓아 둔 편지들이 모두 정리되어 있었다.

"읽었다."

"……네."

"네가 정하는 것을 따르겠다."

"……."

"어느 편에 설지는 네가 정해라. 나는 그것을 막지 않을 것이다. 다만 어느 쪽을 택하든 이 집은 너를 위해 문을 열어 둔다."

나는 책상 앞에 서서 한참 생각했다. 그리고 천천히 가방에서 종이를 꺼냈다. 아드리안의 푸른 먹물로 쓴, 방금 완성한 한 장.

"이건 모든 분께 보낼 편지예요."

"……읽어 봐도 되나."

나는 종이를 건넸다. 에드릭이 천천히 읽었다. 그의 눈이 한 줄, 한 줄 내려갔다. 마지막 줄에 이르렀을 때 손이 아주 조금 멈췄다.

*저는 어느 쪽의 방패도, 어느 쪽의 칼도 아닙니다. 아버지의 이름으로, 열여덟 번째 생일 무도회에서 문을 열겠습니다. 그날 모두 오십시오. 그리고 그날 저는 처음으로, 많은 분 앞에서 말하겠습니다.*

"……초대장이로군."

"네."

"모든 이에게."

"북부와 황실과 발트하임과 남쪽과 동쪽과 서쪽, 모두에게요. 어느 한쪽에도 기대지 않고, 모두의 앞에서 한 번에 말하려고요. 비밀은 한 사람에게만 보여 주면 거래가 되지만, 모두에게 보이면 이야기가 되니까요."

"그날 무엇을 말할 생각이냐."

"아직 몰라요."

나는 솔직하게 말했다.

"하지만 말하는 사람이 저여야 한다는 것은 알아요."

에드릭은 편지를 천천히 접어 책상 위에 올려놓았다. 한참 말이 없었다. 창밖에서 봄바람이 커튼을 한 번 흔들었다.

"……준비하겠다."

그가 말했다.

"무도회장도, 자리 배치도, 초대 명단도. 마로트에게 일러 두겠다."

"감사합니다."

"그리고."

그가 입가를 아주 조금 올렸다. 웃음이라고 부르기에는 작았지만, 이 방에서 오랫동안 한 번도 켜지 않은 불빛 같았다.

"드레스는 네가 고르거라. 탠지가 이미 열두 벌을 가져다 놓았다고 들었다."

"……열두 벌이요?"

"마로트가 막지 못했다."

나는 웃었다. 소리 내어, 오래, 서재가 울릴 만큼. 에드릭의 어깨가 조금 흔들렸다. 처음 들어 보는, 아주 낮고 짧은 소리였다. 그것이 웃음이라는 것을 나는 한참 뒤에야 알았다.

*—나는 편지를 열 통 받고 한 통으로 답했다.*
*—선택은 어느 편에 서느냐가 아니라, 어디에 서서 말하느냐였다.*
*—열여덟 살까지 여덟 달. 이제 준비한다. 말할 것과 덮을 것을, 그리고 지킬 사람들을.*`}

,
{n:26,title:'성인식 준비',season:'여름',text:`초대장은 일흔두 통이었다.

마로트는 그것을 하루 만에 보냈고, 사흘 만에 일흔한 통의 답장을 받았다. 한 통이 오지 않았는데, 그것이 누구의 것인지는 굳이 말할 필요가 없었다. 마로트는 서재 옆 작은 방을 비우고 거기에 전지만 한 좌석표를 붙였다. 벽에는 붉은 핀과 푸른 핀이 꽂혔고, 그 방은 곧 저택 사람들이 '작전실'이라고 부르게 되었다.

"북부 대공 각하와 발트하임 백작은 같은 홀에 계셔도 되지만, 같은 시야에 계셔서는 안 됩니다."

마로트가 지휘봉 대신 은 연필로 좌석표를 짚었다.

"황실 사절단은 상석에 앉아야 하는데, 북부 대공 각하는 황실 사절보다 낮은 자리를 받으면 모욕으로 받아들이십니다. 그러나 황실 사절보다 높은 자리에 앉으시면 황실이 모욕을 받습니다. 베르몬트 상단의 후계는 채권자 두 분의 곁에 앉기를 거부했고, 동쪽 마탑의 후계는 어느 자리든 책이 있다면 좋다는 답을 보냈습니다."

"서쪽 기사단은요?"

"앉지 않겠다는 답이 왔습니다. 벽에 서 있겠다고요."

"……하델 님이죠."

"네. 그리고 이쪽이."

그가 가장 큰 붉은 핀을 가리켰다.

"가장 큰 문제입니다. 모든 가문이 서로 다른 이유로 서로의 곁에 앉고 싶어 하지 않습니다."

방 안에는 나와 마로트 외에 두 사람이 더 있었다. 로잘리가 탁자 위에 발을 올리고 앉아 있었고, 세레나가 팔짱을 낀 채 좌석표를 무섭게 쏘아보고 있었다. 세레나는 어머니 몰래 이따금 우리 집을 드나들었다. 그녀는 그것을 "처음으로 하는 외출"이라고 불렀다.

"제가 말해 드릴까요? 소문이 아니라 사실만요."

로잘리가 손을 들었다.

"사실은 재미가 없어서 말하기 싫은데, 말할게요. 북부 대공님은 발트하임 백작님을 싫어하는 게 아니라 무서워하세요. 십오 년 전 일 때문에요. 백작님도 대공님을 무서워하세요. 같은 이유로요. 서로 무서워서 싸우는 거예요."

"……그건 사실이에요?"

"어머니가 그러셨어요. 어머니가 하신 말은 틀린 적이 한 번도 없어요. 그래서 제가 어머니를 닮은 게 싫었는데."

세레나가 로잘리를 보았다. 한 번, 짧게. 이 둘은 이제 서로를 나쁜 사람이라고 생각하지 않았다.

나는 좌석표를 한참 보았다. 상석, 차석, 말석. 이 방의 모든 갈등은 높낮이에서 왔다. 누가 누구보다 위에 앉느냐. 그리고 위아래를 정하는 한, 누군가는 반드시 모욕을 느낀다.

"상석을 없애면 안 될까요?"

"……네?"

"긴 식탁을 치우고요. 둥근 탁자 여덟 개를 홀에 흩어 놓는 거예요. 한 탁자에 북부, 황실, 발트하임, 남쪽, 동쪽 사람이 섞여 앉고요. 탁자는 모두 같은 크기로. 위도 아래도 없게요."

마로트의 은 연필이 멈췄다.

"……한 탁자에서 서로의 얼굴을 보면, 싸우기 어렵습니다."

"식사 중에는 칼을 올리지 않으니까요."

"은식기를 한 벌씩 줄이면 더 안전하겠습니다."

"그건 농담이죠, 마로트 님?"

"집사는 농담하지 않습니다."

세레나가 소리 내어 웃었다. 로잘리가 탁자에서 발을 내렸다. 마로트는 좌석표를 떼어 새 종이를 붙이기 시작했다. 아주 오랜만에 그의 입가에 숨길 수 없는 웃음이 걸렸다.

---

탠지는 드레스를 열두 벌 가져왔다.

방 한가운데에 열두 벌이 줄지어 걸렸고, 탠지는 그 앞에서 두 팔을 벌리고 서 있었다. 장미색, 상아색, 은빛, 연보라. 한 벌 한 벌이 눈부셨다.

"어떤 게 마음에 드세요? 저는 은빛이 제일 아가씨 같은데 마르타 아주머니는 장미색이 좋대요! 쌍둥이 자매는 서로 다른 걸 골랐고요!"

"……이 중에는 없어요."

탠지가 눈을 크게 떴다.

"없어요? 열두 벌인데요?"

"저는 조금 더 조용한 걸 입고 싶어요."

그때 문이 열리고 마로트가 상자 하나를 들고 들어왔다. 평소처럼 정확한 걸음이었다.

"열세 번째입니다. 장부에는 '비품 추가'로 적혀 있습니다."

"마로트 님!"

상자를 열자 짙은 푸른색 드레스가 나왔다. 화려하지 않았다. 장식도 최소한이었다. 다만 소매 끝에, 작고 가는 회색 실로 놓인 자수가 있었다. 직사각형의 노트 모양, 촘촘한 줄. 나는 그것을 오래 보았다. 파란 가죽 지도책과 회색 노트. 이 집에서 내게 주어진 두 가지 색.

"색은 누가 정하셨어요?"

"각하께서 정하셨습니다."

마로트는 대답하고 나서 한 박자 쉬었다.

"……그리고 소매 자수는, 각하께서 직접 그림을 그려 주셨습니다. 세 번 고치셨습니다."

탠지가 입을 막고 소리 없이 비명을 질렀다. 나는 소매의 작은 노트를 손끝으로 쓸었다. 선이 미세하게 흔들려 있었다. 서툰 손이 정성을 들여 그린 선이었다.

"……이걸로 할게요."

"열두 벌은요!"

"전부 로잘리와 세레나에게 빌려줄게요."

탠지는 잠깐 낙담했다가 곧 열두 벌의 드레스를 끌어안고 방 밖으로 뛰어나갔다. 복도 저쪽에서 로잘리의 환호가 들렸다.

---

그날 밤 늦게, 홀은 비어 있었다.

의자와 탁자가 아직 들어오지 않아 샹들리에 아래 대리석이 넓게 빛나고 있었다. 나는 서재에서 불려 내려왔고, 홀 한가운데에 에드릭이 혼자 서 있었다. 평소처럼 검은 옷, 평소처럼 곧은 등. 다만 손이 어색하게 허공에 떠 있었다.

"……무엇을 하고 계세요?"

"연습한다."

"무엇을요?"

"……춤이다."

나는 숨을 삼켰다. 무도회의 첫 곡은 성인식을 맞이하는 영애가 보호자와 추는 춤이었다. 에드릭은 십오 년 가까이 어떤 무도회에서도 춤을 춘 적이 없었다.

"홀트 선생님께서 가르쳐 주셨다. 세 시간 동안. 선생은 더 이상 가르칠 것이 없다고 하셨다."

"그건 잘한다는 뜻이 아니겠죠."

"……아니다."

나는 웃음을 참으며 그의 앞으로 걸어갔다. 한 손을 내밀었다. 그가 그 손을 잡았다. 손바닥이 놀랄 만큼 차가웠다. 그리고 땀에 젖어 있었다. 이 사람은 긴장하고 있었다. 오랜 세월 어떤 협박에도 얼굴이 변하지 않았던 사람이, 딸과 한 곡 추는 일 앞에서.

"하나, 둘, 셋."

"……하나, 둘."

"셋이에요."

"……셋."

발이 밟혔다. 한 번, 두 번. 에드릭은 매번 얼굴이 굳었다. 세 번째에 나는 소리 내어 웃고 말았다.

"웃지 마라."

"죄송해요."

"……사과하지 마라."

"그럼 안 할게요."

우리는 달빛이 내리는 홀을 천천히 돌았다. 처음에는 서툴렀다. 그의 걸음은 지나치게 곧았고, 내 걸음은 그에게 맞추려다 조금 늦었다. 하지만 열 바퀴를 돌 즈음, 그의 어깨가 조금 풀렸다. 열다섯 바퀴쯤에서 발이 더 이상 밟히지 않았다.

"내일은……"

그가 낮게 말했다.

"틀려도 된다. 사람들이 보는 것은 내 걸음이 아니라, 네 얼굴일 테니."

"공작님은 걸음도 보이세요."

"……그렇다면 잘 틀려라."

"그건 뭐예요?"

"모르겠다. 지금 생각했다."

나는 웃었다. 그도 아주 낮게 웃었다. 그것은 이제 이 집에서 들을 수 있는 소리가 되어 있었다. 샹들리에의 유리 조각이 달빛을 받아 흔들렸다. 우리 사이로 조용히 음악이 흘렀다. 아무도 연주하지 않는 음악이.

*—열여덟 살이 되기 하루 전이다.*
*—공작님은 한 번도 춤을 춘 적이 없다. 오늘 열다섯 바퀴를 나와 돌았다.*
*—내일 나는 모든 것을 말한다. 그 전에 이 밤이 있다는 것이 고맙다.*`},

{n:27,title:'무도회 전야',season:'여름',text:`무도회 전날은 아침부터 사람들이 도착했다.

가장 먼저 온 것은 로잘리의 짐이었다. 트렁크가 네 개, 모자 상자가 여섯 개, 그리고 정체를 알 수 없는 길쭉한 포장 하나. 그다음에 로잘리 본인이 현관으로 굴러 들어왔다. 얼굴이 환했다.

"아델라인! 안 자고 기다렸어요?! 아니, 안 자고 기다렸으면 좋겠다는 뜻이에요!"

"이제 막 아침이에요."

"그럼 제 말이 맞았네요!"

그녀가 포장을 풀었다. 안에서 나온 것은 짧은 목판 몇 장을 이어 붙인 작은 현판이었다. *사실만 말하는 사람, 로잘리 클레어몬트. 소문은 접수하지 않습니다.* 나는 그것을 오래 보았다.

"……이건?"

"제 앞으로의 일이에요! 지난달에 신문을 하나 내기로 했어요! 사실만 쓰는 소식지요! 첫 호는 아델라인의 무도회 보도로 하려고요. 사전 취재는 어때요, 괜찮으세요?"

"……사실만 쓰시는 거죠?"

"네! 틀리면 다음 호에 사과문을 낼 거예요! 사과문은 일 면에!"

나는 웃으면서 고개를 끄덕였다. 소문의 계절에 나를 지워 가던 사람이 이제 사실만 쓰는 신문을 낸다. 사람은 이렇게 변하기도 한다.

오후에는 세레나의 마차가 왔다. 마차 대신 짐수레였다. 그녀는 트렁크 하나만 들고 현관 앞에 서 있었다. 하얀 리본이 가방 손잡이에 매어져 있었다.

"어머니께서 오늘 아침에 말씀하셨어요. 내일 황실 무도회에서 저를 황태자 전하께 소개하겠다고."

"……."

"저는 안 가겠다고 했어요. 정식으로요. 어머니는 소리를 지르셨고, 저는 짐을 쌌어요."

"그럼 지금……"

"이 집의 손님이에요. 내일 저는 발트하임 영애가 아니라, 트로네 가의 초대 손님으로 입장해요."

세레나의 입꼬리가 올라갔다. 이번 웃음에는 훈련도 규칙도 없었다. 그냥 웃는 사람의 웃음이었다.

그리고 저녁이 되기 전에 북부의 마차가 도착했다.

카일런은 마차에서 내려 한 번 하늘을 올려다보더니, 현관 앞에 서 있는 한 사람을 발견했다. 하델이었다. 그는 이미 이틀 전부터 저택에 와 있었다. 두 사람은 아무 말 없이 서로를 보았다. 하델은 직립 자세였고, 카일런은 턱을 아주 약간 들었다. 정적이 길어졌다.

"……북부의 도련님이십니까."

"……서부의 기사."

"네."

"네."

그것으로 대화가 끝났다. 두 사람이 서로 한 번 고개를 끄덕이고 각자의 자리로 갔다는 것을 탠지가 나중에 흥분한 목소리로 전해 주었다. "세상에서 제일 짧은데 제일 긴 대화였어요!"

해가 지기 전, 담 쪽에서 낯익은 소리가 났다.

돌 위로 올라서는 발소리. 누군가 담 위에 걸터앉는 소리. 나는 과수원으로 달려 나갔다. 사과나무 사이를 지나 돌담까지.

아드리안이 거기 있었다. 수도에서 막 도착한 먼지 묻은 외투와, 어깨에 멘 긴 통, 그리고 환하게 웃는 얼굴. 그는 한 번 더 키가 자라 있었다.

"늦었지?"

"……늦지 않았어요. 하루 전이에요."

"그럼 딱 맞았네."

그는 담에서 내려와 어깨의 통을 열었다. 안에서 두루마리 하나를 꺼내 내게 건넸다.

"펴 봐."

나는 두루마리를 펼쳤다. 트로네 공작령의 전체 지도였다. 저택, 정원, 마구간, 장미 터널, 과수원. 먹물과 은은한 채색으로 그린 선 하나하나가 정교했다. 그리고 과수원이 끝나는 자리, 돌담이 놓인 곳에 작은 문 하나가 그려져 있었다.

"……이건?"

"실제로는 없어. 하지만 지도에는 그려 넣었어. 오래 생각했거든. 우리 집과 이 집 사이에 담만 있는 게 아니라 문도 있었으면 좋겠다고."

"……."

"담 위에 앉는 것도 좋았는데, 이제는 문으로 걸어 들어가는 게 더 어울릴 것 같아서. 사람은 변하니까."

그가 나를 보며 웃었다. 오래전 낙엽 밟는 소리가 정직하게 한 사람 몫이라고 말하던 소년의 웃음이었다. 하지만 그때와 달리, 이 웃음은 나와 같은 높이에서 오는 것이었다.

"고마워요. 소중히 둘게요."

"선물이야. 갚지 마."

"알고 있어요."

---

저녁 식탁은 이 집이 가진 가장 긴 식탁이었다.

그 식탁에 모든 사람이 앉았다. 에드릭이 가장 먼 끝에 앉고, 내가 반대편 끝에 앉았다. 그 사이에 마르타 아주머니가 가져온 요리가 줄지어 놓였고, 양옆에는 로잘리, 세레나, 카일런, 아드리안, 하델, 홀트 선생, 탠지, 마로트가 앉았다. 마로트는 서 있으려 했지만 탠지가 의자를 끌어당겨 억지로 앉혔다. 그는 처음으로 이 집의 식탁에 앉아 식사를 했다.

그리고 나는 한 가지를 알아챘다. 마로트의 조끼 주머니에서 가느다란 은빛 쇠줄이 나와 있었다.

"……마로트 님."

"네, 아가씨."

"그거."

그의 손이 조끼 쪽으로 반사적으로 움직였다. 그러다 멈췄다. 한참 뒤에야 그가 조용히 시계를 꺼냈다. 은빛 뚜껑에 '윌로'라는 성이 새겨져 있었다. 이제 이름 칸은 닳아 있지 않았다. 누군가 새로 파 놓았다. 마로트라고.

"내일은 이 집을 지키기에 충분한 날이 될 것 같습니다."

그가 시계를 한 번 열었다 닫았다. 소리가 맑았다.

"그래서 차기로 했습니다."

식탁이 조용해졌다. 탠지가 울기 시작했다. 로잘리도 따라 울었다. 하델이 어색하게 손수건을 건넸고, 카일런이 말없이 컵에 물을 따랐다. 에드릭은 식탁 반대편 끝에서 눈을 내리깔고 아주 천천히 고개를 끄덕였다. 마로트는 정확한 각도로 고개를 숙였다. 눈가가 젖어 있었다.

식사가 끝나 갈 즈음, 홀트 선생이 일어났다. 손에 얇은 가죽 묶음이 있었다.

"아가씨."

"네, 선생님."

"이것은 아가씨의 것입니다."

묶음을 받았다. 편지였다. 낡은 종이, 같은 필체. 아버지가 홀트 선생에게 십 년 동안 보낸 학문 서신이었다. 몇십 통이 접힌 채 끈으로 묶여 있었다.

"저는 이것을 제가 가질 자격이 있다고 생각하지 않습니다. 이것은 그분이 아가씨의 아버님으로서가 아니라 학자로서 쓰신 글입니다. 아가씨가 읽으시면 아가씨의 아버님이 어떤 학자였는지 알게 되실 겁니다."

"선생님……"

"저는 이것을 한 번도 아가씨에게 보여 드리지 못했습니다. 아가씨가 읽을 준비가 되기를 기다렸습니다. 내일 이후면 되었겠다고 판단했습니다."

나는 편지 묶음을 가슴에 안았다. 홀트 선생은 아주 짧게 고개를 숙이고 자리에 앉았다. 눈가가 붉었다. 그녀답게 아무 말도 하지 않았다.

---

열한 시 오십 분.

모두가 방으로 돌아가고 저택이 조용해졌을 때, 나는 서재 앞에 서 있었다. 하델이 복도 끝에서 모르는 척 서 있었다. 노크는 하지 않았다. 문이 먼저 열렸다.

에드릭이 문 안쪽에 서 있었다. 옷은 낮과 같았다. 그의 손에는 작은 열쇠가 있었다. 호두나무 상자의 열쇠. 가장자리가 둥글고 위쪽이 휘어진 특이한 모양.

"……아직이다."

"네."

"자정까지 십 분이 남았다."

"네."

우리는 서재 안으로 걸어 들어갔다. 선반 위의 상자가 달빛을 받고 있었다. 책상 옆의 작은 책상에는 서랍이 하나 닫혀 있었다. 둘은 같은 열쇠 구멍을 가지고 있었다. 에드릭은 열쇠를 쥔 채 서 있었다. 자정을 알리는 종이 저택 어디선가 울리기 시작하자, 그가 천천히 열쇠를 내밀었다.

"열여덟 번째 생일을 축하한다."

나는 열쇠를 받았다. 가죽처럼 따뜻했다. 오랫동안 누군가의 손에 쥐여 있던 것이 분명했다.

상자의 열쇠 구멍에 꽂았다. 돌렸다. 소리가 났다.

뚜껑을 열었다. 안에는 아버지의 안경과 끈으로 묶인 편지 다발이 있었다. 그리고 그 위에, 오래된 흰 봉투가 놓여 있었다. 겉에는 단정한 글씨로 이렇게 적혀 있었다.

*열여덟 살의 아델라인에게.*

두 손으로 봉투를 들었다. 손이 떨렸다. 에드릭이 말없이 한 걸음 물러났다. 나는 창가의 작은 책상 앞에 앉아, 봉투를 열고 편지를 읽었다.

*아델라인.*

*이 편지를 네가 읽을 때 나는 곁에 없을 것이다. 쓰는 날은 네가 아직 아홉 살이고, 네 방 책상에서 노트에 무엇인가를 적고 있을 것이다. 너는 말하지 않는 아이라서, 나는 네가 무엇을 보고 있는지 늘 궁금했다. 궁금해하면서도 한 번도 묻지 못했다. 물으면 네가 대답할 것을 알았고, 대답하는 순간 네가 어른이 될 것 같아서였다.*

*나는 오래전에 한 가지를 발견했다. 그것이 무엇인지는 네가 열어 볼 것들 안에 있다. 나는 그것을 세상에 말하지 못했고, 말하지 않는 쪽을 택했다. 그것이 옳았는지 나는 모른다. 다만 내가 말하지 못한 것을, 네가 말할 수 있는 나이가 되기를 바랐다.*

*말해도 좋다. 덮어도 좋다. 선택은 너의 것이다. 한 가지만 부탁한다. 어느 쪽을 택하든, 누군가를 벌하기 위해서가 아니라 사람들을 이해하기 위해서 하여라.*

*네 이름은 에버하트다. 에드릭이 너를 데려간다면 그 이름은 하나 더 얻게 될 것이다. 둘 다 네 것이다. 버리지 마라.*

*에드릭은 말이 서툰 사람이다. 그의 침묵을 오래 읽어 주어라. 너라면 읽을 수 있을 것이다. 너는 언제나 말하지 않는 것에서 가장 많은 것을 읽어 내는 아이였으니까.*

*너를 사랑하는 아버지가.*

나는 마지막 줄을 오래 보았다. 글자가 번졌다. 번진 것은 오래전 잉크가 아니라 내 눈물이었다. 나는 편지를 가슴에 안고 한동안 고개를 숙이고 있었다. 에드릭은 한마디도 하지 않았다. 다만 이 방의 공기가 그가 거기 있다고 말하고 있었다. 숨을 쉴 때마다 따뜻해지는 침묵으로.

한참 뒤에 나는 고개를 들었다. 서랍도 열었다. 안에는 작은 은 메달리온이 하나 들어 있었다. 동쪽 마탑의 인장이 새겨진, 사본 열람 권한의 표식이었다.

"……내일 모두 앞에서 말하겠어요."

"그래."

"무엇을 말하고 무엇을 덮을지, 이미 정했어요."

"……말해 줄 필요 없다."

"아니요. 공작님이 먼저 아셔야 해요. 누구를 벌하지 않기 위해서요."

에드릭이 고개를 끄덕였다. 한참 뒤에 아주 낮은 목소리로 말했다.

"네 아버지가 기뻐할 것이다."

"……."

"나도, 그렇다."

나는 창가의 책상에 앉은 채로 한동안 움직이지 않았다. 밖에서 한 줄기 바람이 지나갔다. 아버지의 안경이 달빛 아래에서 반짝였다.

*—열여덟 살이 되었다.*
*—아버지의 편지에는 "벌하지 말고 이해하라"고 쓰여 있었다.*
*—내일 나는 그 문장으로 말할 것이다.*`}
