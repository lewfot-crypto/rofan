{n:28,title:'무도회',season:'겨울',text:`무도회장에는 위도 아래도 없었다.

기다란 식탁이 사라진 홀에는 둥근 탁자 여덟 개가 별자리처럼 흩어져 있었다. 촛불은 천장 샹들리에와 탁자 위 은촛대에 나뉘어 켜졌고, 어느 자리에서도 다른 자리가 정면으로 보이지 않았다. 손님들은 입구에서 안내를 받고 한 번씩 멈칫했다. 상석이 어디냐고 묻는 사람이 여럿 있었다. 마로트는 정확한 각도로 고개를 숙이고 대답했다. "이 홀에는 상석이 없습니다."

북부 대공은 낮게 웃었다. 황실 사절은 뜻밖의 표정을 지었고, 발트하임 백작 부부는 서로를 보지 않은 채 같은 탁자로 안내되었다. 그곳에는 북부의 사람이 한 명, 남쪽 상단의 후계가 한 명, 동쪽 마탑의 빈자리가 하나 있었다. 사람들은 서로의 얼굴을 보며 앉을 수밖에 없었다.

나는 이층 계단 위에서 그 모든 것을 내려다보고 있었다.

푸른 드레스, 회색 노트 자수의 소매. 탠지가 머리를 땋아 올리며 세 번 울었고, 마지막에는 로잘리가 대신 눈물을 닦아 주었다. 심장이 목구멍까지 올라와 있었다. 곁에서 에드릭이 한 번 숨을 깊이 쉬었다. 그도 같은 상태였을 것이다. 우리는 서로를 보지 않고 계단 아래를 보았다.

"……가자."

"네."

그가 팔을 내밀었다. 나는 그 팔에 손을 얹었다. 계단을 한 단씩 내려가는 동안, 홀 안의 대화가 바람이 눕듯이 낮아졌다. 마로트가 아래에서 소리 높여 불렀다.

"트로네 공작 각하와 영애를 소개합니다."

에드릭이 계단 중간에서 걸음을 멈추었다. 그의 목소리가 홀 전체에 울렸다. 크지 않았지만 정확했다.

"트로네 가의 아델라인입니다."

그가 한 번 숨을 쉬었다.

"그리고 에버하트의 딸입니다."

홀이 얼어붙었다. 에버하트. 십오 년 가까이 황궁에서 입에 올리면 안 되는 이름이었다. 한 부인의 부채가 바닥에 떨어졌고, 황제의 눈이 가늘어졌다. 발트하임 백작이 앉은 자리에서 의자가 아주 작게 끌렸다. 나는 그것들을 하나하나 보았다. 그리고 계단을 마저 내려갔다.

---

첫 곡이 시작되었다.

에드릭의 어깨가 처음에는 지나치게 곧았다. 홀 한가운데에서 두 사람만을 위해 비워진 원이 있었고, 수백 개의 눈이 우리를 보고 있었다. 첫 번째 회전에서 그의 구두가 내 치맛자락을 아주 조금 밟았다. 나는 웃음을 참았다. 그가 이를 악무는 소리가 들릴 것 같았다.

"……잘 틀렸나."

"아주 잘요."

"그럼 됐다."

두 번째 회전에서는 한 번도 밟히지 않았다. 세 번째에서는 그의 어깨가 풀렸다. 곡이 끝날 즈음에는 홀 안의 사람들이 우리를 숨죽여 보고 있었다. 이 집의 주인이 십오 년 만에 춤을 춘다는 것을 모두가 알고 있었다. 마지막 소절이 끝났다. 그가 나에게 고개를 숙였고, 나는 무릎을 굽혀 인사했다. 박수가 터졌다. 에드릭은 어쩔 줄 모르는 얼굴로 서 있다가, 이내 어색하게 고개를 한 번 끄덕였다.

그 순간 이 사람의 귀 끝이 붉어졌다는 것을, 나만 보았다.

---

그다음부터는 시간이 구슬처럼 굴렀다.

"한 곡을, 허락해 주겠나."

처음 온 사람은 카일런이었다. 그는 정확한 각도로 허리를 굽혔고, 장갑을 끼지 않은 오른손을 내밀었다. 짧아진 손가락 두 개가 촛불 아래에서 그대로 보였다. 이 홀의 사람들이 그것을 볼 것이었다. 그는 이미 알고 있었고, 그래도 손을 내밀었다. 나는 그 손을 잡았다.

"편지에 쓰지 못한 말이 있다."

춤추는 동안 그가 낮게 말했다. 목소리는 평탄했고, 귀 끝은 이미 붉었다.

"나는 어떤 선택을 하든 틀렸다고도 맞다고도 말하지 않겠다고 썼다. 하지만 한 가지는 맞다고 말하겠다. 네가 오늘 무엇을 하든, 북부의 문은 열려 있다."

"……고마워요."

"……그것만이 아니다."

그는 말을 잇지 못하고 입을 닫았다. 한참 뒤에야 아주 작게 덧붙였다.

"나머지는 글로 쓰겠다. 문장이 틀리면 지울 수 있으니까."

두 번째는 율리안이었다. 그는 평소의 완벽한 웃음 없이 다가왔다.

"율이라고 불러도 되죠?"

"당연해요."

"아버님께서 지금 이 홀을 보고 계세요. 저는 오늘 처음으로, 가면 없이 이 방에 서 있어요. 그래서 조금 어지러워요."

"……."

"당신이 오늘 무엇을 말하든, 저는 제 선택을 하게 될 거예요. 그게 무서운데, 이상하게 기뻐요."

세 번째는 리오넬이었다. 그는 춤을 추면서 입술을 움직이고 있었다.

"뭘 하세요?"

"스텝의 값을 계산하고 있습니다. 한 곡에 이백사십 박. 한 박당 값을 매기면 정산 가능한 단위가 나옵니다. 그런데 이 한 곡은……"

"……."

"정산이 안 됩니다."

그가 한 번 멈췄다. 평소의 능글맞은 웃음 뒤에서 숨겨지지 않는 표정이 나왔다.

"유리병 속 호두 값처럼요."

네 번째, 세바스티안의 자리는 비어 있었다. 아직 도착하지 않았다. 나는 그 빈 의자를 한 번 보았다. 시간이 점점 가고 있었다.

다섯 번째는 내가 찾아갔다. 홀 가장자리의 벽에 장검을 찬 소년이 곧게 서 있었다. 하델은 이 방의 누구보다 조용했다. 나는 그 앞에 서서 손을 내밀었다.

"아가씨, 저는 춤을 못 춥니다. 사실입니다."

"그럼 가르쳐 드릴게요."

"……임무 중입니다."

"그 임무를 오늘 제가 해제해요."

하델의 귀가 완전히 붉어졌다. 그는 한참 망설이다가 장검의 손잡이를 풀고, 아주 조심스럽게 내 손을 잡았다. 서투른 걸음이었다. 하지만 놀랍게도 한 번도 내 발을 밟지 않았다. 내 쪽의 보폭이 어긋날 때마다 그의 쪽이 먼저 맞췄다.

"아가씨."

"네."

"저는 뒤에 서겠다고 말씀드린 적이 없습니다."

"……네?"

"앞이라고 말씀드렸습니다. 지금은 정정합니다. 곁입니다."

그는 눈을 마주치지 못한 채 말했다. 목소리는 단단했고, 손은 떨렸다. 거짓말을 못 하는 사람의 가장 솔직한 방식이었다.

마지막은 아드리안이었다.

그는 아무 말 없이 다가와 손을 내밀었다. 나는 그 손을 잡았다. 우리는 느리게 돌았다. 다른 사람들과 달리, 이 춤에는 설명이 없었다. 말해지지 않은 것이 이미 충분했다.

"……네가 이 홀에 서 있는 걸 보니까."

춤이 끝날 즈음 그가 말했다.

"열 살 때 담 위에서 본 애가 맞는지 모르겠어."

"맞아요."

"응. 그런데 달라진 게 있다면, 이제는 같은 높이에서 볼 수 있다는 거야."

"……."

"그게 좋아."

우리는 서로에게 고개를 숙였다. 그것이 전부였다. 하지만 그 전부가 오래 이어진 어떤 것이었다.

세레나는 홀 가장자리의 탁자에서 하얀 리본을 단 채 조용히 서 있었다. 황태자가 다가와 인사했지만 그녀는 정중하게 거절했다. 이 방의 누구도 그것을 비난하지 못했다. 로잘리는 바닥에 앉아 수첩에 무엇인가를 열심히 적고 있었다. 사실만.

---

열 시 오 분 전.

나는 마로트에게 눈짓을 보냈다. 그는 정확한 각도로 고개를 끄덕이고 홀 입구로 향했다. 그때, 입구의 문이 활짝 열렸다.

"죄, 죄송합니다! 세 번째 부름에 왔습니다!"

숨을 몰아쉬며 들어온 것은 세바스티안이었다. 안경이 한쪽으로 기울어져 있었고, 로브 자락에는 진흙이 튀어 있었다. 그의 뒤에는 마탑의 인장이 새겨진 외투를 입은 두 명의 마법사가 서 있었다. 그리고 세바스티안의 두 팔에는 은빛 가죽으로 감싼 상자가 안겨 있었다. 마탑의 봉인이 세 겹으로 찍혀 있었다.

"탑의 규정상 열람 권한자가 직접 열어야 한다고 해서, 이대로 가지고 왔어요. 사흘 동안 쉬지 않고 말을 달렸어요. 그리고 대마법사님께는 제가……"

그는 숨이 차서 말을 멈췄다. 안경을 고쳐 쓰고 한 번 숨을 삼켰다.

"……읽지 않고 가져왔어요. 하지만 읽지 않는 것이 안전하다는 생각은, 이제 버렸어요."

나는 그에게 다가가 상자를 받았다. 무거웠다. 십오 년의 무게였다.

"고마워요, 세바스티안 님."

"천천히 생각했어요. 천천히 생각하는 건 잘하니까."

"……정말 잘하셨어요."

그의 귀가 붉어졌다. 이 홀의 아이들은 모두 귀가 쉽게 붉어졌다.

홀 안의 사람들이 서서히 조용해졌다. 음악이 멈췄다. 마로트가 지휘자에게 아주 작은 손짓을 했다. 악단이 연주를 멈췄다. 이어서 수백 개의 눈이 나를 향했다.

그때 발소리가 들렸다. 정확하고 천천히, 한 걸음씩.

발트하임 백작이 내 앞에 서 있었다.

오십 대 초반, 단정한 회색 머리, 잘 다듬어진 얼굴. 나는 그를 이렇게 가까이에서 본 적이 없었다. 그의 얼굴은 한 번도 흐트러진 적이 없는 사람의 것이었다. 하지만 나는 그의 손을 보았다.

손가락 끝이 떨리고 있었다. 오래전 서재 문 앞에서 에드릭의 손에서 보았던 떨림과 같았다. 두려움이었다. 악의가 아니라, 오래 눌러 둔 두려움이었다.

"에버하트의 딸."

"네, 백작님."

"오늘 이 자리에서, 무엇을 말할 생각인가."

목소리는 낮고 평탄했다. 위협처럼 들렸다. 하지만 나는 그 속에 다른 것이 있다는 것을 들었다. 질문이 아니라, 오랫동안 기다려 온 사람의 목소리였다.

"곧 말씀드리겠습니다."

나는 대답했다.

"백작님께서도 그 자리에서 들어 주세요. 부탁드립니다."

그는 나를 바라보았다. 그리고 한 걸음 물러났다. 나는 상자를 가슴에 안고 계단 쪽으로 걸어갔다. 한 단, 한 단. 홀의 시선이 내 걸음을 따라 올라왔다. 중간 층계참에 서자 모든 탁자가 한눈에 들어왔다. 둥근 탁자들, 흔들리는 촛불, 숨죽인 얼굴들.

나는 열 살 때부터 말하지 않는 아이였다. 이 집에서 처음 배운 것은 말해지지 않는 것이 말해지는 것보다 많다는 것이었다. 그리고 지금, 처음으로, 나는 많은 사람 앞에서 입을 열려고 하고 있었다.

심장이 한 번 크게 뛰었다. 홀의 반대편에서 에드릭이 나를 보고 있었다. 그가 아주 작게 고개를 끄덕였다.

나는 숨을 쉬고 말을 시작했다.`},

{n:29,title:'침묵의 끝',season:'겨울',text:`"저는 말이 적은 사람입니다."

처음 나온 목소리는 내 생각보다 작았다. 홀의 뒤쪽 사람들은 듣지 못했을 것이다. 나는 숨을 한 번 쉬고 다시 시작했다.

"열 살에 이 집에 왔을 때, 저는 말하지 않는 아이였습니다. 말하지 않으면 틀린 사람이 되지 않는다고 믿었기 때문입니다. 그래서 대신 보았습니다. 커튼이 흔들리는 것을, 비어 있는 의자를, 손끝이 떨리는 것을, 말해지지 않는 것들을."

홀은 조용했다. 촛불이 한 번 흔들렸다.

"오늘 저는 처음으로, 보고 있던 것을 말하려고 합니다."

나는 상자를 층계참의 난간 위에 올렸다. 손이 떨렸다. 에드릭이 열어 준 열쇠와 마탑의 인장 메달리온을 꺼내, 세 겹의 봉인을 하나씩 풀었다. 철컥, 철컥, 철컥. 소리 하나하나가 홀 전체에 울렸다.

상자 안에는 두 장의 문서가 있었다.

하나는 낡은 양피지, 하나는 새 종이였다. 나는 두 장을 들어 올려 사람들이 볼 수 있도록 펼쳤다.

"이것은 선황 폐하께서 남기신 후계 문서의 사본입니다. 그리고 이쪽은, 황실 문서고에 보관된 현재의 정본입니다."

두 장을 나란히 들었다.

"두 문서는 한 조항이 다릅니다. 고쳐지기 전의 것에는 '후계는 장자의 혈통으로 이어진다'만 있습니다. 고쳐진 것에는 거기에 '단, 장자의 혈통이 국정을 감당하지 못할 때는 차자의 혈통이 계승한다'가 더해져 있습니다."

홀 한쪽에서 누군가의 숨이 멈췄다. 황제가 의자에서 몸을 일으켰다. 얼굴은 변하지 않았지만 손이 탁자 가장자리를 쥐고 있었다.

"그 조항은 선황 폐하의 필체가 아닙니다. 저의 아버지, 에버하트 기록관이 오래전에 이를 발견했습니다. 아버지는 그것을 세상에 말하는 대신 침묵을 택했습니다. 말하면 나라가 둘로 갈라질 것이라는 이야기를 들었고, 그것을 믿었기 때문입니다."

나는 멈추지 않으려고 숨을 한 번 더 쉬었다.

"아버지는 침묵을 지켰고, 저의 새 아버지, 트로네 공작 각하께서는 그 침묵을 지키기 위해 오랫동안 불을 켜 두셨습니다. 이 문서를 지키는 일에 이 집은 오랜 세월을 썼습니다."

"……."

"저는 이것을 누군가를 벌하기 위해 말하는 것이 아닙니다."

목소리가 조금씩 단단해졌다. 나는 홀 전체를 둘러보았다. 북부 대공의 얼굴, 황후의 얼굴, 율리안의 얼굴. 그리고 발트하임 백작의 얼굴.

"고친 분은 이미 돌아가셨습니다. 저는 그분의 이름을 압니다. 기록에 서명이 있습니다. 하지만 저는 그것을 이 자리에서 말하지 않겠습니다. 이름을 말하는 일은 벌하는 일이 되기 쉽고, 저는 아버지의 마지막 편지에서 한 가지 부탁을 받았습니다."

나는 가슴 주머니에서 편지를 꺼냈다. 읽지 않았다. 외웠으니까.

"'누군가를 벌하기 위해서가 아니라, 사람들을 이해하기 위해서 하라.'"

숨소리 하나 들리지 않았다.

"그래서 저는 부탁드리려고 합니다. 이 문서를 벌의 증거가 아닌 기록으로 남겨 주시기를."

그때였다.

"……그 이름은."

낮은 목소리가 홀의 뒤쪽에서 들려왔다. 모두가 돌아보았다. 발트하임 백작이 앉은 자리에서 천천히 일어서고 있었다. 그의 얼굴은 하얗게 질려 있었다. 손가락이 떨리고 있었다. 하지만 목소리는 이상하리만큼 고요했다.

"저의 아버지입니다."

홀 안이 완전히 얼어붙었다. 백작 부인이 부채를 떨어뜨렸다. 아무도 줍지 않았다.

"선대 발트하임 백작이 그 조항을 더했습니다. 선황 폐하께서 병석에 누우신 해, 나라가 내전의 문턱에 서 있던 해에. 저의 아버지는 그것이 나라를 지킨다고 믿었습니다. 저는 아버지가 돌아가시기 직전에 그 사실을 들었습니다."

백작이 한 걸음 앞으로 나왔다. 사람들이 길을 비켰다.

"그 뒤로 저는 이 비밀을 지키는 사람이 되었습니다. 그리고 에버하트 기록관이 그것을 발견했다는 것을 알았을 때, 저는 두려웠습니다. 저의 가문이 반역자가 되고, 나라가 갈라질 것 같아서."

"……."

"그리고 그 비 오는 밤이 있었습니다."

백작의 목소리가 흔들렸다.

"에버하트의 마차가 다리 위에서 미끄러지는 것을 저는 맞은편에서 보았습니다. 사고였습니다. 누구도 개입하지 않았습니다. 다만……"

그가 입술을 한 번 깨물었다.

"저는 한 걸음이 늦었습니다. 마차가 뒤집힌 것을 보았을 때, 가장 먼저 든 생각이 구하러 달려가는 것이 아니라, 저 서류 가방이 강으로 떨어졌으면 하는 것이었습니다. 그 생각이 머릿속을 지나가는 동안, 몇 초가 흘렀습니다. 그 몇 초가 지난 뒤에야 저는 달려갔고, 이미 늦어 있었습니다."

침묵이 홀을 짓눌렀다. 아무도 숨을 쉬지 않았다. 나는 계단 위에서 백작의 얼굴을 바라보았다. 이 사람은 지난 팔 년 동안 입을 열 수 없었던 이유를 지금 말하고 있었다. 말할수록 의심받을 것이었다. 침묵하면 오해받고, 말하면 더 이상해지는 사람이었다.

"저는 에버하트를 죽이지 않았습니다. 그러나 살리지도 못했습니다. 그것이 저의 죄입니다."

"……백작님."

"그리고."

그가 에드릭 쪽으로 몸을 돌렸다.

"사흘 뒤 공작 각하의 현관 앞에 놓여 있던 서류 가방 말입니다. 서명 없이."

에드릭의 어깨가 아주 약간 움직였다.

"……그것을 놓은 것이 저였습니다. 강가에서 건져 낸 가방을 한 장도 열지 않고, 그대로 가져다 놓았습니다. 그것밖에 할 수 있는 일이 없었습니다."

나는 눈을 감았다. 그제야 모든 것이 이어졌다. 서명 없는 노트와 서명 없는 가방. 이 집에는 서명 없이 건네지는 것들이 많았다. 그리고 그것들은 모두 용기가 없어서가 아니라, 용기를 내는 방법을 몰라서였다.

"……백작님."

나는 눈을 뜨고 말했다.

"서명 없이 가방을 놓아 주신 일을, 저는 몰랐습니다. 이제 압니다. 그것을 알려 주셔서 고맙습니다."

백작이 고개를 숙였다. 어깨가 한 번 크게 떨렸다. 그는 울지 않았지만, 눈가가 붉었다. 오랜만에 누군가에게 용서받은 사람의 얼굴이었다.

---

"짐은."

황제의 목소리가 홀의 침묵을 갈랐다. 모두가 그쪽을 향했다. 황제는 천천히 일어서 있었다. 오십을 넘은 얼굴에는 놀람도 분노도 없었다. 오래 접어 둔 종이가 펼쳐지는 사람의 표정이었다.

"그 조항이 고쳐졌다는 것을 오늘 처음 안다."

"……."

"짐은 몰랐다. 짐은 이 왕관이 선황의 뜻으로 내려온 것이라고 믿어 왔다. 그리고 오늘 그것이 반만 사실이라는 것을 알았다."

황제가 홀을 둘러보았다. 황후가 곁에서 그의 팔을 쥐었다. 율리안이 아버지의 뒤에서 숨을 멈추고 있었다.

"그러나 짐은 이 자리에서 한 가지를 말하겠다. 이 왕관은 그 한 줄의 조항 위에 있지 않다. 이십 년의 평화 위에 있다. 그 평화를 이룬 것은 짐이고, 신하들이고, 백성이다. 문서가 아니다."

그가 나를 보았다.

"에버하트의 딸."

"네, 폐하."

"그대가 청한 것을 받아들인다. 문서는 두 가지 모습으로 보관할 것이다. 고쳐지기 전의 것과 고쳐진 것을, 나란히. 문서고 입구에는 에버하트 기록관의 이름을 새기겠다."

홀 안에서 숨이 터지는 소리가 났다.

"또한."

황제가 발트하임 백작을 향해 몸을 돌렸다.

"백작의 침묵은 죄가 아니다. 짐의 법이 만든 두려움이다. 진실을 말한 자가 벌을 받는 나라에서는, 모든 사람이 입을 다물게 마련이다."

"……폐하."

"짐은 오늘부터 진실을 말한 자를 벌하지 않는 법을 만들겠다. 백작은 그 법의 첫 증인이 될 것이다."

발트하임 백작이 무릎을 꿇었다. 사람들이 한꺼번에 숨을 들이쉬었다. 홀 한구석에서 세레나가 두 손으로 입을 막고 서 있었다. 눈물이 뺨으로 흘러내렸고, 로잘리가 그 옆에서 수첩을 내려놓은 채 그녀의 손을 잡았다.

---

모든 것이 끝났다. 정확히 말하면, 모든 것이 한 번 끝났다.

나는 층계참에 선 채 두 손이 아직 떨리고 있다는 것을 알았다. 홀의 사람들이 다시 숨을 쉬기 시작했다. 누군가 박수를 쳤다. 처음에는 한 사람, 다음에는 두 사람. 이윽고 박수가 파도처럼 홀 전체로 번졌다.

나는 아래를 내려다보았다.

홀의 맨 끝에서 에드릭이 서 있었다. 그는 한 걸음도 움직이지 않았다. 얼굴은 변하지 않았지만, 두 손이 허리 옆에서 천천히 쥐어졌다 펴졌다. 십오 년 동안 지고 온 것이 지금 내려지고 있었다. 그리고 그는 그 무게가 없어진 몸으로 어떻게 서 있어야 할지 모르는 사람 같았다.

나는 계단을 내려갔다. 한 단씩. 사람들이 길을 비켰다. 홀을 가로지르는 동안 아무도 말하지 않았다. 마로트가 눈가를 훔치고 있었고, 탠지가 울고 있었고, 홀트 선생이 안경을 벗고 있었고, 카일런과 하델이 서로 다른 방향에서 같은 표정으로 서 있었다.

에드릭 앞에 섰다.

우리 사이에는 한 걸음의 거리가 있었다. 팔 년 가까이 이 한 걸음이 건너기 가장 어려운 거리였다. 나는 천천히 그 걸음을 건넜다. 그의 팔 안으로.

"……이제."

목소리가 갈라졌다. 나는 한 번 숨을 삼키고, 처음으로 입 밖에 냈다.

"이제 불을 꺼도 돼요, 아버지."

에드릭의 몸이 굳었다. 한 박자. 두 박자. 홀 전체가 정지한 것 같았다. 그리고 그의 두 팔이 천천히 올라와 내 등을 감쌌다. 아주 조심스럽게. 깨질 것을 다루는 사람처럼. 그리고 이어서 단단하게. 놓치지 않으려는 사람처럼.

"……아델라인."

머리 위에서 목소리가 났다. 이 홀의 누구도 들은 적 없는 목소리였다. 낮고, 갈라지고, 한 번도 이렇게 불린 적 없는 이름처럼 서툴렀다.

"……내 딸."

나는 그의 가슴에 얼굴을 묻었다. 심장이 뛰고 있었다. 이 사람의 가슴에서 이렇게 빠른 소리가 날 수 있다는 것을 처음 알았다. 어깨가 떨리고 있었다. 나는 알았다. 이 사람이 울고 있다는 것을. 소리 없이, 십오 년 동안 한 번도 흘리지 못한 것을.

침묵은 끝났다. 말해지지 않은 것들이 한꺼번에 말해졌다. 하지만 나는 이 순간만큼은, 말보다 더 많은 것이 이 팔 안에 있다는 것을 알았다.

그날 밤 열두 시, 이층 가장 왼쪽 창의 불이 꺼졌다.

내가 이 집에 온 날 커튼이 흔들리던 창. 아드리안이 8년 동안 꺼진 적 없다고 말하던 창. 그 창이 처음으로 어둠이 되었다. 나는 정원에서 그 창을 올려다보았고, 사과나무 가지 사이로 달이 한 번 흔들렸다.

*—나는 오늘 처음으로 많은 사람 앞에서 말했다.*
*—그리고 처음으로 "아버지"라고 불렀다.*
*—말해지지 않는 것이 많은 집에서, 이제 말해진 것이 하나 더 늘었다.*`}

text:`무도회가 끝난 뒤의 계절은 조용하게 흘러갔다.

황실 문서고 입구에는 새 돌이 놓였다. 돌 위에는 아버지의 이름이 새겨졌다. 나는 제막식에서 한마디도 하지 않았다. 말은 이미 충분히 했다. 그날은 그저 돌 위로 손을 올렸고, 차가운 돌이 내 손의 온기로 천천히 따뜻해지는 것을 느꼈다.

마로트는 그날 이후로 회중시계를 한 번도 풀지 않았다.

{id:'adrian',group:'마음이 향하는 길',label:'아드리안 · 담장의 문',text:`아드리안은 사 년 만에 학교를 마치고 돌아왔다.

수도에서 짐을 풀기도 전에 그는 담장 앞에 섰다. 돌담 한가운데, 오래전 그가 지도 위에 그려 넣었던 자리에 작은 문 하나가 서 있었다. 이번에는 종이 위의 선이 아니었다. 나무와 쇠로 짠 진짜 문이었다. 하델과 마로트가 한 달 전부터 몰래 만들고 있었다는 것을, 나는 문이 완성된 날 알았다.

"이거, 네가 한 거야?"

"나는 도면만 그렸어요. 만든 건 모두예요."

"그래도 도면은 내 지도에서 가져왔잖아."

"네."

"그럼 내 문이네."

그가 문을 열었다. 경첩이 한 번 낮게 울었다. 그리고 그는 처음으로 담을 넘지 않고, 문으로 걸어 들어왔다. 사과나무 아래로. 내 앞으로. 열 살에 담 위에서 처음 만난 날부터 구 년 가까이 한 번도 해 보지 않았던 방식으로.

"있잖아."

그가 말했다.

"예전엔 말 안 해도 알아줄 거라고 믿었어. 너는 눈치가 빠르고 나도 눈치가 빠르니까, 말 안 해도 서로 알 거라고."

"……."

"그게 틀렸어. 아니, 틀린 건 아니었는데 충분하지 않았어. 말하지 않아도 알 수 있는 것과 말해야 알 수 있는 것은 다르잖아. 나는 평생 앞의 것만 믿었어."

그가 한 번 숨을 삼켰다.

"그래서 이번에는 말할게. 담 위에서 처음 널 봤을 때, 낙엽 밟는 소리가 정직하게 한 사람 몫이라고 생각했어. 그 뒤로 십 년 동안 그 소리를 기다렸어. 오늘도 기다렸어. 너 말고 다른 사람의 발소리는 아무리 정직해도 한 사람 몫이 안 돼."

나는 사과나무 가지 아래에서 한동안 서 있었다. 어디선가 새가 울었다. 꽃이 지고 열매가 맺히는 계절이었다.

이 사람 앞에서는 오래 말을 하지 않아도 틀린 사람이 되지 않았다. 나는 이제 그 편안함이 가장 큰 선물이라는 것을 안다. 하지만 오늘은 그 선물 위에, 한 가지를 더 얹고 싶었다.

"저도 말할게요."

"응."

"아드리안이 내가 변하는 걸 무서워하는 동안에도, 저는 아드리안이 변하지 않았으면 하는 마음과 변했으면 하는 마음 사이에서 오래 흔들렸어요. 이제 알아요. 변해도 괜찮아요. 담이 문이 되는 것처럼요."

그가 웃었다. 처음 보는 웃음이 아니었는데, 처음 보는 웃음 같았다.

"그게 대답이야?"

"이 집에서는 가장 긴 대답이에요."

그날 오후 우리는 열린 문 앞에 식탁을 내놓고 차를 마셨다. 사과나무 아래, 두 사람이 앉을 수 있는 작은 탁자. 아드리안이 장갑 낀 손과 안 낀 손을 번갈아 보다가 두 손으로 찻잔을 받았다.

"이거 맛있다."

"제가 우린 거예요."

"그래서 더 맛있어."`},
{id:'friends',group:'그 밖의 길',label:'우정 · 네 개의 의자',text:`트로네 저택 서쪽 온실이 비어 있었다.

원래는 정원사 할아버지의 겨울 화분 창고였는데, 무도회 이후 사람들이 하나둘 짐을 빼면서 의자 몇 개와 큰 탁자만 남았다. 우리는 그 온실을 우연히 쓰기 시작했다. 로잘리가 소식지 원고를 들고 와서 앉았고, 세레나가 편지 더미를 가지고 와서 앉았고, 탠지가 장부를 들고 와서 앉았고, 나는 노트를 들고 앉았다.

그렇게 네 개의 의자가 채워졌다.

로잘리의 소식지는 일 년 만에 도시에서 가장 믿을 수 있는 읽을거리가 되었다. 사실만 쓰는 신문은 느리고 재미가 없었다. 하지만 한 번 믿게 된 독자들은 다음 호를 기다렸다. 로잘리는 소문을 퍼뜨리는 대신 사실을 모으는 데 평생 쓸 재주를 발견했다. 그녀의 눈은 이제 사람을 판단하는 대신 사람을 듣는 방향으로 열려 있었다.

세레나는 황후가 되는 길 대신, 이름 없는 학교를 세웠다. 말을 배우지 못한 영애들, 싫다고 말해 본 적 없는 아이들이 거기에서 처음으로 이렇게 묻는 법을 배웠다. *나는 무엇을 원하는가.* 학교 정문에는 간판이 없고, 하얀 리본 하나가 매어져 있었다. 세레나는 그 질문을 던질 때마다 자신의 어머니와 화해하고 있다는 것을 알았다. 한 번도 입 밖에 내지 않았지만.

탠지는 이 모든 것의 장부를 맡았다. 소식지의 수입, 학교의 운영비, 트로네 가의 비서 업무까지. 한때 글자를 많이 몰랐던 소녀가 이제 숫자 열 줄을 한눈에 읽었다. 그녀는 마로트에게 이따금 오렌지 양이라 불렸고, 그때마다 소리 내어 웃었다. 웃음 뒤에 숨은 것은 이제 아무것도 없었다.

그리고 나는 기록했다.

그 일 년 동안 우리가 한 일을, 오가는 말을, 보이지 않는 것을. 노트는 두꺼워졌고, 홀트 선생은 그것을 한 권의 책으로 엮어 보라고 권했다. 책의 제목은 아직 정하지 못했다. 나는 그것이 이 온실에 앉은 네 사람의 이야기라는 것만 알았다.

어느 겨울 오후, 온실 창에 눈이 내렸다. 로잘리가 갑자기 연필을 놓았다.

"있잖아요. 저 이 의자에 앉을 때마다 신기한 생각이 들어요."

"뭔데요?"

"의자 네 개에 사람이 네 명 앉아 있다는 거요. 빈 의자가 하나도 없어요. 저는 평생 빈 의자 옆에서 말만 많이 하던 사람이었는데."

세레나가 한 번 코웃음을 쳤다. 하지만 눈가가 웃고 있었다. 탠지는 장부를 덮고 차를 따랐다. 나는 노트를 펴고 한 줄을 썼다.

*—이 온실에는 빈 의자가 없다.*

그 문장을 쓰고 나서 오래 바라보았다. 열 살에 긴 식탁 끝의 비어 있는 의자를 처음 보았던 날이 떠올랐다. 누구도 앉지 않을 자리에 누군가는 매번 식기를 놓는다. 그 의자가 이제 모두 찼다. 그리고 그것은 어떤 사랑의 엔딩보다 더 오래 갈 만큼 단단한 우정이었다.`},
{id:'family',group:'그 밖의 길',label:'가문 번영 · 트로네 공작령',text:`트로네 공작령의 장부는 그해 처음으로 흑자로 마감되었다.

북쪽 고개를 지나는 모피 거래가 안정되고, 남쪽 상단과 맺은 계약이 한 해를 채우면서 저택의 금고에 여유가 생겼다. 마로트는 마지막 장부를 덮고 손을 책 위에 올려 두었다. 오랜 세월 혼자 지고 온 숫자가 비로소 평평해지는 소리를 듣고 있는 것 같았다.

에드릭은 공식적으로 나를 후계자로 지명했다. 트로네 공작가의 첫 번째 여성 상속인. 그날 서류에 서명할 때 그의 손은 한 번도 흔들리지 않았다. 대신 서명이 끝난 뒤 그가 서재 창가의 의자로 걸어가 오래 앉아 있었다. 십오 년 만에 한낮의 햇빛 속에서 책을 읽는 사람이 되었다. 그는 하루에 한 번씩, 아무 이유 없이 내 방 문 앞을 지나갔다. 그것이 요즘 그의 하루 일과였다.

나는 공작령을 새로 정비했다. 첫해에는 마을마다 학교를 세우기로 했다. 홀트 선생이 교육장이 되었고, 선생은 새 소매를 단 회색 드레스를 입고 출근했다. 두 번째 해에는 북쪽 고개의 통행 수수료를 장학금으로 돌렸다. 세 번째 해에는 마구간 옆에 의무소를 지었다. 탠지는 모든 공문서를 읽고 정리하는 총무가 되었고, 하루 평균 열세 번 웃었다.

저택은 더 이상 조용하지 않았다.

아침이면 부엌에서 반죽 치는 소리가 들렸고, 정원사 할아버지는 장미에게만 존댓말을 쓰다가 이제 가끔 나에게도 쓰기 시작했다. 세탁실의 쌍둥이 자매는 서로의 말을 끝까지 듣는 데 성공해서 마르타 아주머니가 호두 과자를 한 접시 더 구웠다. 마구간의 마부는 일주일에 두 번 웃었다.

마로트는 시계를 찬 채로 매일 아침 정확한 각도로 인사했다. 하지만 이제 그 인사에는 약간의 여유가 있었다. 그는 한 번도 말하지 않았지만, 처음으로 점심 시간에 자기 의자에 앉아서 식사를 했다.

어느 저녁, 서재에서 에드릭이 말했다.

"……장부가 평평하다."

"네."

"좋은 일이다."

"네, 공작님."

"……아버지라고 불러라."

나는 고개를 들었다. 그는 책에서 눈을 떼지 않은 채 말했다. 귀 끝이 아주 약간 붉었다.

"……아버지."

"그래."

그것이 전부였다. 하지만 이 저택에서 가장 높은 곳에 놓인 말은 언제나 가장 짧았다.

나는 서재 창가의 작은 책상에서 올려다보았다. 이층 가장 왼쪽 창은 일곱 시에 불이 꺼지는 창이 되었다. 이 집의 장부는 평평했고, 이 집의 주인은 오랜만에 아침까지 자는 사람이 되었다. 그것이 내가 지켜 낸 가문의 번영이었다. 숫자가 아니라, 불이 꺼지는 시간으로.`},
{id:'scholar',group:'그 밖의 길',label:'독립 · 열려 있는 문서고',text:`제국 문서고의 정문 앞에서, 나는 마차를 멈추게 했다.

입구의 돌에는 아버지의 이름이 새겨져 있었다. 에버하트. 처음 새겨진 날에는 차갑던 돌이 이제는 햇볕에 데워져 있었다. 나는 그 돌 위에 한 번 손을 올렸다. 그리고 가방을 들고 문서고 안으로 들어갔다.

나는 그해 가을, 제국 문서고의 첫 번째 여성 기록관이 되었다.

황제는 임명장을 직접 건넸다. 이런 일은 보통 서기관이 하는 법이었다. 그는 나를 바라보다가 낮게 말했다.

"그대의 아버지가 이 자리에 앉았을 때 짐은 그가 이렇게 오래 남을 줄 몰랐다."

"……."

"기록은 사람을 남긴다. 부탁하겠다. 이번에는 모든 것을 남기게."

나는 고개를 숙였다. 그 부탁은 명령이 아니었다. 사과였고, 위임이었고, 오래 기다린 사람이 건네는 열쇠였다.

문서고 안에서 나의 일은 단순했다. 고쳐진 문서와 고쳐지기 전의 문서를 나란히 두고, 그 사이에 놓인 세월을 설명하는 일. 누가 왜 고쳤는지, 누가 왜 침묵했는지, 누가 왜 늦었는지. 나는 그것들을 벌하지 않고 적었다. 이해하기 위해서. 아버지의 편지가 부탁한 그대로.

처음 몇 달은 어려웠다. 문서고의 서가는 높았고, 먼지는 두꺼웠고, 사람들은 나를 대할 때 한 번씩 머뭇거렸다. 하지만 내가 가진 가장 오래된 재주가 이곳에서 쓸모가 있었다. 나는 읽는 사람이었다. 글자와 글자 사이를, 문장과 문장 사이를, 말해지지 않은 것들을.

세바스티안이 마탑에서 이따금 편지를 보냈다. 로잘리의 소식지는 문서고에 구독으로 들어왔다. 율리안은 지나가는 길에 문서고 입구에서 장미를 한 송이 놓고 갔다. 아드리안은 문서고의 지도실 개편을 도왔고, 리오넬은 도서 운송 계약서를 세 번 고쳐 보냈다. 카일런의 편지는 날씨로 시작했고, 하델의 편지는 사실로 끝났다. 나는 그 모두를 책상 서랍에 넣었다. 선택하지 않은 것이 아니라, 선택하지 않아도 되는 방식으로 가진 것이었다.

가끔 밤늦게 홀로 남아 서가 사이를 걸을 때가 있었다. 천장 높은 어둠 속에서, 수천 개의 이름이 책등마다 숨 쉬고 있었다. 나는 그 앞에서 한참 서 있다가 노트를 펴고 한 줄을 썼다.

*—기록하는 사람은 누구보다 많은 침묵을 읽는다.*

그해 겨울, 나는 새로운 연대기를 쓰기 시작했다. 제목은 *에버하트와 트로네.* 두 이름을 가진 한 사람의 이야기이기도 했고, 침묵하던 사람들이 하나씩 입을 여는 이야기이기도 했다. 책의 첫 줄은 이미 정해져 있었다. 이 집에 도착한 날 마차 창문에 비친 내 얼굴에 대한 한 줄.

나는 앞으로 이 문서고에서 오래 살 것이다. 그리고 그것이 아버지가 남긴 마지막 질문, *선택하게 하시오*에 내가 내놓는 대답이었다. 말해도 좋고 덮어도 좋다. 하지만 기록하는 것은 둘 사이의 가장 느린 용기였다.`}

closing:`어느 길을 걸었든, 첫눈이 오는 날 아침이면 나는 같은 장소에 서 있었다.

저택 현관이었다.

어느 해에는 북쪽으로 떠나는 길이었고, 어느 해에는 탑이나 절벽이나 문서고로 가는 길이었고, 어느 해에는 정원 끝으로 나가는 짧은 길이었다. 가는 곳은 해마다 달랐다. 하지만 현관의 대리석은 해마다 같은 소리를 냈고, 계단 위에서 같은 사람이 내려오고 있었다.

에드릭은 이제 머리의 반이 희었다. 서재의 불이 일곱 시에 꺼지는 사람의 얼굴로, 한결 느슨해진 어깨로, 천천히 계단을 내려왔다. 마로트가 문 옆에서 시계 줄을 쥔 채 정확한 각도로 고개를 숙였다. 탠지가 머플러를 들고 뛰어와 숨이 차서 말을 못 했다. 홀트 선생은 안경을 고치고 뒤에서 아무 말 없이 서 있었다.

그리고 눈이 내렸다. 현관 문밖으로 아주 조용하게. 마치 모든 소리가 눈 속으로 삼켜지는 계절처럼.

나는 외투를 아직 입지 않았다. 그것을 잊은 건 아니었다. 이 아침만은 일부러 그랬는지도 모른다.

에드릭이 내 앞에서 걸음을 멈추었다. 한 번 나를 보고, 내 어깨 너머의 눈을 보았다. 그의 입술이 아주 조금 움직였다. 말을 고르는 사람의 움직임이었다. 이 사람이 말을 고르는 데는 언제나 오래 걸렸고, 나는 그 시간이 이 세상에서 가장 정직한 시간이라는 것을 알고 있었다.

"……춥다."

그가 말했다.

"외투 입어라."

그것이 전부였다. 오래전 열 살의 내가 이 집에 와서 가장 듣고 싶었으나 한 번도 듣지 못했던 문장이었다. 짧은 평서문과 명령형. 걱정이라는 말을 모르는 사람이 걱정을 하는 단 하나의 방식.

나는 외투를 입었다. 단추를 하나씩 채우며, 그의 눈을 바라보았다.

"……네, 아버지."

에드릭은 고개를 한 번 끄덕였다. 그리고 한 걸음 다가와 내 외투 깃을 아주 조심스럽게 세워 주었다. 손가락이 닿은 자리가 따뜻했다. 처음 만난 날부터 차갑다고 믿었던 손이었다.

나는 문을 열었다. 눈이 쏟아졌다. 현관 밖의 세계는 하얗게 지워져 있었고, 그 위에 첫 발자국이 놓일 자리가 비어 있었다.

"다녀오겠습니다."

"……그래."

그는 문이 닫힐 때까지 그 자리에 서 있었다. 나는 돌아보지 않고도 알았다. 계단 위 가장 왼쪽 창에서 누군가 아침의 눈을 내려다보고 있다는 것을. 이제 그 창은 밤새 불이 켜지는 창이 아니라, 아침이면 열리는 창이었다.

말해지지 않는 것이 많았던 집에서, 끝까지 가장 많이 말해진 것은 그 짧은 걱정이었다.

*—서재의 불은 이제 일곱 시에 꺼진다.*
*—현관에서는 해마다 같은 말이 들린다.*
*—그 말이 이 이야기의 가장 긴 문장이다.*`
}

{n:31,ex:true,exNo:1,title:'오렌지 양의 첫 월급',season:'봄',text:`제가 트로네 공작 저택에 온 날, 마르타 아주머니는 반죽하던 손을 멈추고 저를 위아래로 훑어보더니 이렇게 말했어요.

"이 집은 참새를 먹이는 곳이 아닌데."

그래서 저는 그날부터 꼬마 참새가 됐어요! 이름이 있었는데 아무도 안 불렀어요. 머리가 이렇게 귤색이니까 다들 탠지라고 불렀고, 저도 그 편이 좋았어요. 본명은 길고, 길어서 부르다가 숨이 차거든요. 아니, 사실은 그냥 말하기 싫어서요. 이 집 사람들은 아직 제 이름 뒤에 뭐가 붙어 있는지 모르니까요. 빚이라든가, 엄마의 기침이라든가, 일곱 살 동생 핍의 구멍 난 양말이라든가.

엄마는 제가 떠나던 날 아침에 제 두 볼을 양손으로 꼭 잡고 말했어요.

"탠지야, 웃어라. 웃으면 사람들이 조금 더 친절해진단다."

그건 엄마가 평생 쓴 방법이었어요. 효과가 있었냐고요? 있었어요. 웃으면 정말 사람들이 조금 더 친절해졌어요. 하지만 제가 웃는 동안 엄마가 한 번도 안 웃었다는 걸 알아챈 건 아주 나중이었어요.

---

집사님을 처음 만난 날은 정말 무서웠어요.

저택 뒷문으로 들어가자 복도 끝에서 검은 옷을 입은 남자가 걸어왔어요. 걸음 소리가 하나도 안 났어요. 진짜예요. 대리석 바닥인데요. 그분은 제 앞에서 딱 멈추더니 제 구두를 한 번, 얼굴을 한 번, 짐 보따리를 한 번 보고 말했어요.

"이름은."

"탠지예요! 머리가 이래서요!"

"본명은."

"길어서요……"

"그렇습니까."

그분은 작은 수첩에 뭔가 적었어요. 나중에 몰래 봤는데 *탠지(통칭)*라고 적혀 있었어요. 통칭이라니, 저는 그게 무슨 뜻인지 몰라서 부엌에서 마르타 아주머니께 여쭤봤는데, 아주머니는 "집사님이 너를 일단 인정했다는 뜻이야"라고 하셨어요. 저는 그날 밤 기뻐서 잠을 못 잤어요.

저는 부엌 일꾼이었어요. 새벽 네 시에 일어나 물을 길어 오고, 불을 지피고, 설거지통을 닦고, 감자를 까고, 바닥을 문질렀어요. 물동이는 무거웠고 팔은 아팠어요. 오른쪽 어깨가 점점 내려앉았지만, 저는 괜찮다고 말했어요. 괜찮다고 말하면 정말 괜찮은 것 같았거든요. 한 달쯤 지나자 손바닥에 물집이 터졌고, 저는 장갑을 껴서 숨겼어요. 누구에게도 들키지 않을 줄 알았어요.

---

첫 월급날이 왔어요.

집사님은 작은 봉투를 책상 위에 놓고 말했어요.

"이번 달 급료입니다. 확인하십시오."

"세어 보지 않아도 돼요!"

"확인하십시오."

저는 세었어요. 정확히 맞았어요. 그런데 집사님이 제 발끝을 보고 있었어요. 구두 밑창이요. 한쪽이 거의 입을 벌리고 있어서, 걸을 때마다 비 오는 날 개구리 같은 소리가 났거든요.

"……이상 없습니다."

"그렇습니까."

그분은 그 이상 아무 말도 안 했어요. 저는 인사하고 나왔어요. 그런데 사흘 뒤 방 앞에 상자가 하나 놓여 있었어요. 새 구두가 들어 있었어요. 발에 딱 맞았어요. 어떻게 크기를 아셨는지 지금도 몰라요. 마르타 아주머니가 가르쳐 주셨어요. 집사님이 청구서에 이렇게 적었다고요.

*비품 교체.*

"비품이요?"

"집사님은 친절을 적을 항목이 장부에 없으시거든."

저는 웃었어요. 한참 웃었어요. 그리고 그날 밤 이불 속에서 조금 울었어요. 이유는 저도 몰라요.

---

수요일마다 저는 오후에 반나절 휴가를 받았어요.

뒷문에서 십오 분을 걸으면 마을 끝 담벼락에 핍이 앉아 있었어요. 핍은 저를 보면 달려오다가 넘어지고, 일어나서 또 달려왔어요. 저는 앞치마 주머니에서 손수건에 싼 빵을 꺼내 줬어요. 점심에 나온 것보다 크게, 반쯤 남은 것을 일부러 남겨 두었다가요.

"누나, 이거 누나 건데."

"나는 많이 먹었어! 저택에는 빵이 엄청 많아!"

"진짜?"

"진짜야!"

그건 거짓말이 아니었어요. 저택에는 정말 빵이 많았어요. 다만 그 빵이 제 입에 들어가는 만큼 핍의 입에 들어갈 수는 없다는 얘기를 안 했을 뿐이에요.

엄마는 집에서 누워 있었어요. 반지는 엄마의 결혼 반지였는데, 전당포 주인이 석 달에 한 번 이자를 받으러 왔다고 했어요. 아빠는 일을 하러 나갔다가 몇 달씩 안 돌아왔어요. 저는 월급 봉투에서 아주 조금만 남기고 엄마 손에 쥐여 드렸어요.

"탠지야, 너는 괜찮니?"

"저택 사람들이 다 좋아요!"

그건 진짜였어요. 정말로요. 다만 '다 좋다'는 말 뒤에 붙이고 싶은 말이 많았어요. 구두가 닳았다든가, 손이 아프다든가. 하지만 그건 제가 말하는 순간 이 집에서의 제 자리가 달라질 것 같았어요. 저는 *일꾼*이니까요. 불쌍한 아이가 되고 싶지 않았어요. 불쌍한 아이는 사람들이 친절하게 대하지만, 일꾼에게는 사람들이 일을 믿고 맡기잖아요.

---

그러던 어느 가을 저녁, 집사님이 저를 집사실로 불렀어요.

저는 뭘 잘못했는지 하루 종일 생각하면서 갔어요. 물을 엎지른 거? 아니면 설거지통 옆에 빵 부스러기를 흘린 거? 하지만 집사님은 의자를 권하며 말했어요.

"내일, 아가씨가 오십니다."

"아가씨요?"

"열 살이십니다. 아버지를 잃고 이 집으로 오십니다. 곁에서 시중을 들 사람이 필요합니다."

"그, 그런 분이 계시는 줄 몰랐어요!"

"공작 각하께서도 말씀이 없으셨고, 저도 오늘 아침에 확정된 일입니다."

집사님은 책상 위의 서류를 가지런히 정리했어요. 손가락 끝이 아주 약간 떨렸어요. 저는 그것을 처음 봤어요.

"오렌지 양을 추천합니다."

"……저요? 저는 부엌 아이인데요?"

"방에 불을 먼저 피우고, 서랍에 노트를 한 벌 넣어 두는 일을 같이 해 주십시오. 그리고."

그분이 처음으로 눈을 내렸어요.

"아가씨께 웃어 주십시오. 그것은 제가 잘하지 못하는 일입니다."

저는 한참 말을 못 했어요. 집사님이 못하는 일이 있다는 것도 처음 알았고, 그걸 저한테 부탁한다는 것도 처음 알았거든요.

"……제일 잘하는 일이에요!"

"알고 있습니다."

"그런데 아가씨가 웃기 싫어하시면요?"

집사님은 그 질문에 대답하지 않았어요. 대신 저를 한 번 보았어요. 아주 작은 웃음 비슷한 것이 입가에 걸렸다가 사라졌어요.

"……오렌지 양은 오늘도 변함없으시군요."

"오렌지 양이라니! 오늘은 기분이 좋으신가 봐요!"

문을 나서며 저는 속으로 다짐했어요. 내일 오시는 아가씨에게 제일 환한 웃음을 보여 드릴 거라고. 그분이 이 집에서 무서워하지 않도록. 아주 크게, 빨리, 틀림없이.

그런데 이상하게도 그날 밤 이불 속에서, 저는 처음으로 웃는 연습이 아니라 이런 걸 생각했어요.

*그 아이도 어쩌면 웃고 싶지 않은 날이 있을지도 몰라.*

그리고 그때는 몰랐어요. 그 열 살짜리 아이가 제 어깨가 내려앉은 걸 이틀 만에 알아채고 물동이를 같이 들겠다고 말할 줄은요. 제가 웃지 않아도 되는 밤을 처음으로 선물받을 줄은요.

내일은 어떤 날일까요? 저는 몰라요. 하지만 일단은 일찍 일어나서 벽난로에 불을 피워 둘 거예요. 서랍에는 노트와 깃펜을 한 벌씩. 그리고 구두는, 새 구두라서 기분이 좋을 거예요.`},

{n:32,ex:true,exNo:2,title:'집사의 시계',season:'겨울',text:`마로트 윌로가 침묵과 거짓말이 다른 것임을 배운 것은 스물네 살의 겨울이었다.

그날 밤은 폭풍이 심했다. 지붕의 기와가 떨어졌고, 마구간의 말들이 한꺼번에 울었다. 마로트는 전임 집사장인 아버지의 지시로 현관 앞에서 램프를 들고 서 있었다. 주인이 황궁에서 돌아오는 시각이 지났는데도 마차가 보이지 않았다. 시계가 자정을 넘길 때쯤, 거센 비 속에서 마차 한 대가 문 앞에 멈췄다.

내린 사람은 에드릭 트로네였다.

외투는 흠뻑 젖었고, 머리카락에서 물이 떨어졌고, 두 팔에는 호두나무 상자가 안겨 있었다. 얼굴은 마로트가 한 번도 본 적 없는 표정이었다. 화를 낸 것도, 슬퍼한 것도 아니었다. 무엇인가를 잃기 직전의 사람이 그것을 겨우 붙잡은 얼굴이었다.

"제가 올리겠습니다."

"아니다."

"각하, 무거우십니다."

"손대지 마라."

마로트는 한 걸음 물러섰다. 처음이었다. 그의 인생에서 주인의 말이 이렇게 단순하고 이렇게 단단하게 들린 적은 없었다. 에드릭은 상자를 안은 채 계단을 올라갔다. 걸음마다 물이 떨어졌다. 이층 가장 왼쪽 방의 문이 닫히는 소리가 났다. 그리고 그 방의 불은 그날 밤 꺼지지 않았다.

마로트는 현관에 서서 램프를 내려놓았다. 손이 떨리고 있었다. 이유를 알 수 없었다.

---

아버지는 그다음 날 아침에 그를 침실로 불렀다.

전임 집사장 아르노 윌로는 몇 달째 폐를 앓고 있었다. 침대에 기대 앉은 얼굴은 종이처럼 얇았지만 눈만은 평소와 같이 정확했다. 아버지는 아들이 문턱에 서자 짧게 말했다.

"어젯밤의 일은 보았느냐."

"……네."

"보았다고 말하지 마라. 누구에게도."

"……."

"각하께서는 무언가를 지키고 계시다. 이유를 묻지 마라. 집사의 일은 대답을 가지는 것이 아니라, 질문을 받지 않게 하는 것이다."

마로트는 고개를 끄덕였다. 그것은 이미 몇 년째 배워 온 일이었다. 그런데 아버지는 거기서 말을 멈추지 않았다.

"한 가지를 더 말하겠다. 침묵은 허락된다. 그러나 거짓은 안 된다."

---

제8신 · 북부, 가을

아델라인 양에게.

날씨는 맑다. 고갯마루의 잔설이 사흘 전에 녹았다.

네가 편지에서 말한 문장을 계속 생각했다. *틀린 해석은 틀린 것이 아니라 아직 읽는 중인 것*이라고 했던가. 나는 오랫동안 첫인상을 바꾸는 일을 패배로 여겼다. 아버지도 그렇게 가르치셨다. 그러나 그 믿음이 나를 틀리게 만든 일이 한 번 있었다. 식탁에서의 일이다.

일 면 · 오류 정정

본지의 전신(前身)인 발행인의 입이 지난 칠 년간 퍼뜨린 소문 중, 사실과 다른 것이 총 열네 건이었습니다. 아래와 같이 정정합니다.

하나. "트로네 공작이 빚 때문에 학자의 딸을 입양했다." 틀렸습니다. 원문은 "공작이 에버하트 박사에게 신세를 졌다"였습니다. 신세와 빚은 다릅니다. 신세는 갚을 수 없어서 더 무겁습니다.

둘. "발트하임 영애가 황후가 될 것이다." 본인이 거절했습니다. 당사자의 말을 직접 인용합니다. "하고 싶지 않아요."

셋. "북부 대공의 아들은 말을 못 하는 사람이다." 틀렸습니다. 말을 못 하는 것이 아니라, 말 대신 편지를 씁니다. 글씨가 오른쪽으로 쏠립니다.

넷. "서부 기사단장의 아들은 웃을 줄 모른다." 틀렸습니다. 귀가 붉어질 때 웃습니다.

여섯부터 열네까지는 지면 관계상 이 면 하단에 작은 글씨로 싣습니다. 작은 글씨를 읽으시려면 안경이 필요합니다.

이 면 · 무도회 보도 (사실만)

지난 겨울, 트로네 공작 저택에서 열린 열여덟 번째 생일 무도회에 본지의 기자는 직접 참석했습니다. 기자는 이 면에 쓰는 모든 문장을 눈으로 확인했습니다. 확인하지 못한 것은 확인하지 못했다고 쓰겠습니다.

· 홀에는 둥근 탁자가 여덟 개 놓여 있었습니다. 상석은 없었습니다.
· 황실 사절 한 분이 "상석은 어디입니까"라고 입장 직후 세 번 물었습니다. 마로트 집사는 세 번 모두 같은 말로 대답했습니다. "이 홀에는 상석이 없습니다."
· 촛불은 총 이백열 개였습니다. 그중 세 개는 도중에 꺼졌고, 한 개는 하델 오르포스 기사가 몰래 다시 붙였습니다.

· 영애는 연설 중 중간층계참에서 서 있었습니다. 손이 떨렸는지는 본지가 확인하지 못했습니다. 다만 본지의 기자는 자신의 손이 떨렸다고 자백합니다. 그 이유로 수첩의 글씨가 평소보다 열한 퍼센트 번졌습니다.
· 발트하임 백작이 증언했을 때, 홀은 약 사십 초 동안 아무 소리도 나지 않았습니다. 기자가 이 시간을 측정한 이유는 소리가 나지 않는 것이 너무 신기해서입니다.
· 황제가 법을 약속했을 때 박수가 나왔습니다. 처음 박수를 친 사람은 기자가 아닙니다. 기자는 두 번째입니다.
· 영애가 "아버지"라고 부른 순간, 홀 안에서 우는 사람의 수는 기자가 세다가 포기했습니다. 사실입니다. 포기한 사실도 사실입니다.

---

삼 면 · 확인되지 않은 것들

· 영애의 푸른 드레스 소매에 노트 모양의 자수가 있었다는 것은 확인되었습니다. 그것을 누가 그렸는지는 확인되지 않았습니다. 다만 공작의 소매에 잉크 얼룩이 있었다는 제보가 있습니다.
· 마로트 집사가 이날 회중시계를 찼다는 제보가 있습니다. 확인되었습니다. 기자는 시계를 보지 못했지만 그가 하루 종일 조끼 쪽으로 손이 가는 것을 보았습니다.
· 영애가 무도회 이후 어느 곳으로 가는지, 누구와 가는지에 대한 질문이 독자 투고로 열두 건 들어왔습니다. 본지는 모릅니다. 영애도 아직 모른다고 합니다.

독자 문의

Q. 사실만 쓰면 재미가 없지 않습니까?

A. 네.

A. 소문은 재미있고 금방 잊혀집니다. 사실은 재미없고 오래 갑니다. 선택은 독자의 몫입니다.

Q. 발행인께서는 소문을 퍼뜨리신 일을 후회하십니까?

{n:37,ex:true,exNo:7,title:'서재의 불',season:'겨울',text:`에드릭 트로네는 그날 아침 이층 서재의 창가에 서 있었다.

마중은 나가지 않기로 했다. 몇 번이나 스스로에게 되풀이한 결정이었다. 나가면 아이가 놀랄 것이다. 아이를 놀라게 하는 법밖에 모른다. 그는 모든 것을 잘 알았다. 문서를, 군령을, 사람의 얼굴이 거짓을 말하는 순간을. 하지만 열 살 아이를 맞이하는 법은 한 번도 배운 적이 없었다.

에드릭은 의자에서 일어나 서재로 돌아와 불을 켜 두었다. 그날 밤도 불은 꺼지지 않았다. 하지만 이번에는 이유가 달랐다.

---

열흘째 되는 밤이었다.

서재 문 아래에 아주 작은 소리가 났다. 그는 펜을 멈추었다. 누군가 문 앞에서 숨을 고르고 있었다. 한참 서 있다가, 돌아섰다. 그가 문을 열었을 때는 복도에 아무도 없었다. 바닥에 잔이 하나 놓여 있었다.

유품 상자의 일은 그가 가장 두려워한 순간이었다.

봄이 오기 전까지 그는 거울 앞에서 한 이름을 불렀다.

---

const root=document.documentElement;
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null){ localStorage.removeItem(k); return null; } localStorage.setItem(k,v); return v; }catch(e){ return null; } }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inline(s){ return esc(s).replace(/~~([^~]+)~~/g,'<del>$1</del>').replace(/\*([^*]+)\*/g,'<em>$1</em>'); }
// 노트 한 줄 (줄을 그은 노트는 취소선)
function jotText(id){ const t=esc(NOTICES[id].text); return (S.crossed&&S.crossed[id])?'<del>'+t+'</del>':t; }
function renderText(text){
  let out='';
  text.split(/\n\s*\n/).forEach(b=>{
    b=b.trim(); if(!b) return;
    if(b==='---'){ out+='<hr>'; return; }
    if(b.startsWith('*—')){
      const lines=b.split('\n');
      lines.forEach((l,i)=>{ out+='<p class="note'+(i===0?' first':'')+(i===lines.length-1?' last':'')+'">'+esc(l.replace(/^\*|\*$/g,'')).replace(/~~([^~]+)~~/g,'<del>$1</del>')+'</p>'; });
      return;
    }
    out+='<p>'+inline(b)+'</p>';
  });
  return out;
}

function applyPref(){
  root.style.setProperty('--fs',pref.fs+'px');
  if(pref.theme==='auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme',pref.theme);
  root.style.setProperty('--dim',[1,.88,.76][pref.dim||0]);

}

function notebookHtml(p){
  // p.pre: 이 장면 id로 시작하는 장면에서 적은 노트만 (기본: 1장 s*), p.empty: 하나도 없을 때 문장
  p=p||{}; const re=p.pre?new RegExp('^'+p.pre):/^s\d/;
  const early=Object.keys(SCENES).filter(k=>re.test(k));
  const ids=Object.keys(S.noticed).filter(id=>NOTICES[id]&&early.indexOf(NOTICES[id].scene)>=0).sort((x,y)=>S.noticed[x]-S.noticed[y]).slice(-4);
  if(!ids.length) return '<p class="hint">'+esc(p.empty||'낡은 노트는 거의 비어 있었다.')+'</p>';
  return ids.map(id=>'<div class="jot">'+jotText(id)+'</div>').join('');
}
function sceneHtml(){
  const sc=SCENES[S.scene];
  const stage=stageSVG(sc.place,sc.season,sc.chars,sc.time,sc.props);
  let paras='';
  (sc.paras||[]).forEach(p=>{
    let t=p;
    if(typeof p==='object'){
      if(p.if&&!S.flags[p.if]) return; if(p.not&&S.flags[p.not]) return;
      if(p.ifN&&!S.noticed[p.ifN]) return; if(p.notN&&S.noticed[p.notN]) return;
      if(p.fn==='notebook'){ paras+=notebookHtml(p); return; }
      t=p.t;
    }
    paras+='<p>'+inline(t).replace(/\{\{(\w+)\|([^}]+)\}\}/g,(m,id,ph)=>'<span class="notice'+(S.noticed[id]?' done':'')+'" role="button" tabindex="0" data-act="notice" data-id="'+id+'">'+ph+'</span>')+'</p>';
  });
  let jots='';
  Object.keys(NOTICES).forEach(id=>{ if(NOTICES[id].scene===S.scene&&S.noticed[id]) jots+='<div class="jot">'+jotText(id)+'</div>'; });
  let body;
  if(sc.end){
    const n=Object.keys(S.noticed).length;
    body='<div class="endcard"><h3>'+(sc.endTitle||'여기까지예요')+'</h3><p>알아차린 것 '+n+'줄이 노트에 적혀 있어요. 무엇을 알아챘는지에 따라 달라진 장면이 있었어요. 다음 장면은 순서대로 추가될 거예요.</p></div>';
  } else {
    const left=Object.keys(NOTICES).some(id=>NOTICES[id].scene===S.scene&&!NOTICES[id].byChoice&&!S.noticed[id]);   // 선택으로 적히는 노트(byChoice)는 밑줄 안내에서 뺀다
    body=paras+(left?'<div class="hint">밑줄 친 부분을 누르면 노트에 적어요</div>':'')+jots;
  }
  let ch='';
  if(sc.end&&ui.confirmEnd){ ch='<div class="hint">저장된 이야기가 지워져요. 처음부터 시작할까요?</div><button class="choice" data-act="endNo">취소</button><button class="choice" data-act="endYes">처음부터 시작</button>'; }
  else (sc.choices||[]).forEach((c,i)=>{ if(c.req&&!S.noticed[c.req]) return; if(c.not&&S.noticed[c.not]) return; ch+='<button class="choice" data-act="choice" data-i="'+i+'">'+esc(c.label)+'</button>'; });
  return '<div class="scroller" id="tb"><div class="stage">'+stage+'</div><div class="textbox">'+body+'<div class="choices">'+ch+'</div></div></div>';
}

      o+='<div class="field">현재 장면<span style="color:var(--soft);font-size:13px">'+esc(SCENES[S.scene].chLabel)+'</span></div><div class="field">저장 코드<button data-act="toggleCode">'+(ui.code?'숨기기':'보기')+'</button></div>';

    return o+'</div></div>';
  }
  if(sub==='library') return back('이야기 서재')+'<div class="pc"><ul class="toc">'+tocHtml()+'</ul></div>';
  if(sub==='reader') return readerHtml();
  if(sub==='chars'){
    let o=back('인물 사전')+'<div class="pc">';
    DICT.forEach(d=>{ o+='<div class="chr"><div class="av">'+figSVG(d.id)+'</div><div><h4>'+d.name+'</h4><div class="rl">'+d.role+'</div><p>'+d.desc+'</p></div></div>'; });

function tocHtml(){
  let h='',v=0;
  CHAPTERS.forEach(c=>{ const cv=volOf(c.n); if(cv!==v){ v=cv; h+='<li class="vol">'+VOLS[v]+'</li>'; }
    h+='<li><button class="it" data-act="chap" data-n="'+c.n+'"><span class="no">'+chLabel(c)+'</span><span class="tt">'+c.title+'</span><span class="se">'+c.season+'</span></button></li>'; });
  return h;
}
function readerHtml(){
  const c=CHAPTERS.find(x=>x.n===ui.chap); if(!c) return '';
  const i=CHAPTERS.indexOf(c), prev=CHAPTERS[i-1], next=CHAPTERS[i+1];
  let o=head(chLabel(c),'서재','sub','library',true)+'<div class="pc"><article class="chapter"><div class="meta">'+VOLS[volOf(c.n)]+' · '+c.season+'</div><h3>'+c.title+'</h3>'+renderText(c.text);
  if(c.branches){
    const groups=[]; c.branches.forEach(b=>{ let g=groups.find(x=>x.t===b.group); if(!g){ g={t:b.group,items:[]}; groups.push(g);} g.items.push(b); });
    o+='<section class="fork"><h4>이야기가 갈라지는 곳</h4><p class="hint2">읽고 싶은 길을 하나 고르세요. 어느 길이든 마지막 장면은 같아요.</p>';
    groups.forEach(g=>{ o+='<div class="ft">'+g.t+'</div>'; g.items.forEach(b=>{ o+='<button class="fb'+(ui.fork===b.id?' on':'')+'" data-act="branch" data-id="'+b.id+'">'+b.label+'</button>'; }); });
    const b=c.branches.find(x=>x.id===ui.fork);
    if(b) o+='<div class="epi" id="epi"><h5>'+b.label+'</h5>'+renderText(b.text)+'<hr>'+renderText(c.closing)+'<p class="end">《트로네 공작가의 아델라인》은 여기까지예요.<br>위에서 다른 길도 읽어 보세요.</p></div>';
    o+='</section>';
  }
  o+='<div class="pager"><button data-act="chap" data-n="'+(prev?prev.n:'')+'" class="'+(prev?'':'ghost')+'">이전 장</button><button data-act="chap" data-n="'+(next?next.n:'')+'" '+(next?'':'class="ghost"')+'>다음 장</button></div></article></div>';
  return o;
}

function resetGame(){ S=freshSave(); persist(); ui={screen:'game',tab:null,sub:'root',chap:null,fork:null,confirm:false,msg:'',code:false,keep:'top'}; draw(); }

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, v=el.dataset.v;
  switch(act){
   case 'continue': ui.screen='game'; ui.tab=null; break;
   case 'new': if(S){ ui.confirm=true; } else { resetGame(); return; } break;
   case 'cancelNew': ui.confirm=false; break;
   case 'doNew': ui.confirm=false; resetGame(); return;
   case 'doNewGame': ui.confirm=false; S=freshSave(); persist(); ui.tab=null; ui.sub='root'; ui.screen='game'; ui.keep='top'; break;
   case 'askNew': ui.confirm=true; break;
   case 'titleSettings': ui.screen='titleSettings'; ui.sub='root'; break;
   case 'backTitle': ui.screen='title'; ui.sub='root'; break;
   case 'tab': ui.tab=(ui.tab===el.dataset.tab)?null:el.dataset.tab; ui.sub='root'; ui.confirm=false; ui.msg=''; break;
   case 'closeTab': ui.tab=null; ui.sub='root'; break;
   case 'sub': ui.sub=v; ui.confirm=false; ui.msg=''; break;
   case 'chap': if(el.dataset.n){ ui.chap=+el.dataset.n; ui.sub='reader'; ui.fork=null; ui.keep='top'; const pn=$('.panel'); if(pn) pn.scrollTop=0; } break;
   case 'branch': ui.fork=el.dataset.id; draw(); { const ep=$('#epi'); if(ep&&ep.scrollIntoView) ep.scrollIntoView({block:'start'}); } return;
   case 'fs': pref.fs=Math.max(14,Math.min(26,pref.fs+(+v))); applyPref(); break;
   case 'theme': pref.theme=v; applyPref(); break;
   case 'qtheme': { const order=['light','paper','dark']; pref.theme=order[(order.indexOf(curTheme())+1)%3]; applyPref(); break; }
   case 'dim': pref.dim=+v; applyPref(); break;
   case 'sound': pref.sound=v==='1'; applyPref(); break;
   case 'toggleCode': ui.code=!ui.code; break;
   case 'copyCode': { const ta=$('#codeOut'); if(ta){ ta.select(); try{ navigator.clipboard.writeText(ta.value); ui.msg='복사했어요.'; }catch(err){ ui.msg='선택된 코드를 직접 복사해 주세요.'; } } break; }
   case 'importCode': { const ta=$('#codeIn'); let ok=false; try{ const j=JSON.parse(atob((ta.value||'').trim())); if(j&&SCENES[j.scene]){ S={scene:j.scene,noticed:j.noticed||{},flags:j.flags||{},crossed:j.crossed||{}}; persist(); ok=true; } }catch(err){} ui.msg=ok?'불러왔어요.':'코드를 읽지 못했어요. 다시 확인해 주세요.'; break; }
   case 'endNo': ui.confirmEnd=false; break;
   case 'endYes': ui.confirmEnd=false; resetGame(); return;
   case 'notice': { const id=el.dataset.id; if(!S.noticed[id]){ S.noticed[id]=Date.now(); persist(); } break; }
   case 'choice': {
     const sc=SCENES[S.scene], c=sc.choices[+el.dataset.i]; if(!c) return;
     if(c.flag) S.flags[c.flag]=1;
     if(c.note&&!S.noticed[c.note]) S.noticed[c.note]=Date.now();   // 선택으로 노트에 적기
     if(c.cross&&S.noticed[c.cross]){ if(!S.crossed) S.crossed={}; S.crossed[c.cross]=Date.now(); }   // 노트 줄 긋기
     if(c.go==='notes'){ ui.tab='notes'; }
     else if(c.go==='library'){ ui.tab='settings'; ui.sub='reader'; ui.chap=c.chap||4; ui.fork=null; }
     else if(c.go==='restart'){ ui.confirmEnd=true; }
     else if(c.next){ S.scene=c.next; ui.keep='top'; }
     persist(); break;
   }
   default: return;
  }
  draw();
  if(act==='choice'){ const tb=$('#tb'); if(tb) tb.scrollTop=0; }
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.getAttribute&&e.target.getAttribute('role')==='button'){ e.preventDefault(); e.target.click(); }
});
applyPref();
draw();

</script>
</body>
</html>
