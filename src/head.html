<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>트로네 공작가의 아델라인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ecece6; --panel:#f6f6f1; --ink:#26222c; --soft:#6a6672; --line:#cfd0c8; --accent:#7a4f3a; --fs:18px;
  --serif:'Noto Serif KR','Nanum Myeongjo','Apple SD Gothic Neo','Malgun Gothic',serif;
  --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#11141b; --panel:#1a1e28; --ink:#dcd9d2; --soft:#8f8c96; --line:#2d3240; --accent:#c9a27f; }
}
:root[data-theme="dark"]{ --bg:#11141b; --panel:#1a1e28; --ink:#dcd9d2; --soft:#8f8c96; --line:#2d3240; --accent:#c9a27f; }
:root[data-theme="light"]{ --bg:#ecece6; --panel:#f6f6f1; --ink:#26222c; --soft:#6a6672; --line:#cfd0c8; --accent:#7a4f3a; }
:root[data-theme="paper"]{ --bg:#eadfc8; --panel:#f2e8d4; --ink:#3a2e24; --soft:#7a6a58; --line:#d4c4a6; --accent:#8a4f2a; }
#app{ filter:brightness(var(--dim,1)); }
.status .qt{ display:flex; align-items:center; gap:10px; }
.qbtn{ border:0; background:none; padding:4px; margin:0 -4px 0 0; color:var(--soft); display:flex; align-items:center; cursor:pointer; }
.qbtn svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.ph .qbtn{ margin-left:auto; }
html{ height:100%; }
body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--sans); word-break:keep-all; -webkit-text-size-adjust:100%; }
button{ font:inherit; color:inherit; background:none; border:1px solid var(--line); border-radius:8px; padding:.55em 1em; cursor:pointer; }
button:hover{ border-color:var(--accent); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.serif{ font-family:var(--serif); }
#app{ position:relative; height:100%; max-width:520px; margin:0 auto; overflow:hidden; background:var(--bg); }
svg{ display:block; }

.title{ position:absolute; inset:0; background:#0b0f20; color:#f3e6c4; }
.title .bgsvg{ position:absolute; inset:0; width:100%; height:100%; }
.tt-wrap{ position:relative; padding:calc(8vh + env(safe-area-inset-top,0px)) 24px 0; text-align:center; }
.tt-h{ margin:0; font-family:var(--serif); font-weight:700; color:#f3e6c4; font-size:clamp(34px,10vw,46px); line-height:1.2; letter-spacing:.04em; text-shadow:0 2px 0 rgba(10,8,20,.55),0 0 18px rgba(10,8,30,.6); }
.tt-k{ display:block; font-size:.42em; font-weight:600; letter-spacing:.32em; color:#d9c08a; margin-bottom:.5em; padding-left:.32em; }
.tt-orn{ display:flex; align-items:center; justify-content:center; gap:8px; margin:14px auto 0; width:min(220px,60vw); }
.tt-orn i{ flex:1; height:1px; background:linear-gradient(90deg,transparent,#c9a057); }
.tt-orn i:last-child{ background:linear-gradient(90deg,#c9a057,transparent); }
.tt-orn b{ width:6px; height:6px; background:#c9a057; transform:rotate(45deg); }
.tt-menu{ position:absolute; left:0; right:0; bottom:0; padding:0 36px calc(40px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:12px; align-items:center; }
.tbtn{ position:relative; width:100%; max-width:260px; padding:.8em 1em; font-family:var(--serif); font-size:15px; font-weight:600; letter-spacing:.24em; color:#e9dcbc; border:1px solid rgba(201,160,87,.55); border-radius:2px; background:rgba(10,12,28,.62); box-shadow:inset 0 0 0 3px rgba(10,12,28,.62),inset 0 0 0 4px rgba(201,160,87,.22); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); }
.tbtn.main{ color:#1c1426; border-color:#e2c57e; background:linear-gradient(#ecd49a,#c9a057); box-shadow:inset 0 0 0 3px rgba(236,212,154,.0),inset 0 0 0 4px rgba(94,66,32,.35); }
.tbtn.main::before,.tbtn.main::after{ content:''; position:absolute; top:50%; width:5px; height:5px; margin-top:-3px; background:#5e4220; transform:rotate(45deg); }
.tbtn.main::before{ left:16px; } .tbtn.main::after{ right:16px; }
.tbtn:active{ filter:brightness(.92); }
.tt-confirm{ font-size:13px; color:#f3e6c4; text-align:center; line-height:1.7; background:rgba(10,12,28,.7); border:1px solid rgba(201,160,87,.4); padding:12px 14px; }
.tt-confirm .r{ display:flex; gap:8px; justify-content:center; margin-top:8px; }

.gs{ position:absolute; inset:0; display:flex; flex-direction:column; background:var(--bg); }
.status{ flex:0 0 auto; height:38px; display:flex; justify-content:space-between; align-items:center; padding:0 14px; font-size:12px; color:var(--soft); border-bottom:1px solid var(--line); }
.main{ position:relative; flex:1; min-height:0; display:flex; flex-direction:column; }
.scroller{ flex:1; min-height:0; overflow-y:auto; background:var(--panel); -webkit-overflow-scrolling:touch; }
.stage{ width:100%; aspect-ratio:3/2; max-height:300px; background:#222; overflow:hidden; }
.px{ image-rendering:pixelated; image-rendering:-moz-crisp-edges; image-rendering:crisp-edges; display:block; width:100%; height:100%; object-fit:cover; }
.stage img{ width:100%; height:100%; }
:root[data-theme="dark"] .stage img{ filter:brightness(.85); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .stage img{ filter:brightness(.85); } }
.textbox{ padding:18px 18px 40px; background:var(--panel); border-top:1px solid var(--line); }
.textbox p{ font-family:var(--serif); font-size:var(--fs); line-height:2; margin:0 0 1em; }
.notice{ border-bottom:1px dotted var(--accent); color:var(--accent); cursor:pointer; }
.notice.done{ border-bottom-style:solid; color:var(--soft); }
.jot{ margin:.2em 0 1em; padding-left:.9em; border-left:2px solid var(--accent); font-family:var(--serif); font-style:italic; color:var(--soft); font-size:calc(var(--fs) - 2px); line-height:1.8; }
.hint{ font-size:12px; color:var(--soft); margin:0 0 1em; }
.choices{ margin-top:1.2em; }
.choice{ display:block; width:100%; text-align:left; padding:.8em 1em; margin:0 0 8px; font-family:var(--serif); font-size:calc(var(--fs) - 2px); line-height:1.6; background:transparent; }
.endcard h3{ margin:0 0 .5em; font-family:var(--sans); font-size:17px; font-weight:500; }
.endcard p{ font-family:var(--sans) !important; font-size:15px !important; line-height:1.8 !important; color:var(--soft); }

.nav{ flex:0 0 auto; display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--line); background:var(--bg); }
.nav button{ border:0; border-radius:0; padding:8px 0 7px; font-size:11.5px; color:var(--soft); display:flex; flex-direction:column; align-items:center; gap:3px; }
.nav button.on{ color:var(--accent); }
.nav svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }

.panel{ position:absolute; inset:0; background:var(--bg); overflow-y:auto; z-index:3; }
.ph{ position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:6px; padding:10px 12px; background:var(--bg); border-bottom:1px solid var(--line); }
.ph h2{ margin:0; font-size:16px; font-weight:500; flex:1; }
.ph .bk{ border:0; padding:6px 8px; display:flex; align-items:center; gap:2px; font-size:13px; color:var(--soft); }
.ph .bk svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.pc{ padding:14px 16px 40px; }
.empty{ padding:56px 12px; text-align:center; color:var(--soft); line-height:1.8; font-size:14px; }
.empty b{ display:block; color:var(--ink); font-weight:500; font-size:16px; margin-bottom:6px; }
.row{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); border-radius:0; padding:15px 4px; font-size:15px; }
.row .v{ margin-left:auto; color:var(--soft); font-size:13px; }
.row svg{ width:16px; height:16px; fill:none; stroke:var(--soft); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; }
.seg{ display:flex; gap:6px; }
.seg button{ padding:.4em .9em; font-size:13px; }
.seg button.on{ border-color:var(--accent); color:var(--accent); }
.field{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 4px; border-bottom:1px solid var(--line); font-size:15px; }
.note-s{ font-size:13px; color:var(--soft); line-height:1.7; padding:10px 4px; }
.notebook .ent{ margin:0 0 1.2em; }
.notebook .lab{ font-size:12px; color:var(--soft); margin:1.4em 0 .4em; }
.notebook .jot{ margin:0; }
.places{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.place{ border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel); }
.place .th{ aspect-ratio:6/5; background:#222; }
.place .th img{ width:100%; height:100%; image-rendering:auto; }
.place .nm{ padding:8px 10px 10px; font-size:13.5px; }
.place .nm small{ display:block; color:var(--soft); font-size:11.5px; margin-top:2px; }
.place.cur{ border-color:var(--accent); }
.chr{ display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
.chr .av{ flex:0 0 56px; height:64px; background:#d9d3e0; border-radius:6px; overflow:hidden; }
.chr .av img{ width:100%; height:100%; object-fit:cover; object-position:top; }
.chr h4{ margin:0; font-size:15px; font-weight:500; }
.chr .rl{ font-size:12px; color:var(--accent); margin:2px 0 4px; }
.chr p{ margin:0; font-size:13.5px; line-height:1.7; color:var(--soft); }
textarea{ width:100%; box-sizing:border-box; min-height:84px; font:12px/1.5 monospace; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px; }
.msg{ font-size:13px; color:var(--accent); padding:6px 4px; }

.toc{ list-style:none; margin:0; padding:0; }
.toc li{ border-bottom:1px solid var(--line); }
.toc li.vol{ padding:22px 2px 8px; color:var(--accent); font-size:13px; font-weight:500; }
.toc .it{ display:flex; gap:12px; align-items:baseline; width:100%; padding:13px 2px; border:0; border-radius:0; text-align:left; }
.toc .no{ min-width:3.4em; white-space:nowrap; color:var(--soft); font-size:13px; }
.toc .tt{ flex:1; font-size:15px; }
.toc .se{ color:var(--soft); font-size:12px; }
.chapter{ font-family:var(--serif); }
.chapter .meta{ color:var(--accent); font-size:13px; margin-bottom:.7em; font-family:var(--sans); }
.chapter h3{ font-size:clamp(22px,6vw,28px); line-height:1.4; font-weight:700; margin:0 0 1.4em; }
.chapter p{ font-size:var(--fs); line-height:2.05; margin:0 0 1.15em; }
.chapter p.note{ margin:0 0 .3em; padding-left:1em; border-left:2px solid var(--accent); color:var(--soft); font-style:italic; }
.chapter p.note.first{ margin-top:1.4em; } .chapter p.note.last{ margin-bottom:1.6em; }
.chapter hr{ border:0; margin:2.4em 0; text-align:center; } .chapter hr::after{ content:"·  ·  ·"; letter-spacing:.6em; color:var(--soft); }
.pager{ display:flex; gap:10px; margin-top:3em; padding-top:1.4em; border-top:1px solid var(--line); font-family:var(--sans); }
.pager button{ flex:1; padding:.8em; } .pager .ghost{ visibility:hidden; }
.fork{ margin:2.6em 0 1em; padding-top:1.6em; border-top:1px solid var(--line); font-family:var(--sans); }
.fork h4{ font-size:17px; margin:0 0 .5em; font-weight:500; }
.fork .hint2{ color:var(--soft); font-size:13.5px; line-height:1.8; margin:0 0 1em; }
.fork .ft{ font-size:12.5px; color:var(--accent); margin:1.2em 0 .5em; font-weight:500; }
.fork button.fb{ display:block; width:100%; text-align:left; margin:0 0 8px; padding:.8em 1em; font-size:14.5px; }
.fork button.fb.on{ border-color:var(--accent); background:var(--panel); }
.epi{ margin-top:2.2em; } .epi h5{ font-size:19px; margin:0 0 1.2em; font-family:var(--serif); }
.end{ color:var(--soft); text-align:center; font-size:13.5px; margin-top:2em; line-height:1.8; font-family:var(--sans); }
.logpage{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 18px 10px; margin:4px 0 12px; min-height:260px; }
.logpage.turn-next{ animation:logNext .22s ease-out; } .logpage.turn-prev{ animation:logPrev .22s ease-out; }
@keyframes logNext{ from{ opacity:.3; transform:translateX(24px); } to{ opacity:1; transform:none; } }
@keyframes logPrev{ from{ opacity:.3; transform:translateX(-24px); } to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce){ .logpage.turn-next,.logpage.turn-prev{ animation:none; } }
.logv{ font-family:var(--serif); font-size:26px; color:var(--accent); }
.logd{ font-size:12px; color:var(--soft); margin-top:2px; }
.logt{ font-family:var(--serif); font-weight:500; font-size:17px; margin:12px 0 8px; }
.logl{ margin:0; padding-left:1.1em; line-height:1.75; font-size:15px; } .logl li{ margin-bottom:6px; }
.lognav{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.lognav button{ border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:8px; padding:.55em 1em; font-size:14px; }
.lognav button[disabled]{ opacity:.35; } .lognav span{ font-size:13px; color:var(--soft); }
</style>
</head>
<body>
<div id="app"></div>
<script>
